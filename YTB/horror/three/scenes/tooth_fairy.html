// ================================================================ poses
function reset(P) {
  P.root.position.set(0, 0, 0); P.root.rotation.set(0, 0, 0); P.hips.position.set(0, .82, 0); P.hips.rotation.set(0, 0, 0);
  P.chest.rotation.set(0, 0, 0); P.neck.rotation.set(0, 0, 0); P.head.rotation.set(0, 0, 0); P.back.rotation.set(0, 0, 0);
  P.arms.forEach(({up, fo, hand}, i) => { up.rotation.set(0, 0, (i ? 1 : -1) * .06); fo.rotation.set(-.12, 0, 0); hand.rotation.set(0, 0, 0); });
  P.legs.forEach(({th, sh, ft}) => { th.rotation.set(0, 0, 0); sh.rotation.set(0, 0, 0); ft.rotation.set(0, 0, 0); });
  P.eyes('open'); P.brows(0); P.mouth('closed');
}
function lieInBed(P, z = -.06) {           // on her back, head on the pillow, face up
  P.root.rotation.x = -PI / 2 + .08; P.root.position.set(0, .66, z);
  P.arms.forEach(({up, fo}, i) => { up.rotation.z = (i ? 1 : -1) * .12; fo.rotation.x = -.6; });
}
function sitUpInBed(P) {                    // sitting up against the headboard, legs under the blanket
  P.root.position.set(0, -.27, -1.42); P.hips.rotation.x = 0; P.chest.rotation.x = -.12;
  P.legs.forEach(({th}) => th.rotation.x = -1.57);
}
function sitOnBed(P, x, z, ry) {             // sitting on the edge of the bed
  P.root.position.set(x, -.37, z); P.root.rotation.y = ry; P.legs.forEach(({th, sh}) => { th.rotation.x = -1.5; sh.rotation.x = 1.5; });
}
function walk(P, t, speed = 1, amp = 1) {
  const ph = t * PI * 2 * speed, sw = Math.sin(ph);
  P.hips.position.y = .82 - (1 - Math.cos(.42 * amp * sw)) * .74 + Math.abs(Math.cos(ph)) * .012 * amp;
  P.hips.rotation.y = sw * .08; P.chest.rotation.y = -sw * .14;
  P.legs.forEach(({th, sh, ft}, i) => { const q = i ? -sw : sw, kn = Math.max(0, Math.sin(ph + (i ? PI : 0) - .6)) * (.9 + .5 * (amp - 1));
    th.rotation.x = -q * .42 * amp; sh.rotation.x = kn; ft.rotation.x = -kn * .5 + q * .2; });
  P.arms.forEach(({up, fo}, i) => { const q = i ? sw : -sw; up.rotation.x = -q * .4 * amp; fo.rotation.x = -.2 - Math.max(0, q) * .4 * amp; });
}
function fairyStand(F) {
  F.root.position.set(0, 0, 0); F.root.rotation.set(0, 0, 0); F.pelvis.position.set(0, .95, 0);
  F.legs.forEach(({th, sh, ft}, i) => { th.rotation.set(-.55, 0, (i ? 1 : -1) * .08); sh.rotation.set(1.0, 0, 0); ft.rotation.set(-.45, 0, 0); });
  F.spine.rotation.set(.55, 0, 0); F.neck.rotation.set(.2, 0, 0); F.head.rotation.set(-.95, 0, 0); F.mouth.scale.set(1.25, 1.25, 1.25);
  F.arms.forEach(a => { a.up.rotation.set(-.5, 0, a.sd * .25); a.fo.rotation.set(-.35, 0, 0); a.hd.rotation.set(-.2, 0, 0); curl(a, .25); });
  F.wings.forEach((w, i) => w.rotation.set(-.2, (i ? 1 : -1) * .6, (i ? 1 : -1) * -.35));
}
function moveTo(obj, part, target) {         // shift obj so that the given part lands on target (world)
  obj.updateMatrixWorld(true); const p = part.getWorldPosition(V(0, 0, 0)); obj.position.add(target.clone().sub(p));
}
const aim = (g, dir) => g.quaternion.setFromUnitVectors(V(0, -1, 0), dir.clone().normalize());

const L = {}; // line starts (from layout.json)
const C = (p, l, fov = 40) => { cam.position.copy(p); cam.lookAt(l); if (cam.fov !== fov) { cam.fov = fov; cam.updateProjectionMatrix(); } };
const HOOKCAM = [V(.16, 1.0, -1.42), V(0, .66, -1.66), 34];
const emptyScene = new THREE.Scene(); emptyScene.background = new THREE.Color(0x000000);
let black = false;

function frame(t) {
  const q = Math.floor(t * 12) / 12;                // stop-motion: poses on twos
  boil(Math.floor(t * 6));
  reset(haru); reset(mum); fairyStand(tf);
  haru.root.visible = true; mum.root.visible = false; tf.root.visible = false; claw.visible = false;
  hTooth.visible = false; mGlass.visible = false; glass.visible = false; heroCoin.visible = false; book.visible = false; coins.visible = false;
  smoke.forEach(s => s.visible = false); pillowP.rotation.set(0, 0, 0); doorP.rotation.y = 0; bDoorP.rotation.y = 0; lockTurn.rotation.z = 0;
  black = false;

  if (t < 3.4) {                                     // HOOK: Haru in bed at night, mouth shut; she parts her lips: empty gums
    lights({moon: 1.1, amb: .08, rim: .5}); rimC.position.set(-.4, 1.0, -1.3);
    lieInBed(haru); glass.visible = true; haru.eyes('wide'); haru.brows(.6);
    haru.mouth(q > 2.2 ? 'gums' : 'pressed', clamp01((q - 2.2) / .5));
    C(HOOKCAM[0], HOOKCAM[1], HOOKCAM[2]);
  } else if (t < 7.0) {                              // the tooth on the plate
    lights({din: 3.2, amb: .05});
    haru.root.visible = false; reset(mumD); mumD.root.visible = false;
    C(V(-19.82, 1.02, .42), V(-19.93, .8, .19), 30);
    cam.position.x += Math.sin(q * .4) * .004;
  } else if (t < 11.2) {                             // Mum, across the table, lips pressed
    lights({din: 3.2, amb: .05}); haru.root.visible = false;
    reset(mumD); mumD.root.visible = true; sitOnBed(mumD, 0, -.62, 0); mumD.root.position.y = -.4;
    mumD.mouth('pressed'); mumD.neck.rotation.x = .25; mumD.head.rotation.x = .15; mumD.brows(-.2);
    mumD.arms.forEach(({up, fo}) => { up.rotation.x = -.5; fo.rotation.x = -.9; });
    const k = ease((q - 7) / 4.2);
    C(V(-20 + .05, 1.42 - k * .04, .32 - k * .22), V(-20, 1.38, -.6), 32);
  } else if (t < 17.6) {                             // bedtime: Mum on the edge of the bed, the warning; the tooth goes under the pillow
    lights({moon: .6, bedLamp: 2.2, amb: .08});
    lieInBed(haru); haru.eyes('open'); haru.brows(.3);
    mum.root.visible = true; sitOnBed(mum, .5, -1.05, -PI / 2); mum.mouth('closed'); mum.chest.rotation.x = .2; mum.neck.rotation.x = .2; mum.head.rotation.set(.25, 0, 0);
    mum.arms[0].up.rotation.x = -.7;
    if (q > 15.6) { mum.mouth('pressed'); }
    pillowP.rotation.z = q > 11.6 && q < 12.6 ? .22 : 0;
    const k = ease((q - 11.2) / 6.4);
    C(V(1.15 - k * .2, 1.45, -.05 - k * .2), V(.12, .66, -1.4), 38);
  } else if (t < 20.6) {                             // morning: the pillow lifts
    lights({dawn: 1.2, moon: 0, amb: .12, winCol: 0x8aa0c0});
    haru.root.visible = false; heroCoin.visible = true; heroCoin.position.set(.1, .475, -1.66);
    pillowP.rotation.z = ease((q - 18.0) / 1.2) * .9;
    C(V(.45, .95, -1.1), V(.1, .5, -1.62), 36);
  } else if (t < 24.3) {                             // macro: the cold coin, bitten
    lights({dawn: 1.2, amb: .12, winCol: 0x8aa0c0, rim: .6}); rimC.position.set(-.3, .7, -1.4);
    haru.root.visible = false; heroCoin.visible = true; heroCoin.position.set(.1, .475, -1.66); pillowP.rotation.z = .9;
    heroCoin.rotation.y = q * .05;
    C(V(.18, .6, -1.54), V(.1, .475, -1.66), 30);
  } else if (t < 30.4) {                             // the storybook fairy
    lights({dawn: .9, amb: .14, winCol: 0x7a90b0, bedLamp: 1.0});
    reset(haru); sitUpInBed(haru); haru.neck.rotation.x = .35; haru.head.rotation.x = .2;
    haru.arms.forEach(({up, fo}, i) => { up.rotation.set(-.75, 0, (i ? 1 : -1) * .15); fo.rotation.x = -.9; });
    book.visible = true; book.position.set(0, .86, -1.02); book.rotation.set(.75, 0, 0);
    const k = ease((q - 24.3) / 6);
    C(V(-.22, 1.42 - k * .08, -1.72 + k * .06), V(0, .86, -1.02), 34 - k * 6);
  } else if (t < 34.6) {                             // the mirror: she wiggles the next tooth out herself
    lights({bath: 2.0, amb: .06});
    haru.root.position.set(20.3, 0, -.45); haru.root.rotation.y = PI;
    const pull = q < 32.6, k = clamp01((q - 30.4) / 2.2);
    haru.mouth(pull ? 'open' : 'smile', pull ? .7 : 1); haru.eyes(pull ? (Math.floor(q * 6) % 2 ? 'squeeze' : 'open') : 'open'); haru.brows(pull ? .7 : -.1);
    const R = haru.arms[1];
    R.up.rotation.set(-1.45, 0, -.25); R.fo.rotation.set(-1.45, 0, 0); R.hand.rotation.x = .2 + (pull ? Math.sin(q * 14) * .15 : 0);
    if (!pull) { R.up.rotation.set(-1.0, 0, -.3); R.fo.rotation.set(-1.2, 0, 0); hTooth.visible = true; }
    haru.head.rotation.x = pull ? -.12 : .05;
    C(V(20.3, 1.5, -1.17), V(20.3, 1.42, 0), 36);
  } else if (t < 41.5) {                             // that night: asleep; the door opens; something stands in it
    lights({moon: 1.0, amb: .07, hall: q > 37 ? 1.4 : 0});
    lieInBed(haru); haru.eyes('closed');
    doorP.rotation.y = -ease((q - 37) / 1.6) * 1.1;
    tf.root.visible = q > 38.2; tf.root.position.set(2.15, 0, .05); tf.root.rotation.y = -PI / 2;
    tf.head.rotation.z = Math.sin(q * 1.3) * .2;
    curl(tf.arms[0], .3, .15, q); curl(tf.arms[1], .3, .15, q + 1);
    const k = ease((q - 34.6) / 6.9);
    C(V(-1.25, 1.7, 1.25 - k * .15), V(.6, .7, -.7), 40);
  } else if (t < 46.6) {                             // close: its fingers slide under the pillow, and keep sliding
    lights({moon: .9, amb: .07, rim: .6}); rimC.position.set(.4, .9, -1.4);
    lieInBed(haru); haru.eyes('squeeze'); haru.brows(.6);
    claw.visible = true; const k = ease((q - 41.5) / 5);
    const tip = V(.52 - k * .3, .53, -1.72); claw.position.copy(tip.clone().add(V(.68, .55, .25)));
    aim(claw, tip.clone().sub(claw.position)); clawArm.up.rotation.set(0, 0, 0); clawArm.fo.rotation.set(-.15, 0, 0); clawArm.hd.rotation.set(-.25, 0, 0);
    claw.position.add(V(0, 0, 0)); curl(clawArm, .08, .1, q);
    C(V(.36, .74, -1.28), V(.05, .55, -1.68), 34);
  } else if (t < 48.2) {                             // her eyes. They open.
    lights({moon: 1.0, amb: .07, rim: .7}); rimC.position.set(.2, .95, -1.4);
    lieInBed(haru); haru.eyes(q > 47.5 ? 'wide' : 'squeeze'); haru.brows(q > 47.5 ? .9 : .5);
    C(V(.03, .86, -1.6), V(0, .66, -1.67), 22);
  } else if (t < 50.6) {                             // what she sees: its face, a grin full of children's teeth, getting wider
    lights({moon: .8, amb: .05, rim: 1.4});
    haru.root.visible = false; tf.root.visible = true; fairyStand(tf);
    tf.root.rotation.y = 0; tf.spine.rotation.x = 1.25; tf.neck.rotation.x = .5; tf.head.rotation.x = -1.35 + Math.sin(q * 2) * .03; tf.head.rotation.z = Math.sin(q * .9) * .15;
    tf.mouth.scale.set(1.25 + ease((q - 48.4) / 2) * .35, 1.25 + ease((q - 48.4) / 2) * .15, 1.25);
    moveTo(tf.root, tf.head, V(0, 1.15, -1.6));
    rimC.position.set(.3, 1.35, -1.3);
    C(V(0, .7, -1.62), V(0, 1.15, -1.6), 44); cam.up.set(0, 0, 1); cam.lookAt(0, 1.15, -1.6);
  } else if (t < 57.0) {                             // she runs for the hall light; it stops at the edge, like the light is deep water
    lights({hall: 2.2, moon: .4, amb: .05}); doorP.rotation.y = -1.1;
    const run = clamp01((q - 50.6) / 2.6);
    haru.root.position.set(lerp(1.0, 3.15, run), 0, .15); haru.root.rotation.y = run < 1 ? PI / 2 : PI / 2 - ease((q - 53.2) / .6) * PI;
    if (run < 1) walk(haru, q, 1.9, 1.5); haru.eyes('wide'); haru.brows(.9); haru.mouth('open', .5);
    tf.root.visible = q > 53.4; tf.root.position.set(5.45, 0, .15); tf.root.rotation.y = -PI / 2; tf.spine.rotation.x = .75;
    const reach = ease((q - 53.6) / 1.4), back = ease((q - 55.4) / .5);
    tf.arms[0].up.rotation.set(-1.4 * reach, 0, -.1); tf.arms[0].fo.rotation.set(-.1, 0, 0); curl(tf.arms[0], .2 - back * .6, .1, q);
    tf.arms[0].up.rotation.x += back * 1.0;
    if (q > 55.1 && q < 56.6) { const fp = V(4.35, 1.35, .15); smoke.forEach((s, i) => { const a = (q - 55.1) * 1.4 + i * .06; if (a > 1.5) return;
      s.visible = true; s.position.set(fp.x + Math.sin(i * 2.3) * .06 - a * .05, fp.y + a * .35 + (i % 4) * .02, fp.z + Math.cos(i * 1.7) * .06); s.scale.setScalar(.6 + a * 2); s.material.opacity = .45 * (1 - a / 1.5); }); }
    if (q < 53.2) C(V(lerp(1.6, 3.0, run * .8), 1.25, 1.5), V(lerp(1.4, 3.4, run), 1.0, .15), 40);
    else C(V(2.3, 1.35, .75), V(3.9, 1.15, .1), 40);
  } else if (t < 62.7) {                             // the bathroom: she locks the door, sits under the brightest bulb in the house
    lights({bath: 2.6, amb: .05});
    if (q < 59.3) {
      haru.root.position.set(19.9, 0, .78); haru.root.rotation.y = 0; haru.eyes('wide'); haru.brows(.8);
      haru.arms[1].up.rotation.set(-1.2, 0, -.35); haru.arms[1].fo.rotation.set(-.6, 0, 0);
      lockTurn.rotation.z = q > 58.2 ? PI / 2 : 0;
      C(V(20.45, 1.25, .75), V(20.38, 1.15, 1.15), 32);
    } else {
      haru.root.position.set(20.1, -.47, -.75); haru.root.rotation.y = 0;
      haru.legs.forEach(({th, sh}, i) => { th.rotation.set(-1.9, 0, (i ? 1 : -1) * .08); sh.rotation.x = 2.3; });
      haru.chest.rotation.x = .25; haru.neck.rotation.x = .1; haru.arms.forEach(({up, fo}, i) => { up.rotation.set(-1.0, 0, (i ? -1 : 1) * .2); fo.rotation.x = -1.3; });
      haru.eyes('wide'); haru.brows(.8); lockTurn.rotation.z = PI / 2;
      const k = ease((q - 59.3) / 3.4);
      C(V(20.55, 1.9 - k * .2, .95 - k * .3), V(20.1, .55, -.7), 42);
    }
  } else if (t < 69.0) {                             // it taps on the door all night; the bulb flickers; every light goes out
    const fl = q > 67.4 ? (Math.floor(q * 12) % 3 === 0 ? .15 : 1) : 1;
    lights({bath: 2.6 * fl, amb: .05});
    haru.root.position.set(20.1, -.47, -.75);
    haru.legs.forEach(({th, sh}, i) => { th.rotation.set(-1.9, 0, (i ? 1 : -1) * .08); sh.rotation.x = 2.3; });
    haru.chest.rotation.x = .25; haru.arms.forEach(({up, fo}, i) => { up.rotation.set(-1.0, 0, (i ? -1 : 1) * .2); fo.rotation.x = -1.3; });
    haru.eyes('wide'); haru.brows(1); lockTurn.rotation.z = PI / 2;
    const tap = [63.4, 64.3, 64.9, 66.0, 66.4, 67.2].some(k => q >= k && q < k + .17);
    bDoorP.rotation.y = tap ? -.012 : 0;
    if (q < 65.6) C(V(20.2, .55, .2), V(19.95, .6, 1.18), 40);                  // the door, low: shadows under the gap
    else { haru.head.rotation.y = .3; C(V(20.35, .95, -.25), V(20.1, .82, -.72), 30); }
    if (q > 68.9) black = true;
  } else if (t < 73.2) {                             // black. The lock turns by itself. "Open wide."
    black = true;
  } else if (t < 74.4) {                             // one last flicker: it is on top of her
    const on = [73.2, 73.62, 73.85].some(k => q >= k && q < k + .17);
    lights({bath: on ? 2.4 : 0, amb: .02});
    if (!on) black = true;
    haru.root.rotation.x = -PI / 2; haru.root.position.set(19.95, .1, .05); haru.eyes('wide'); haru.brows(1); haru.mouth('open', 1);
    haru.arms.forEach(({up}, i) => up.rotation.set(-.3, 0, (i ? 1 : -1) * .9));
    tf.root.visible = true; fairyStand(tf); tf.root.rotation.y = PI;
    tf.legs.forEach(({th, sh, ft}, i) => { th.rotation.set(-1.9, 0, (i ? 1 : -1) * .35); sh.rotation.x = 2.5; ft.rotation.x = -.6; });
    tf.spine.rotation.x = 1.1; tf.neck.rotation.x = .3; tf.head.rotation.x = -1.2;
    tf.arms.forEach(a => { a.up.rotation.set(-.9, 0, a.sd * .35); a.fo.rotation.set(-.6, 0, 0); curl(a, .45); });
    tf.wings.forEach((w, i) => w.rotation.set(-.4, (i ? 1 : -1) * .2, (i ? 1 : -1) * -.9));
    tf.mouth.scale.set(1.6, 1.4, 1.3);
    moveTo(tf.root, tf.head, V(19.95, .52, -.88));
    C(V(20.75, 1.75, -.15), V(19.95, .35, -.6), 44);
  } else if (t < 80.9) {                             // black: one by one
    black = true;
  } else if (t < 82.8) {                             // morning: the floor covered in bitten coins
    lights({bathDawn: 1.6, amb: .12}); haru.root.visible = false; coins.visible = true;
    C(V(20.1 + (q - 80.9) * .05, 2.1, .9), V(19.95, 0, -.15), 42);
  } else if (t < 85.2) {                             // the mirror. Lips shut. She opens them: no teeth.
    lights({bathDawn: 1.3, amb: .12, rim: .5}); rimC.position.set(20.6, 1.6, -.6); coins.visible = true;
    haru.root.position.set(20.3, 0, -.45); haru.root.rotation.y = PI; haru.eyes('open'); haru.brows(.4);
    haru.mouth(q > 83.6 ? 'gums' : 'pressed', clamp01((q - 83.6) / .4));
    const k = ease((q - 82.8) / 2.4);
    C(V(20.3, 1.5, -1.17), V(20.3, 1.44 - k * .02, 0), 30 - k * 10);
  } else {                                           // night: Mum sets a glass of water by Haru's bed; push in to the hook
    lights({moon: 1.1, amb: .08, rim: .5}); rimC.position.set(-.4, 1.0, -1.3);
    lieInBed(haru); haru.eyes('wide'); haru.brows(.6); haru.mouth('pressed');
    const k1 = clamp01((q - 85.2) / 1.6);
    mum.root.visible = q < 87.4; mum.root.position.set(.78, 0, -1.12); mum.root.rotation.y = PI - .3;
    mum.chest.rotation.x = .35 * Math.sin(k1 * PI); mum.arms[1].up.rotation.x = -.9 * Math.sin(k1 * PI); mum.arms[1].fo.rotation.x = -.4;
    mGlass.visible = k1 < .55; glass.visible = k1 >= .55;
    const k = ease((q - 86.6) / 2.0);
    C(V(lerp(1.0, HOOKCAM[0].x, k), lerp(1.4, HOOKCAM[0].y, k), lerp(-.5, HOOKCAM[0].z, k)), V(lerp(.45, 0, k), lerp(.7, .66, k), lerp(-1.4, -1.66, k)), lerp(42, 34, k));
  }
  if (!(t >= 48.2 && t < 50.6)) cam.up.set(0, 1, 0);
}

window.renderAt = t => {
  frame(t);
  if (black) renderer.render(emptyScene, cam); else render(t);
};
window.dbg = t => { frame(t); haru.root.updateMatrixWorld(true); return {cam: cam.position.toArray(), head: haru.head.getWorldPosition(V(0, 0, 0)).toArray(), tf: tf.head.getWorldPosition(V(0, 0, 0)).toArray()}; };
window.renderAt(0); window.ready = true;
</script></body></html>
