const PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);

const LAY = Object.fromEntries((await (await fetch('/data/faces_wall_layout.json')).json()).map(l => [l.name, l]));

// ================================================================ materials
const M = {floor: clay(0x6a5e52, {bumpScale: .8}), lino: clay(0x5a6a62, {bumpScale: .6}), plaster: clay(0xcfc6b2, {bumpScale: 1.2}), green: clay(0x5e7a66),
  dark: clay(0x18161a), board: clay(0x2a3a32, {bumpScale: .4}), wood: clay(0x8a6a48), metal: gloss(0x8a8e90, {roughness: .4}), locker: clay(0x4a6a8a),

// a school wall: green lower half, cream upper, a dado rail
function schoolWall(w, h = 2.8) { const g = new THREE.Group(); add(K.rbox(w, h, .12, .01, .004, 2), M.plaster, g, [0, h / 2, 0]).castShadow = false;
  add(K.rbox(w, 1.05, .02, .005), M.green, g, [0, .525, .065]).castShadow = false; add(K.rbox(w, .05, .035, .008), M.wood, g, [0, 1.06, .07]); return g; }

  for (const [a, b] of [[-.27, -.19], [.27, -.19], [-.27, .19], [.27, .19]]) add(Cp(.014, .55), M.metal, g, [a, .29, b]);
  const c = K.chair({color: 0x4a5a6a}); c.scale.setScalar(.75); c.position.set(0, 0, .42); c.rotation.y = PI; g.add(c); return g; }

// ================================================================ THE CLASSROOM (afternoon)

add(K.rbox(8, .1, 7, .01, .003, 2), M.lino, CR, [0, -.05, 0]);
{ const fw = schoolWall(8); fw.position.set(0, 0, -3.3); CR.add(fw); const bw = schoolWall(8); bw.position.set(0, 0, 3.3); bw.rotation.y = PI; CR.add(bw);

{ const ck = K.clock(.16); ck.position.set(2.2, 2.3, -3.22); CR.add(ck);

const winZ = [-1.9, 0, 1.9];

const crSun = new THREE.DirectionalLight(0xffe6c4, 2.0); crSun.position.set(9, 5, -1); crSun.target.position.set(0, 0, 0); crSun.castShadow = true; crSun.shadow.mapSize.set(2048, 2048);

CR.add(new THREE.HemisphereLight(0xd8e0e8, 0x3a3430, .6)); const crFill = new THREE.PointLight(0xfff0e0, 1.4, 9, 1.2); crFill.position.set(0, 2.6, 1.5); CR.add(crFill);

  for (let i = 0; i < 60; i++) { g.save(); g.translate(Math.random() * w, Math.random() * h); g.rotate((Math.random() - .5) * .5); g.font = `${14 + Math.random() * 12}px monospace`;
    g.fillText(Math.random() < .55 ? names[i % names.length] : `${1 + i % 28}/${1 + i % 12}/${19 + (i % 7) * 7}`, 0, 0); g.restore(); }

  for (let i = 0; i < 9; i++) { g.save(); g.translate(60 + (i % 2) * 70 + Math.random() * 40, 90 + i * 66); g.rotate((Math.random() - .5) * .12); g.font = `bold ${30 + (i === 4) * 14}px monospace`; g.fillText("DON'T LET IT TURN AROUND", 0, 0); g.restore(); }
});
const WALLW = 4.4, WALLH = 2.8, NX = 11, NY = 7, TW = WALLW / NX, TH = WALLH / NY, tiles = [];
const wallG = G(AB, [0, 0, -2.9]);

  const pg = new THREE.PlaneGeometry(TW, TH), uv = pg.attributes.uv;

for (const s of [-1, 1]) add(K.rbox(1.5, 2.8, .12, .01), M.plaster, AB, [s * 2.95, 1.4, -2.9]);

add(K.rbox(3.2, .1, 6, .01, .003, 2), clay(0x2a2420), NR, [0, -.05, -3]); add(K.rbox(3.2, .1, 6, .01, .003, 2), clay(0x1e1a18), NR, [0, 3.4, -3]);

add(K.rbox(3.2, 3.4, .1, .01, .004, 2), clay(0x3a3430, {bumpScale: 1.6}), NR, [0, 1.7, -6]);
const nrLight = new THREE.PointLight(0xc04a32, 0, 9, 1.1); nrLight.position.set(0, 3.1, -3.4); NR.add(nrLight);
const abMoon = K.windowBeam(AB, {from: [-3.3, 2.2, 1.5], to: [.6, 0, -1.4], color: 0x8aa8d8, power: 7, width: .55, beamOpacity: .04});
AB.add(new THREE.HemisphereLight(0x5a6a8a, 0x141210, 1.0)); const abFill = new THREE.PointLight(0x8aa0c8, 4, 9, 1.2); abFill.position.set(.5, 2.4, 1.6); AB.add(abFill);   // moonlight filling the room
const abKey = new THREE.PointLight(0x9ab0d8, 0, 3, 1.5); AB.add(abKey);

// ================================================================ the cast
const haru = makePerson(haruOpts); scene.add(haru.root);
const HAIRS = ['short', 'pigtails', 'ponytail', 'bob', 'braids', 'short', 'long', 'buns', 'short'];
const TOPS = [0x6a8aa8, 0xa86a5a, 0x5a8a6a, 0xc8a85a, 0x8a6a9a, 0x4a5a7a, 0xb88a6a, 0x6a6a6a];
const SKINS = [0xe8a27c, 0xd0906a, 0x8d5a3b, 0xf0c0a0, 0xb07850, 0xe0b090];
const KIDS = [];
for (let i = 0; i < 18; i++) { const hs = HAIRS[i % HAIRS.length], boy = hs === 'short';
  const P = makePerson({build: 'child', outfit: i % 3 ? 'sweater' : 'hoodie', hood: i % 3 === 0, pocket: i % 3 === 0, headScale: 1.14 + (i % 3) * .04, scale: .64 + (i % 4) * .03,
    hairStyle: hs, longHair: !boy, bangs: !boy && i % 2 === 0, bow: hs === 'pigtails' || hs === 'buns', tie: [0xe0507e, 0x5a8ad8, 0xe8c040][i % 3], hair: [0x1e1a18, 0x4a2e1e, 0x2a2420, 0x6a4a2a][i % 4],
    top: TOPS[i % TOPS.length], pants: [0x3a3a44, 0x2a3a5a, 0x4a4038][i % 3], skin: SKINS[i % SKINS.length], eyeSize: .0074, lids: false, brow: 'dash', nose: 'button', blush: false, sculpt: .3});
  P.s0 = .64 + (i % 4) * .03; scene.add(P.root); KIDS.push(P); }
const boy = KIDS[0];                                                       // the boy who whispers
const teacher = makePerson({build: 'woman', outfit: 'cardigan', top: 0x7a5a6a, pants: 0x3a3440, hair: 0x5a3a2a, longHair: false, bun: true, hood: false, pocket: false, scale: 1.0}); teacher.s0 = 1; scene.add(teacher.root);
const medics = [0, 1].map(i => { const P = makePerson({build: 'man', outfit: 'coat', top: 0x2e6a4a, pants: 0x2e3a34, hair: [0x2a2018, 0x6a5a4a][i], longHair: false, hood: false, scale: 1.05}); P.s0 = 1.05; scene.add(P.root); return P; });
// the faceless thing: a back of a head on both sides
function faceless(P) { P.face.visible = false; add(S(.112, .98, 1.08, 1.04, .004, 8), P.M.hair, P.head, [0, .004, .012]); P.faceLight.intensity = 0; return P; }
const extra = faceless(makePerson({build: 'child', outfit: 'sweater', hood: false, pocket: false, top: 0x5a5a62, pants: 0x3a3a44, hair: 0x141210, longHair: true, headScale: 1.16, scale: .68, skin: 0xb8a898}));
extra.s0 = .68; scene.add(extra.root); onlyInGlass.push(extra.root);
const giant = faceless(makePerson({build: 'man', outfit: 'sweater', hood: false, pocket: false, top: 0x2a2826, pants: 0x2a2826, shoe: 0x141210, hair: 0x100e0c, longHair: false, skin: 0x8a8078, scale: 2.35}));
giant.s0 = 1.85; giant.arms.forEach(a => { a.up.scale.y = 1.35; a.fo.scale.y = 1.35; }); scene.add(giant.root);
const glassGiant = faceless(makePerson({build: 'man', outfit: 'sweater', hood: false, pocket: false, top: 0x2a2826, pants: 0x2a2826, shoe: 0x141210, hair: 0x100e0c, longHair: false, skin: 0x8a8078, scale: 1.08}));
glassGiant.s0 = 1.35; glassGiant.arms.forEach(a => { a.up.scale.y = 1.35; a.fo.scale.y = 1.35; }); scene.add(glassGiant.root); onlyInGlass.push(glassGiant.root);
const PEOPLE = [haru, ...KIDS, teacher, ...medics, extra, giant, glassGiant];
PEOPLE.forEach(P => { if (P !== haru) P.faceLight.visible = false; });
[CR, ...PEOPLE.map(P => P.root)].forEach(g => g.traverse(o => { if (o.isMesh) o.frustumCulled = false; }));   // the mirror's tilted camera would cull them wrongly   // only Haru carries a face light: a crowd of lights is too many for the shader

// ================================================================ helpers
function reset(P) {
  P.root.position.set(0, 0, 0); P.root.rotation.set(0, 0, 0); P.root.scale.setScalar(P.s0 || 1); P.hips.position.set(0, .82, 0); P.hips.rotation.set(0, 0, 0);
  for (const o of [P.chest, P.neck, P.head, P.back]) o.rotation.set(0, 0, 0); P.head.position.set(0, P.neckLen || .155, 0);
  P.arms.forEach(({up, fo, hand}, i) => { up.rotation.set(0, 0, (i ? 1 : -1) * .06); fo.rotation.set(-.12, 0, 0); hand.rotation.set(0, 0, 0); });

}
const place = (P, parent, x, z, ry) => { if (P.root.parent !== parent) parent.add(P.root); P.root.visible = true; P.root.position.set(x, 0, z); P.root.rotation.y = ry; };
