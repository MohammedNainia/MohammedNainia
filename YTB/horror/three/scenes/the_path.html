// path walk: the line leaves the village at dawn; Haru's position along the path at time t
const HZ = t => t < 132.5 ? 20 : t < 166.1 ? lerp(40, 141, (t - 132.5) / (166.1 - 132.5)) : lerp(141, 160, ease((t - 166.1) / 6));
function lineOnPath(t, n, gap = 1.05) {                            // Haru first, then the others behind, each holding the shoulder in front
  const z0 = HZ(t);
  const ph = t * 5.2;
  place(haru, pathX(z0), z0, Math.atan(5 / 38 * Math.cos((z0 - PZ0) / 38))); walk(haru, ph);
  const who = [sister, ...crowd];
  for (let i = 0; i < Math.min(n, who.length); i++) {
    const z = z0 - gap * (i + 1); const p = who[i];
    place(p, pathX(z) + (i === 0 ? 0 : Math.sin(i * 1.7) * .1), z, Math.atan(5 / 38 * Math.cos((z - PZ0) / 38))); walk(p, ph + i * .9);
    p.arms[1].sh.rotation.set(-1.25, 0, .25); p.arms[1].el.rotation.set(-.2, 0, 0);   // a hand on the shoulder in front
  }
}
function pathMonsters(t, n, near = 4.2, lag = 3) {                 // dark shapes walking between the trees, beside the line
  for (let i = 0; i < pathMon.length; i++) {
    const m = pathMon[i]; m.g.visible = i < n; if (!m.g.visible) continue;
    const z = HZ(t) - lag - i * 3.1, side = i % 2 ? 1 : -1;
    m.g.position.set(pathX(z) + side * (near + (i % 3) * 1.3), 0, z); m.g.rotation.y = Math.atan(5 / 38 * Math.cos((z - PZ0) / 38));
    pose(m, t, {walk: t * 2.6 + i, fog: .35, turn: -side * .35});
  }
}
