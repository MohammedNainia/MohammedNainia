function walkers(t, n, avoid = false, flee = false) {          // people on their way to work, under the black sky

}

// ---------------------------------------------------------------- render one frame
function renderAt(t) {
  let i = 0; while (i < CUTS.length - 1 && CUTS[i + 1][0] <= t) i++;
  const [t0, name] = CUTS[i], t1 = CUTS[i + 1][0], k = clamp01((t - t0) / (t1 - t0));
  ALL.forEach(resetPerson); [...north, ...south].forEach(h => h.hinge.rotation.y = 0);
  kitLamp.intensity = bedLamp.intensity = memSun.intensity = storeLight.intensity = 0; underGlow.intensity = 10; sunWin.visible = false;
  cups.forEach(c => c.visible = true); shards.forEach(s => s.visible = false); photo.visible = false; darkness(0);
  kenjiShadow.visible = t >= 69 && t < 171; mumShadow.visible = t >= 130.5 && t < 171; haruShadow.visible = t >= 170.2 || t < 5.4;
  chalkLevel(t < 55.5 ? 0 : t < 69 ? 1 : 0);
  if (t >= 130.5) cups[1].visible = false;
  // the sky: slow folds; a heavy turn on "something heavy turning over" and "something turned over"
  const turn = (t > 63 && t < 69) ? Math.sin((t - 63) / 6 * PI) : (t > 126.7 && t < 130.5) ? Math.sin((t - 126.7) / 3.8 * PI) : (t > 164 && t < 170.2) ? clamp01((t - 164) / 4) : 0;
  skyMove(t, turn);
  const sh = SH[name](t, k);
  if (!sh) { renderer.toneMappingExposure = 0; render(t); return true; }
  const [pos, look, fov] = SH[name](t, k);
  cam.position.copy(pos); cam.lookAt(look); cam.fov = fov; cam.updateProjectionMatrix();
  if (['scream1', 'scream2', 'down'].includes(name)) cam.position.add(V(Math.sin(t * 23) * .01, Math.sin(t * 19) * .01, 0));
  key.position.copy(pos).add(V(.3, .3, 0)); key.intensity = ['street', 'crane', 'skyMoves', 'roofTurn', 'townsfolk', 'talking', 'hook', 'hookEnd'].includes(name) ? 0 : 1.8;
  if (['down', 'scream1', 'scream2', 'peek', 'after', 'walkOut'].includes(name)) underGlow.intensity = 30;
  if (name === 'scream2') key.intensity = .7;
  const memK = name === 'memory' ? 1 : 0;
  renderer.toneMappingExposure = 1 + memK * .15;
  grain.uniforms.vig.value = .68;
  render(t);
  return true;
}
window.renderAt = renderAt; window.DUR = DUR; window.ready = true;
