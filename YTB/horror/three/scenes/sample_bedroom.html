<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/",
 "three/examples/jsm/":"/node_modules/three/examples/jsm/","three-gpu-pathtracer":"/node_modules/three-gpu-pathtracer/build/index.module.js","three-mesh-bvh":"/node_modules/three-mesh-bvh/build/index.module.js"}}</script>
<script type="module">
// Clay bedroom + the night lighting presets, 9:16. renderAt(i): 0 moonlight, 1 TV glow, 2 light under the door, 3 bedside lamp, 4 flashlight.
//   ?s=.5 half size   ?pt=128&dn=1 path traced (final look)   ?d=.6 lighter character meshes
import {THREE, setup} from './lib.js';
import {makeChar} from './characters.js';
import {POSES, groundIt} from './haru3_poses.js';
import {room, bed, nightstand, lamp, wardrobe, tv, rug, chair, LIGHTS, setupLights} from './sets.js';
const q = new URLSearchParams(location.search), PS = +(q.get('s') || 1), PTS = +(q.get('pt') || 0), DET = +(q.get('d') || 1);
const {scene, cam, renderer, render, grain} = setup({bloom: .25, w: Math.round(1080 * PS), h: Math.round(1920 * PS)});
grain.uniforms.vig.value = .5; renderer.toneMappingExposure = 1.1; renderer.shadowMap.type = THREE.VSMShadowMap;
scene.background = new THREE.Color(0x010103); setupLights();
const t0 = performance.now();
// ---- the set
const R = room({w: 4, d: 3.6, h: 2.6}); scene.add(R.group);
const B = bed(); B.position.set(-1.3, 0, -2.4); scene.add(B);
const N = nightstand(); N.position.set(-.5, 0, -3.25); scene.add(N);
const LA = lamp(); LA.position.set(-.5, .55, -3.25); scene.add(LA);
const WR = wardrobe(); WR.position.set(1.45, 0, -3.25); scene.add(WR);
const TV = tv(); TV.position.set(1.55, 0, -1.4); TV.rotation.y = -Math.PI / 2; scene.add(TV);
const RU = rug(); RU.position.set(-.1, 0, -1.8); scene.add(RU);
const CH = chair(); CH.position.set(.4, 0, -3.1); CH.rotation.y = .4; scene.add(CH);
// ---- Haru: standing by the bed (copy 1), and holding the flashlight (copy 2, built from the same meshes: instant)
const H = makeChar('haru', {detail: DET}); H.root.position.set(-.15, 0, -1.55); H.root.rotation.y = -.5; H.expr('scared'); scene.add(H.root); groundIt(H, THREE);
const HF = makeChar('haru', {detail: DET}); HF.root.position.set(-.15, 0, -1.55); scene.add(HF.root);
POSES.find(p => p.name === 'flashlight').fn(HF, THREE, scene); HF.root.rotation.y = .82; HF.expr('scared'); groundIt(HF, THREE);   // beam towards the wardrobe, face to us
HF.root.traverse(o => { if (o.isSpotLight) { o.intensity = 40; o.distance = 9; o.angle = .38; o.castShadow = true; } });
// characters in sets: 0.8 of their lineup size (Haru is a child next to a 2 m door)
for (const P of [H, HF]) { P.root.scale.multiplyScalar(.8); groundIt(P, THREE); }
// ---- lights
const L = [LIGHTS.moon(R), LIGHTS.tv(R, TV), LIGHTS.door(R), LIGHTS.lamp(R, LA), (() => { const g = new THREE.Group(); g.add(new THREE.AmbientLight(0x3a4a6a, .15)); return {group: g, update() {}}; })()];
L.forEach(l => scene.add(l.group));
console.log('PT set built in ' + ((performance.now() - t0) / 1000).toFixed(2) + ' s');
let PT = null, last = -1;
if (PTS) { const {pathTracer} = await import('./pt.js');
  // path traced: glowing surfaces (bulb, screen) are lit by the real lights instead (bright glowing surfaces give speckles),
  // and the drawn flashlight beam is hidden (the path tracer makes the real one)
  scene.traverse(o => { if (o.isMesh && o.material.blending === THREE.AdditiveBlending) o.visible = false; });
  L.forEach(l => l.forPathTracing && l.forPathTracing());
  PT = pathTracer({renderer, scene, cam}, {softboxes: [], env: [0x0c1424, 0x020306], envIntensity: .6, denoise: q.get('dn') === '1'}); }
const GLOW = PTS ? .25 : 1;
window.renderAt = t => {
  const i = Math.round(t) % 5;
  L.forEach((l, j) => { l.group.visible = j === i; });
  L[3].on(i === 3); LA.userData.bulb.material.emissiveIntensity *= GLOW;
  TV.userData.screen.material.emissiveIntensity = 0; L[i].update(t * 0 + i * 1.7); TV.userData.screen.material.emissiveIntensity *= GLOW;
  H.root.visible = i !== 4; HF.root.visible = i === 4;
  R.door.open(i === 2 ? 0 : .0);
  cam.fov = 50; cam.aspect = 9 / 16; cam.position.set(-1.25, 1.45, 1.6); cam.lookAt(.35, .85, -2.0); cam.updateProjectionMatrix(); cam.updateMatrixWorld(true);
  if (PT) { const face = (i === 4 ? HF : H).head.getWorldPosition(new THREE.Vector3());
    PT.render({samples: PTS, focus: face, fStop: 2.2, rebuild: i !== last}); last = i; return; }
  render(t);
};
if (!PT) window.renderAt(0); window.ready = true;
</script></body></html>
