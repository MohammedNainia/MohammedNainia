<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// THE LUCKY ONE (9:16, ~74 s): the clay kit (clay.js people, clay_sets.js sets, lib.js finish). Timed to lucky_one/voice/layout.json.

import {THREE, setup, ease, clamp01, lerp} from './lib.js';

const PS = +(new URLSearchParams(location.search).get('s') || 1);

const PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);
scene.background = new THREE.Color(0x0a0c10); cam.near = .02; cam.far = 120; cam.updateProjectionMatrix();
let rs = 7; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const LAY = Object.fromEntries((await (await fetch('/data/lucky_one_layout.json')).json()).map(l => [l.name, l]));

const ST = n => LAY[n].start, EN = n => LAY[n].end, DUR = LAY.END.start;
const fog = K.haze(scene, 0x0a0c10, .04);
const rbox = K.rbox;

// ================================================================ materials
const M = {floor: clay(0x5a4a3e, {bumpScale: .8}), wall: clay(0x8a7a66, {bumpScale: 1.2}), wallpaper: clay(0x6a5a60, {bumpScale: 1}), wood: clay(0x6a4a30), dark: clay(0x141214),
  road: clay(0x2a2a2e, {bumpScale: 1.6}), line: clay(0xd8d2b8), kerb: clay(0x6a6a66), grass: clay(0x3a5a34, {bumpScale: 2}), stone: clay(0x7a7a76, {bumpScale: 1.4}),
  white: clay(0xe8e2d6), metal: gloss(0x8a8e90, {roughness: .4}), cake: clay(0xf0e0d0), icing: clay(0xe86a8a), bulb: new THREE.MeshBasicMaterial({color: 0xfff0c8}),
  flame: new THREE.MeshBasicMaterial({color: 0xffc860}), red: new THREE.MeshBasicMaterial({color: 0xff2a1a}), green: new THREE.MeshBasicMaterial({color: 0x40ff80}),
  amber: new THREE.MeshBasicMaterial({color: 0xffa020}), frost: new THREE.MeshBasicMaterial({color: 0xcfe8ff}), spark: new THREE.MeshBasicMaterial({color: 0xbfe0ff}),
  truck: clay(0x8a8a84), trailer: clay(0xc8c0b0), bus: clay(0xc8a038), umb: clay(0x141418, {side: THREE.DoubleSide}), coat: 0xa01e26};

// ================================================================ places
const HS = G(scene, [0, 0, 0]), ST_ = G(scene, [40, 0, 0]), RD = G(scene, [100, 0, 0]), FD = G(scene, [160, 0, 0]);
const PLACES = [HS, ST_, RD, FD];

// ---------------------------------------------------------------- HS: a long hall (z 2 .. -6), stairs climbing at the far end, the kitchen behind (z 2 .. 5)
add(rbox(3.2, .1, 13, .01, .003, 2), M.floor, HS, [0, -.05, -1.5]);
add(rbox(3.2, .1, 13, .01, .003, 2), clay(0x2a2622), HS, [0, 2.65, -1.5]);
for (const s of [-1, 1]) add(rbox(.1, 2.7, 13, .01, .004, 2), M.wallpaper, HS, [s * 1.6, 1.35, -1.5]);
add(rbox(3.2, 2.7, .1, .01, .004, 2), M.wallpaper, HS, [0, 1.35, 5]);
// stairs: up the far end along -z, a banister
const STEPS = [];
for (let i = 0; i < 12; i++) STEPS.push(add(rbox(1.3, .18, .3, .02), M.wood, HS, [-.55, .09 + i * .18, -6.2 - i * .28]));
add(rbox(1.3, 2.2, .1, .01), M.wallpaper, HS, [-.55, 3.3, -9.6]); add(rbox(3.2, .1, 4, .01), clay(0x2a2622), HS, [0, 3.9, -8]);
for (let i = 0; i < 12; i += 2) add(Cp(.015, .9), M.wood, HS, [.1, .6 + i * .18, -6.2 - i * .28]);
add(Cp(.025, 3.9), M.wood, HS, [.1, 1.45, -7.75], [1.18, 0, 0]);
// picture frames on the walls (they drop in the run)
const FRAMES = [];
for (let i = 0; i < 6; i++) { const s = i % 2 ? 1 : -1, f = K.frame(.34, .42); f.position.set(s * 1.53, 1.55, 1 - i * 1.1); f.rotation.y = -s * PI / 2; HS.add(f); FRAMES.push({f, s, z: 1 - i * 1.1, y: 1.55}); }
// ceiling fan in the middle of the hall
const fan = G(HS, [0, 2.6, -2]); add(Cp(.02, .3), M.metal, fan, [0, -.15, 0]); const fanHub = G(fan, [0, -.32, 0]); add(S(.08, 1, .5, 1), M.metal, fanHub);
for (let i = 0; i < 4; i++) add(rbox(.6, .015, .12, .005), M.wood, fanHub, [Math.cos(i * PI / 2) * .34, 0, Math.sin(i * PI / 2) * .34], [0, -i * PI / 2, 0]);
// hall bulbs (they burst at midnight)
const BULBS = [1.2, -1.5, -4.5].map(z => { const p = K.lampPool(HS, [0, 2.3, z], {color: 0xffc070, power: 4, dist: 6}); return p; });
// kitchen at the near end: table, cake, counter, cooker
const kt = K.table({w: 1.1, d: .8}); kt.position.set(.4, 0, 3.4); HS.add(kt);
const cake = G(HS, [.4, .74, 3.4]); add(turn2(.16, .14), M.cake, cake); add(turn2(.165, .02), M.icing, cake, [0, .13, 0]);
const FLAMES = []; for (let i = 0; i < 16; i++) { const a = i / 16 * PI * 2; add(Cp(.004, .05), clay([0xe86a8a, 0x6ab0e8, 0xf0d060][i % 3]), cake, [Math.cos(a) * .11, .17, Math.sin(a) * .11]);
  FLAMES.push(add(S(.008, 1, 1.8, 1), M.flame, cake, [Math.cos(a) * .11, .215, Math.sin(a) * .11])); }
const kc = K.counter({len: 2.2}); kc.position.set(-1.2, 0, 3.6); kc.rotation.y = PI / 2; HS.add(kc); const stv = K.stove(); stv.position.set(-1.2, .9, 3.4); HS.add(stv);
const stoveFire = G(HS, [-1.2, 1.0, 3.4]); for (let i = 0; i < 9; i++) add(new THREE.ConeGeometry(.04, .2 + (i % 3) * .08, 6), M.flame, stoveFire, [(i % 3 - 1) * .1, .1, (Math.floor(i / 3) - 1) * .1]);
const vase = G(HS, [1.3, 0, -.4]); add(rbox(.3, .8, .3, .02), M.wood, vase, [0, .4, 0]); const vaseTop = G(vase, [0, .8, 0]); add(turnV(), clay(0x3a6a8a), vaseTop);
const kitchenL = new THREE.PointLight(0xffb070, 0, 5, 1.4); kitchenL.position.set(.4, 2.2, 3.4); HS.add(kitchenL);
const hsMoon = new THREE.DirectionalLight(0x6a80b8, .6); hsMoon.position.set(3, 4, 2); hsMoon.target.position.set(0, 0, -2); HS.add(hsMoon, hsMoon.target);
const hsHemi = new THREE.HemisphereLight(0x6a6a7a, 0x181212, 1.0); HS.add(hsHemi);
const doorL = new THREE.PointLight(0x9ab8ff, 0, 5, 1.2); doorL.position.set(.4, 2.2, -5.2); HS.add(doorL);
// the door at the end of the hall stands open in the chase; the woman waits in it
add(rbox(1.0, 2.1, .08, .01), M.dark, HS, [.6, 1.05, -5.95]);
// shards: glass that bursts out of a bulb
const SHARDS = new THREE.Group(); HS.add(SHARDS); for (let i = 0; i < 26; i++) add(new THREE.TetrahedronGeometry(.02 + rnd() * .02), M.bulb, SHARDS, [0, 0, 0]);
SHARDS.children.forEach(m => m.userData.v = V(rnd() - .5, rnd() * .6, rnd() - .5).multiplyScalar(3));

function turn2(r, h) { return lump(new THREE.CylinderGeometry(r, r, h, 32, 2), .003, 10).translate(0, h / 2, 0); }
function turnV() { return lump(new THREE.LatheGeometry([[0, 0], [.08, .01], [.1, .12], [.05, .22], [.06, .26]].map(([x, y]) => new THREE.Vector2(x, y)), 24), .003, 10); }

// ---------------------------------------------------------------- ST: a street at dusk in the rain: road along x, kerbs, houses, a bus stop, a streetlamp
add(rbox(40, .1, 6, .01, .003, 2), M.road, ST_, [0, -.05, 0]);
for (const s of [-1, 1]) add(rbox(40, .16, 2.2, .02), M.kerb, ST_, [0, .03, s * 4.1]);
for (let i = -8; i <= 8; i++) add(rbox(1.0, .012, .12, .005), M.line, ST_, [i * 2.4, .005, 0]);
for (let i = -3; i <= 3; i++) { const h = K.house({color: [0x6a3a2e, 0x4a5a6a, 0x7a6a4a][(i + 3) % 3], lit: [i % 2 === 0, true, false]}); h.scale.setScalar(1.5); h.position.set(i * 3.6, 0, -6.4); ST_.add(h); }
const busStop = G(ST_, [1.5, 0, 3.6]); add(rbox(2.2, .06, 1.0, .01), clay(0x3a3a3e), busStop, [0, 2.3, 0]); for (const x of [-1, 1]) add(Cp(.03, 2.2), M.metal, busStop, [x, 1.15, -.4]);
add(rbox(2.1, 1.6, .03, .01), new THREE.MeshPhysicalMaterial({color: 0x8aa0b0, transparent: true, opacity: .25, roughness: .1}), busStop, [0, 1.2, -.45]);
const stLamp = K.streetLamp(4.2, 0xffd8a0, 6); stLamp.position.set(-1.5, 0, 3.4); stLamp.rotation.y = PI; ST_.add(stLamp);
const stLamp2 = K.streetLamp(4.2, 0xffd8a0, 4); stLamp2.position.set(8, 0, 3.4); stLamp2.rotation.y = PI; ST_.add(stLamp2);
ST_.add(new THREE.HemisphereLight(0x5a6a8a, 0x141210, .7));
const puddle = add(new THREE.CircleGeometry(.7, 24), gloss(0x2a3440, {roughness: .05}), ST_, [-3, .012, 1.4], [-PI / 2, 0, 0]);
// the bus (pulls away), the car that runs the light, teen Haru's bike
const bus = G(ST_); add(rbox(7, 2.6, 2.3, .2, .004, 4), M.bus, bus, [0, 1.6, 0]); for (let i = 0; i < 5; i++) add(new THREE.PlaneGeometry(.9, .8), new THREE.MeshBasicMaterial({color: 0xffe8a8}), bus, [-2.6 + i * 1.2, 2.1, 1.16]);
for (const x of [-2.4, 2.4]) for (const z of [-1.1, 1.1]) add(lump(new THREE.TorusGeometry(.42, .18, 10, 20), .003, 10), clay(0x141414), bus, [x, .45, z]);
const stCar = carBig(0x3a4a6a); ST_.add(stCar);
const bike = G(ST_); for (const x of [-.45, .45]) add(lump(new THREE.TorusGeometry(.32, .025, 8, 28), .002, 10), clay(0x1a1a1a), bike, [x, .34, 0]); add(Cp(.02, .9), clay(0x2a6a8a), bike, [0, .55, 0], [0, 0, PI / 2]); add(Cp(.02, .45), clay(0x2a6a8a), bike, [.25, .6, 0], [0, 0, .5]);
function carBig(c) { const g = new THREE.Group(), body = K.car(c); body.scale.set(2.5, 1.85, 2.3); g.add(body);
  body.traverse(o => { if (o.isMesh && o.material.color && o.material.color.getHex() === 0x1a2430) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = .22; } });
  body.children[1].material = new THREE.MeshPhysicalMaterial({color: 0x2a3440, transparent: true, opacity: .28, roughness: .1, side: THREE.DoubleSide, depthWrite: false});   // the cabin is glass: we see who is inside
  body.children[1].castShadow = false;
  const hl = new THREE.SpotLight(0xfff2c8, 0, 30, .5, .5, 1); hl.position.set(1.95, .75, 0); hl.target.position.set(10, 0, 0); g.add(hl, hl.target); g.userData.hl = hl; return g; }

// ---------------------------------------------------------------- RD: a long road into the dark along -z: streetlights, a traffic light, the tree, a truck, a pole, the broken bridge
add(rbox(7, .1, 140, .01, .003, 2), M.road, RD, [0, -.05, -60]);
for (let i = 0; i < 60; i++) add(rbox(.12, .012, 1.0, .005), M.line, RD, [0, .005, 8 - i * 2.4]);
for (const s of [-1, 1]) add(rbox(14, .05, 140, .01, .003, 2), M.grass, RD, [s * 10.5, -.06, -60]);
const RDLAMPS = []; for (let i = 0; i < 8; i++) { const l = K.streetLamp(4.4, 0xffd090, 5); const s = i % 2 ? 1 : -1; l.position.set(s * 3.9, 0, -i * 12); l.rotation.y = s > 0 ? -PI / 2 : PI / 2; RD.add(l); RDLAMPS.push(l); }
const tLight = G(RD, [3.6, 0, -14]); add(Cp(.05, 3.6), clay(0x2a2c2a), tLight, [0, 1.8, 0]); add(rbox(.3, .8, .25, .04), clay(0x1a1a1a), tLight, [0, 3.7, 0]);
const TL = [M.red, M.amber, M.green].map((m, i) => add(S(.07), m.clone(), tLight, [0, 3.95 - i * .25, .13]));
const tree = G(RD, [-4.2, 0, -26]); add(lump(new THREE.CylinderGeometry(.18, .3, 6, 10, 8), .02, 3), clay(0x3a2a1e, {bumpScale: 2}), tree, [0, 3, 0]);
for (let i = 0; i < 6; i++) add(S(.9 + rnd() * .4, 1, .8, 1, .05, 3), clay(0x23361f, {bumpScale: 2}), tree, [(rnd() - .5) * 1.5, 5.6 + rnd() * 1.4, (rnd() - .5) * 1.5]);
const truck = G(RD); add(rbox(2.4, 2.6, 2.5, .15), M.truck, truck, [0, 1.6, 0]); add(new THREE.PlaneGeometry(2.0, .9), new THREE.MeshBasicMaterial({color: 0x101820}), truck, [0, 2.2, 1.26]);
const trailer = G(truck, [0, 0, -1.3]); add(rbox(2.5, 3.0, 8, .1), M.trailer, trailer, [0, 2.0, -4]);
for (const z of [.6, -4.5, -8]) for (const x of [-1.15, 1.15]) add(lump(new THREE.TorusGeometry(.45, .2, 10, 20), .003, 10), clay(0x141414), z > 0 ? truck : trailer, [x, .5, z > 0 ? z : z + 1.3], [0, PI / 2, 0]);
for (const x of [-.8, .8]) add(S(.12, 1, 1, .4), new THREE.MeshBasicMaterial({color: 0xfff2c8}), truck, [x, .9, 1.27]);
const truckL = new THREE.SpotLight(0xfff2c8, 0, 30, .55, .5, 1); truckL.position.set(0, 1, 1.4); truckL.target.position.set(0, 0, 12); truck.add(truckL, truckL.target);
const pole = G(RD, [3.8, 0, -40]); add(lump(new THREE.CylinderGeometry(.12, .15, 7, 10), .01, 4), clay(0x4a3a2a), pole, [0, 3.5, 0]); add(rbox(1.8, .1, .1, .02), clay(0x4a3a2a), pole, [0, 6.6, 0]);
const wire = add(Cp(.015, 9), clay(0x141414), RD, [0, 0, 0]); wire.visible = false;
const bridgeZ = -70;
for (const s of [-1, 1]) for (let i = 0; i < 6; i++) add(rbox(.2, 1.1, .2, .02), M.stone, RD, [s * 3.4, .55, bridgeZ + 6 - i * 2]);
for (const s of [-1, 1]) add(rbox(.12, .12, 12, .02), M.stone, RD, [s * 3.4, 1.15, bridgeZ + 1]);
const gap = add(rbox(9, 6, 40, .01), M.dark, RD, [0, -3.1, bridgeZ - 20]);   // beyond the edge: nothing
for (let i = 0; i < 9; i++) add(new THREE.TetrahedronGeometry(.3 + rnd() * .4), M.road, RD, [(rnd() - .5) * 6, -.1 - rnd() * .3, bridgeZ - .3 - rnd() * .5]);   // the broken lip
for (let i = 0; i < 3; i++) add(rbox(9, .08, .2), M.dark, RD, [0, .001, bridgeZ - .2 - i * .3]);
RD.add(new THREE.HemisphereLight(0x4a5a80, 0x0a0808, 1.0)); const rdMoon = new THREE.DirectionalLight(0x8aa0d8, 1.2); rdMoon.position.set(-20, 30, 10); rdMoon.target.position.set(0, 0, -30); RD.add(rdMoon, rdMoon.target);
const demonKey = new THREE.PointLight(0xcfe0ff, 0, 8, 1.2); RD.add(demonKey); const garageL = new THREE.PointLight(0xffc890, 0, 7, 1.3); garageL.position.set(-1.4, 2.4, 10.5); RD.add(garageL);
const rdCar = carBig(0x6a2a24); RD.add(rdCar); const carIn = new THREE.PointLight(0x8ab0ff, 0, 3, 1.2); carIn.position.set(.1, 1.05, 0); rdCar.add(carIn);   // dashboard glow
const flashL = new THREE.PointLight(0xdfe8ff, 0, 80, 1); flashL.position.set(0, 25, -30); RD.add(flashL);

// ---------------------------------------------------------------- FD: a football pitch under the sun; the graves on the hill
add(rbox(60, .1, 60, .01, .003, 2), M.grass, FD, [0, -.05, 0]);
for (const x of [-1.5, 1.5]) add(Cp(.05, 2.2), M.white, FD, [x, 1.1, -6]); add(Cp(.05, 3), M.white, FD, [0, 2.2, -6], [0, 0, PI / 2]);
const ball = add(S(.11), M.white, FD, [0, .11, 0]);
const GRAVES = []; for (let i = 0; i < 3; i++) { const g = G(FD, [12 + i * 1.4, 0, -2]); add(rbox(.7, 1.0, .18, .08, .006, 6), M.stone, g, [0, .5, 0]); add(rbox(.8, .06, 1.8, .02), clay(0x3a2a1e), g, [0, .03, .95]); GRAVES.push(g); }
const fdSun = new THREE.DirectionalLight(0xfff0d8, 0); fdSun.position.set(10, 20, 10); FD.add(fdSun); const fdHemi = new THREE.HemisphereLight(0x9ab8e8, 0x3a4a2a, 0); FD.add(fdHemi);

// ---------------------------------------------------------------- rain: falling streaks around the camera; a dry circle around Haru when she is lucky
const RAIN_N = 1400, rainGeo = new THREE.BufferGeometry(), rainPos = new Float32Array(RAIN_N * 6), rainSeed = [];
for (let i = 0; i < RAIN_N; i++) rainSeed.push([rnd(), rnd(), rnd()]);
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({color: 0x9ab0c8, transparent: true, opacity: .5})); rain.frustumCulled = false; scene.add(rain);
function rainAt(t, center, dry = null, k = 1) {
  rain.visible = k > 0; if (!k) return;
  for (let i = 0; i < RAIN_N; i++) { const [a, b, c] = rainSeed[i];
    let x = center.x + (a - .5) * 12, z = center.z + (c - .5) * 12, y = 6 - ((b * 6 + t * 9) % 6);
    if (i / RAIN_N > k || (dry && Math.hypot(x - dry.x, z - dry.z) < dry.r)) y = -50;
    rainPos.set([x, y, z, x - .02, y - .28, z], i * 6); }
  rainGeo.attributes.position.needsUpdate = true; }

// umbrellas
function umbrella(color = 0x141418) { const g = new THREE.Group(); add(lump(new THREE.ConeGeometry(.6, .3, 12, 1, true), .004, 6), clay(color, {side: THREE.DoubleSide}), g, [0, .15, 0]); add(Cp(.01, 1.0), M.metal, g, [0, -.35, 0]); return g; }
const umbW = umbrella(0x1a1a1e), umbH = umbrella(0x2a2a40); scene.add(umbW, umbH);
const FUN_UMB = [0, 1, 2, 3, 4].map(() => { const u = umbrella(0x141418); scene.add(u); return u; });

// ================================================================ people
const P0 = {hood: false, pocket: false};
const haruT = makePerson({...haruOpts, scale: .86, top: 0x6a7a8a});                                   // Haru at sixteen: school jumper, the same sweep of hair
const haru = makePerson({...haruOpts, build: 'woman', outfit: 'cardigan', scale: 1.0, headScale: 1.08, sculpt: .45, faceShape: [.95, 1.08, 1.0], puffy: 1.0,
  hair: 0x3c3a40, top: 0x6a4a5a, pants: 0x2e2c34, shoe: 0x2a2424, neckLen: .17, ...P0});             // Haru at fifty
const nao = makePerson({...haruOpts, hairStyle: 'ponytail', scale: .88, headScale: 1.12, top: 0xd8b050, pants: 0x3a4a6a, ...P0});
const ken = makePerson({build: 'man', outfit: 'hoodie', scale: .98, headScale: 1.06, top: 0x2a5a4a, pants: 0x2a2a34, longHair: false, hair: 0x1e1c22, skin: 0xe8a27c});
const yui = makePerson({build: 'woman', outfit: 'sweater', scale: .92, headScale: 1.1, hairStyle: 'ponytail', top: 0xc85a6a, pants: 0x3a3a48, hair: 0x26242a, skin: 0xe8a27c, ...P0});
const ren = makePerson({...haruOpts, hairStyle: 'short', scale: .84, headScale: 1.14, top: 0x2a4aa8, pants: 0xe8e8e8, ...P0});
const husband = makePerson({build: 'man', outfit: 'shirt', scale: 1.05, top: 0xe8e4dc, pants: 0x2a2a34, longHair: false, hair: 0x2a2420, ...P0});
const woman = makePerson({build: 'woman', outfit: 'coat', scale: 1.06, headScale: 1.02, sculpt: .55, top: M.coat, pants: 0x1a1a1e, shoe: 0x1a1a1e, hairStyle: 'long', hair: 0x14100e,
  skin: 0xf0d0bc, eyeSize: .0082, lids: true, ...P0});
const mourners = [0, 1, 2, 3, 4].map(i => makePerson({build: i % 2 ? 'man' : 'woman', outfit: 'coat', scale: 1, top: 0x1a1a1e, pants: 0x141416, shoe: 0x141416, longHair: i % 2 === 0, hair: 0x1e1c1c, ...P0}));
const PEOPLE = [haruT, haru, nao, ken, yui, ren, husband, woman, ...mourners];
PEOPLE.forEach(P => { scene.add(P.root); if (![haru, haruT, nao, ken, yui, ren, woman].includes(P)) P.faceLight.visible = false; });
// the demon: the grey thing (no wings, no crown) with its face taken away
const demon = makeFairy({wings: false, crown: false, skin: 0x9a958a, skinD: 0x5a564e}); scene.add(demon.root);
demon.mouth.visible = false; demon.head.children.forEach((c, i) => { if (i > 0) c.visible = false; }); demon.head.scale.set(1, 1.15, 1);
// the hand that pulls teen Haru back: a gloved hand on the end of a red sleeve
const PEOPLE_ALL = [...PEOPLE];

// ================================================================ helpers
