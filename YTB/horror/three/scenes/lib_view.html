<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">

  for (const o of [P.chest, P.neck, P.head]) o.rotation.set(0, 0, 0); P.head.position.set(0, P.neckLen, 0);

    P.root.updateMatrixWorld(true); const h = P.head.getWorldPosition(new THREE.Vector3()), top = h.y + .25;
    if (i === 4) { cam.position.set(h.x - .55, h.y + .05, h.z + .9); cam.lookAt(h.x, h.y + .02, h.z); cam.fov = 26; }
    else { cam.position.set(0, top * .55, top * 2.9 + 1); cam.lookAt(0, top * .5, 0); cam.fov = 26; } }

    cam.position.set(0, 1.05, 7.2); cam.lookAt(0, .9, 0); cam.fov = 30; }

</script></body></html>
