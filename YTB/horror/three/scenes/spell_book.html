function pageTex(lines, mirror = false) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 680; const g = cv.getContext('2d');

  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(120,90,50,${Math.random() * .08})`; g.fillRect(Math.random() * 512, Math.random() * 680, 3, 3); }
  g.fillStyle = '#2a1a10'; g.font = 'italic 38px Georgia, serif'; g.textAlign = 'center';
  if (mirror) { g.translate(512, 0); g.scale(-1, 1); }

}
function makeBook() {

  const glow = new THREE.PointLight(0xb0ffd0, 0, 1.2, 1.8); glow.position.set(0, .25, 0); g.add(glow);
  g.userData = {glow}; return g;
}

}
function walk(P, t, speed = 1, amp = 1) {

  P.legs.forEach(({th, sh, ft}, i) => { const q = i ? -sw : sw, kn = Math.max(0, Math.sin(ph + (i ? PI : 0) - .6)) * (.9 + .5 * (amp - 1));
    th.rotation.x = -q * .42 * amp; sh.rotation.x = kn; ft.rotation.x = -kn * .5 + q * .2; });
  P.arms.forEach(({up, fo}, i) => { const q = i ? sw : -sw; up.rotation.x = -q * .4 * amp; fo.rotation.x = -.2 - Math.max(0, q) * .4 * amp; });
}

  P.head.rotation.y = Math.max(-1.2, Math.min(1.2, a)) * k;

}
