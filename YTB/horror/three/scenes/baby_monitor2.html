const torch = new THREE.SpotLight(0xf2f0ff, 0, 7, .42, .55, 1.3); torch.castShadow = true; scene.add(torch, torch.target);

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0x7488b8, 0x121218, .55); scene.add(hemi);
const moon = new THREE.SpotLight(0x86a6e0, 9, 9, .7, .6, 1.2); moon.position.set(5.5, UP + 2.4, -2.2); moon.target.position.set(2.8, UP, -2.6); scene.add(moon, moon.target);
const projLight = new THREE.PointLight(0x7f9cff, 1.6, 5, 1.4); projLight.position.copy(PROJ).add(V(0, .1, 0)); scene.add(projLight);
const lmoon = new THREE.SpotLight(0x7f9ad6, 10, 10, .6, .7, 1.2); lmoon.position.set(1.75, 2.4, 9.5); lmoon.target.position.set(3.0, 0, 4.5); scene.add(lmoon, lmoon.target);
const hallGlow = new THREE.PointLight(0x8aa0d0, 1.6, 6, 1.4); hallGlow.position.set(-.5, 2.2, 5.4); scene.add(hallGlow);
const landing = new THREE.PointLight(0x8a9ad0, 1.2, 5, 1.4); landing.position.set(-1.2, UP + 2.2, -2.6); scene.add(landing);
const key = new THREE.PointLight(0x9fb2dc, .5, 3.5, 1.5); scene.add(key);


// ---------------------------------------------------------------- the parents
const mumP = person(scene, {x: -.55, z: 5.7, face: Math.PI, coat: 0x8a5466, long: true, hair: 0x2e211b, pants: 0x3a3440, seed: 11});
const dadP = person(scene, {x: -.4, z: 6.6, face: Math.PI, coat: 0x3a4558, pants: 0x2b2f38, hair: 0x1a1512, seed: 19});
const hallLight = new THREE.PointLight(0xffd6a0, 0, 6, 1.4); hallLight.position.set(-1.2, 2.45, 5.4); scene.add(hallLight);
mesh(scene, new THREE.SphereGeometry(.07, 8, 6), new THREE.MeshBasicMaterial({color: 0xfff0d0}), -1.2, 2.55, 5.4, false);

// ---------------------------------------------------------------- Haru's bedroom (far away at x 20..23.6, z 0..3.6)
const RW = flat(0x6a6478), RX = 20, BX = 22.5, BZ = 1.0;
mesh(scene, new THREE.BoxGeometry(3.6, .1, 3.6), flat(0x5b4a40), RX + 1.8, -.05, 1.8);
mesh(scene, new THREE.BoxGeometry(3.6, .1, 3.6), flat(0x77727e), RX + 1.8, 2.65, 1.8);
mesh(scene, new THREE.BoxGeometry(3.6, 2.6, .1), RW, RX + 1.8, 1.3, -.05); mesh(scene, new THREE.BoxGeometry(3.6, 2.6, .1), RW, RX + 1.8, 1.3, 3.65);
mesh(scene, new THREE.BoxGeometry(.1, 2.6, 3.6), RW, RX - .05, 1.3, 1.8); mesh(scene, new THREE.BoxGeometry(.1, 2.6, 3.6), RW, RX + 3.65, 1.3, 1.8);
mesh(scene, new THREE.BoxGeometry(1.2, .42, 2.0), flat(0x3e3a52), BX, .21, BZ);                                   // bed
mesh(scene, new THREE.BoxGeometry(1.25, .9, .1), WOOD, BX, .45, .02);
mesh(scene, jitterGeo(new THREE.BoxGeometry(1.15, .14, 1.3), .04, 6), flat(0xc9a9c8), BX, .49, BZ + .25);          // duvet
mesh(scene, jitterGeo(new THREE.BoxGeometry(.6, .12, .35), .03, 4), flat(0xe8e2d6), BX, .52, .3);                 // pillow
mesh(scene, new THREE.BoxGeometry(.45, .5, .4), WOOD, BX + .95, .25, .3);                                         // nightstand
mesh(scene, new THREE.CylinderGeometry(.08, .11, .22, 8), flat(0xf0dcb0), BX + .95, .61, .3);
const bedLamp = new THREE.PointLight(0xffc98a, 1.6, 4.5, 1.5); bedLamp.position.set(BX + .95, .85, .35); scene.add(bedLamp);
[[0x8fb5d8, 21.0], [0xe8a3b8, 21.5], [0xb8d8b0, 23.0]].forEach(([c, x]) => mesh(scene, new THREE.BoxGeometry(.4, .55, .02), flat(c), x, 1.65, .02));   // posters
const rwin = mesh(scene, new THREE.PlaneGeometry(.9, 1.0), new THREE.MeshBasicMaterial({color: 0x253a60}), RX + .01, 1.55, 1.6, false); rwin.rotation.y = Math.PI / 2;
mesh(scene, new THREE.BoxGeometry(1.6, .02, 1.2), flat(0x7a5a6a), RX + 1.2, .01, 2.4);
// her bag, and what falls out of it
const bag = mesh(scene, jitterGeo(new THREE.BoxGeometry(.35, .28, .18), .02, 8), flat(0x9a6a3a), BX + .2, .66, BZ + 1.45);
const junk = [[0x222228, .07, .015, .14], [0xd8c27a, .06, .02, .06], [0xe05a6a, .12, .04, .05]].map(([c, a, b, d], k) => {
  const m = mesh(scene, new THREE.BoxGeometry(a, b, d), flat(c), BX - .1 + k * .14, .57, BZ + 1.15 + k * .1); m.visible = false; return m; });
// the second night-vision camera: high in her corner. And the thing behind her, which only that camera sees
const nvCam2 = new THREE.PerspectiveCamera(42, 4 / 3, .05, 20); nvCam2.position.set(RX + .35, 2.35, 3.3); nvCam2.lookAt(BX - .35, .85, BZ + .25);
const ir2 = new THREE.PointLight(0xffffff, 0, 9, 1.2); ir2.position.copy(nvCam2.position); scene.add(ir2);
const sitB = person(scene, Object.assign({pose: 'sit', x: BX - .45, z: BZ + .3, face: -Math.PI / 2}, HARU)); sitB.g.position.y = -.08;
const ghost = person(scene, {pose: 'sit', x: BX + .2, z: BZ + .42, face: -Math.PI / 2, coat: 0xcfcbc2, skin: 0xe2e0da, hair: 0x0c0b0b, long: true, pants: 0xbab6ad, seed: 23, headScale: 1.3});
ghost.g.position.y = .12; ghost.g.scale.setScalar(1.12); ghost.headPivot.rotation.set(.35, 0, .15);
mesh(ghost.headPivot, new THREE.BoxGeometry(.3, .4, .06), flat(0x0c0b0b), 0, .02, .17);                   // hair hangs over the face
ghost.arms[0].sh.rotation.set(-1.25, 0, .25); ghost.arms[0].el.rotation.set(-.35, 0, 0);                  // a hand on her shoulder
ghost.arms[1].sh.rotation.set(-.1, 0, .05); ghost.arms[1].el.rotation.set(-.1, 0, 0);
ghost.g.visible = false;

// ---------------------------------------------------------------- slots (seconds). English and Darija lines both start at these times
const S = {n1: .6, n2: 9.0, m1: 14.4, n3: 18.0, n4: 23.0, m2: 27.2, n5: 31.4, n6: 37.2, m3: 45.0, n7: 46.8, end: 53.6};
const MP = (x, y, z) => face.localToWorld(V(x, y, z));
function monShot(dist, fov, dx = 0, dy = 0) {
  MON.updateMatrixWorld(true); const c = MP(0, .005, 0), n = MP(0, .005, 1).sub(c).normalize();
  const u = MP(0, 1, 0).sub(MP(0, 0, 0)).normalize(), side = u.clone().cross(n).normalize();      // the screen's own up
  return [c.clone().addScaledVector(n, dist).addScaledVector(side, dx).addScaledVector(u, dy), c, fov, 'mon', u];
}
const headOf = p => { p.g.updateMatrixWorld(true); return p.headPivot.localToWorld(V(0, .12, .05)); };
function shot(t) {
  if (t < 2.0 || t >= S.end) { const [p, l, f, m, u] = monShot(.36, 34); return [p, l, f, 'monend', u]; }          // hook = the last frame
  if (t < 5.0) { const k = ease((t - 2) / 3); return [V(-.3, 1.6, 3.3), V(-1.15, 1.25 - .05 * k, 7.0), 50 - 4 * k, 'door']; }
  if (t < S.n2) { const k = ease((t - 5) / 4); return [V(-.15, 1.72, 3.45 + .1 * k), V(-.85, 1.3, 5.2), 52, 'two']; }
  if (t < 11.8) { const k = ease((t - S.n2) / 2.8); return [V(-.45, 1.62, 3.3 + .1 * k), headOf(mumP), 30, 'mumc']; }
  if (t < S.m1) { const [p, l, f, m, u] = monShot(.5, 36, .05, .04); return [p, l, f, 'monhand', u]; }
  if (t < S.n3) { const k = ease((t - S.m1) / 3.6); return [V(-.45, 1.62, 3.4 + .1 * k), headOf(mumP), 28, 'mumc']; }
  if (t < 20.5) return [V(-.15, 1.72, 3.5), V(-.85, 1.3, 5.2), 50, 'two'];
  if (t < S.n4) { const [p, l, f, m, u] = monShot(.42 - .06 * ease((t - 20.5) / 2.5), 36); return [p, l, f, 'monhand', u]; }
  if (t < S.m2) { const k = ease((t - S.n4) / 4.2); return [V(-.45, 1.62, 3.3 + .4 * k), headOf(mumP), 30 - 4 * k, 'mumc']; }
  if (t < S.n5) { const k = ease((t - S.m2) / 4.2); return [V(-.45, 1.6, 3.45), headOf(mumP), 28 - 3 * k, 'mumq']; }
  if (t < S.n6) return [V(-.75, 1.9, 3.25), V(-1.2, .95, 6.9), 54, 'leave'];
  if (t < 40.5) { const k = ease((t - S.n6) / 3.3); return [V(RX + .6, 1.75 - .1 * k, 3.25), V(BX - .3, .7, BZ + .4), 56 - 4 * k, 'room']; }
  if (t < S.m3) { const k = ease((t - 40.5) / 4.5); return [V(BX - .9, 1.3 - .1 * k, BZ + 2.0), V(BX + .1, .55, BZ + 1.05), 44 - 6 * k, 'bed']; }
  if (t < S.n7) { const [p, l, f, m, u] = monShot(.3 - .06 * ease((t - S.m3) / 1.8), 34); return [p, l, f, 'monbed', u]; }
  if (t < 49.4) { const h = headOf(sitB); return [V(BX - 1.75, 1.15, BZ + .35), h.clone().add(V(0, -.25, 0)), 40, 'over']; }
  if (t < 51.8) { const [p, l, f, m, u] = monShot(.6 - .2 * ease((t - 49.4) / 2.4), 34); return [p, l, f, 'monend', u]; }
  if (t < 53.0) return [nvCam2.position.clone().add(V(.1, -.25, -.1)), V(BX - .35, .85, BZ + .25), 52, 'real'];
  const [p, l, f, m, u] = monShot(.36, 34); return [p, l, f, 'monend', u];
}

let osdClock = '';
function renderAt(t) {
  const mode = shot(t)[3];
  const bedroom = t >= S.n6 && t < S.end - 99 || t >= S.n6 || t < 2.0;
  // who is where
  const inHall = !bedroom;
  mumP.g.visible = dadP.g.visible = inHall && t >= 2.4;
  st.g.visible = inHall && !(mode === 'leave' && t > 36.3);
  sit.g.visible = false; sitB.g.visible = bedroom;
  // the parents come in
  const enter = ease((t - 2.6) / 2.2);
  const aside = ease((t - S.n5) / 1.2);                                              // they step aside to let her out
  mumP.g.position.set(-.55 - .5 * (1 - enter) + .3 * aside, 0, lerp(7.9, 5.7, enter) - .3 * aside); dadP.g.position.set(-.4 - .6 * (1 - enter) + .15 * aside, 0, lerp(8.6, 6.6, enter));
  mumP.body.position.y = .82 + (enter < 1 ? Math.abs(Math.sin(t * 9)) * .02 : 0);
  fdoor.rotation.y = (t > 2.2 && t < 5.2 ? ease((t - 2.2) / .6) * (1 - ease((t - 4.6) / .6)) : t > 34.6 && t < 37.0 ? ease((t - 34.6) / .5) * (1 - ease((t - 36.3) / .5)) : 0) * -1.3;
  porch.intensity = fdoor.rotation.y < -.05 ? 2.2 : 0;
  hallLight.intensity = t > 3.4 ? 2.4 : 0;
  // mum: looks at the monitor, then at Haru, then up the stairs
  mumP.headPivot.rotation.set(mode === 'mumc' && t < S.m1 ? .45 : .1, mode === 'mumq' ? -.9 * ease((t - S.m2 - .8) / 1.5) : 0, 0);
  mumP.eyes.forEach(e => e.scale.set(1, t > S.n4 && t < S.n5 ? 1.5 : 1.35, .5));
  // Haru in the hall, holding the monitor; then she puts it on the console table and leaves
  st.headPivot.rotation.set(.1, 0, 0); st.body.position.y = .82; st.body.rotation.set(0, 0, 0);
  st.arms.forEach((a, i) => { a.sh.rotation.set(0, 0, (i ? 1 : -1) * -.1); a.el.rotation.set(-.15, 0, 0); });
  if (mode !== 'leave') { st.g.position.set(-1.1, 0, 4.4); st.g.rotation.y = 0; st.arms[1].sh.rotation.set(-.7, 0, .15); st.arms[1].el.rotation.set(-1.1, 0, .25); }
  else {
    const k1 = ease((t - S.n5) / 1.4), k2 = ease((t - 33.6) / 2.6);
    st.g.position.set(lerp(lerp(-1.1, -1.75, k1), -1.15, k2), 0, lerp(lerp(4.4, 4.8, k1), 7.5, k2)); st.g.rotation.y = k2 > 0 ? 0 : -1.2 * k1;
    st.body.position.y = .82 + Math.abs(Math.sin(t * 8)) * .02 * (k2 > 0 && k2 < 1 ? 1 : 0);
    if (t < 33.4) { st.arms[1].sh.rotation.set(-.9, 0, .15); st.arms[1].el.rotation.set(-.6, 0, .2); }
  }
  // the monitor: in her hand, on the console table, in her bag, on her bed, in her hands
  let screenOn = 1;
  if (inHall && !(mode === 'leave' && t > 33.3)) {
    st.g.updateMatrixWorld(true); const hp = new THREE.Vector3(); st.arms[1].el.children[1].getWorldPosition(hp);
    MON.position.copy(hp).add(V(0, -.02, .04));
    const turned = t > 19.2 && t < S.m2;                                           // she turns the screen to the mum
    MON.lookAt(turned ? headOf(mumP) : headOf(st)); if (!turned) MON.rotateY(.25);
  } else if (inHall) { MON.position.set(-2.22, .8, 5.05); MON.rotation.set(0, Math.PI / 2 + .3, 0); }
  else if (t >= S.n6 && t < S.n7) {                                                // in the bag, then dropped on the bed, screen up
    MON.position.set(BX + .1, .57, BZ + 1.0); MON.rotation.set(-Math.PI / 2, 0, .5); MON.visible = t > 41.0;
    screenOn = t > 43.2 ? 1 : 0;
  } else {                                                                          // in her hands, on her lap
    sitB.g.updateMatrixWorld(true); const a = new THREE.Vector3(), b = new THREE.Vector3();
    sitB.arms[0].el.children[1].getWorldPosition(a); sitB.arms[1].el.children[1].getWorldPosition(b);
    MON.position.copy(a.add(b).multiplyScalar(.5)).add(V(-.05, .06, 0)); MON.lookAt(headOf(sitB)); MON.rotateX(-.1);
  }
  if (!(t >= S.n6 && t < S.n7)) MON.visible = true;
  bag.visible = bedroom; bag.rotation.z = t > 39.4 && t < S.n7 ? 1.4 : 0; bag.position.y = t > 39.4 && t < S.n7 ? .6 : .66;
  junk.forEach(j => j.visible = t > 39.6 && t < S.n7 || t >= S.n7 || t < 2);
  sitB.headPivot.rotation.set(.55, 0, 0);
  // the feed: the nursery until "there you are", then her own room. The thing behind her only shows on the screen
  const feedRoom = t >= S.m3 || t < 2.0, ghostOn = t >= 49.4 || t < 1.4;
  let glitch = 0;
  for (const [a, b] of [[1.4, 1.62], [43.2, 43.45], [S.m3, S.m3 + .3], [49.15, 49.4]]) if (t >= a && t < b) glitch = 1;
  screenMat.uniforms.glitch.value = glitch; screenMat.uniforms.time.value = t; screenMat.uniforms.on.value = screenOn;
  const clk = feedRoom ? (t < 50 && t >= 2 ? '00:54' : '00:55') : '00:' + String(12 + Math.floor(t / 20)).padStart(2, '0');
  if (clk + feedRoom !== osdClock) { osdClock = clk + feedRoom; osd.redraw({clock: clk}); }
  placeStars(t); mobile.rotation.y = t * .3;
  // LEDs: a little hiss when on, jumping on "there you are"
  const speak = t >= S.m3 && t < S.m3 + 1.0 ? .6 + .4 * Math.abs(Math.sin(t * 37) * Math.sin(t * 23)) : 0;
  const lvl = screenOn ? Math.max(speak, .08 + .06 * Math.abs(Math.sin(t * 13.1) * Math.sin(t * 7.7))) * 5.2 : 0;
  LEDS.forEach((m, k) => m.material.color.copy(m.userData.c).multiplyScalar(lvl > k + .3 ? 2.2 : .12));
  ledLight.position.copy(MP(0, -.04, .06)); ledLight.intensity = screenOn ? .1 + .5 * speak : 0;
  monitorGlow.position.copy(MP(0, .02, .6)); monitorGlow.intensity = screenOn ? (mode.startsWith('mon') ? .15 : .6) : 0;
  // night-vision pass
  if (mode.startsWith('mon') || mode === 'over') {
    const cam2 = feedRoom ? nvCam2 : nvCam, irl = feedRoom ? ir2 : ir;
    irl.intensity = 3; screen.visible = false; key.intensity = 0; ghost.g.visible = feedRoom && ghostOn;
    renderer.setRenderTarget(RT); renderer.render(scene, cam2); renderer.setRenderTarget(null);
    irl.intensity = 0; screen.visible = true; ghost.g.visible = false;
  }
  // camera (aimed after everything has moved)
  const [pos, look, fov, , camUp] = shot(t);
  cam.position.copy(pos); if (camUp) cam.up.copy(camUp); else cam.up.set(0, 1, 0); cam.lookAt(look); cam.fov = fov; cam.updateProjectionMatrix(); cam.up.set(0, 1, 0);
  const shake = mode === 'real' ? .004 : mode === 'door' ? .002 : 0;
  if (shake) cam.position.add(V(Math.sin(t * 91) * shake, Math.sin(t * 77) * shake, 0));
  key.intensity = mode.startsWith('mon') ? .15 : .45; key.position.copy(pos).add(V(0, .3, 0));
  grain.uniforms.vig.value = mode.startsWith('mon') ? .55 : .65;
  render(t);
  return true;
}
window.renderAt = renderAt; window.DUR = 57.0; window.ready = true;
</script>
