const POV = (s, h = 1.5, ahead = 2.4, down = true) => {                     // walking the stairs: eye at step s, looking along the stairs
  const p = stepPos(s); p.y += h; const tgt = stepPos(Math.max(0, Math.min(63, s + (down ? -ahead : ahead)))); tgt.y += h - (down ? .3 : -.1);
  return [p, tgt]; };

  if (t < S.l04) { const k = ease((t - S.l03) / 7.7); const d = .7 - .2 * k; return [V(Math.cos(NA) * (LR - d), TOP + 1.12, Math.sin(NA) * (LR - d)), V(Math.cos(NA) * LR, TOP + 1.1, Math.sin(NA) * LR), 34, 'note']; }  // rule one

  if (t < S.l06) { const k = ease((t - S.l05) / 7.4); return [around(HA + 1.0, 1.25, 1.55), V(HP.x, TOP + .3, HP.z), 50 - 4 * k, 'hatch']; }   // the torch, the hatch opens
  if (t < S.l07) { const [p, l] = POV(descend(t)); return [p, l, 62, 'pov']; }                                                // down into the dark
  if (t < S.l08) { const s = descend(t); if (t < T.coat - .5) { const [p, l] = POV(s); return [p, l, 60, 'pov']; }
    const c = coat.position.clone().add(V(0, -.3, 0)); const p = stepPos(s); p.y += 1.45; return [p, c, 40 - 6 * ease((t - T.coat) / 4), 'coat']; }   // the coat
  if (t < S.l09) { const [p, l] = POV(36, 1.5, 6); l.y -= .5; return [p, l, t < T.them ? 58 : lerp(58, 46, ease((t - T.them) / 4)), 'pov']; }         // them, below
  if (t < S.l10) { const kp = keepers[0], h = kp.headPivot.getWorldPosition(new THREE.Vector3()); const u = upDir(kp.k); const k = ease((t - S.l09) / 7);

  if (t < 98.4) return [V(-.2, 2.2, .3), V(.1, .4, 0), 56, 'bottom'];                                                     // the motor, its hatch open
  if (t < T.relit) return [V(-.3, 1.25, .2), V(.55, .95, -.2), 48, 'lever'];

  if (t < S.l20) { const k = ease((t - S.l19) / 3.4); return [around(HA + .45, 1.15 - .1 * k, 1.62), around(CA, .62, 1.66), 34 - 6 * k, 'copy']; }

  if (t < S.cut) { return [around(HA + .3, 1.3, 1.66), around(CA, .62, 1.66), 30, 'copy']; }                     // she starts to turn round...

// ---------------------------------------------------------------- render one frame
noteState = -2;
function renderAt(t) {

  const lampOn = !dead;

  spill.target.position.set(Math.cos(a) * 19, .5, Math.sin(a) * 19); spill.intensity = lampOn ? 7 * fade : 0;

  const near = pos.distanceTo(lens.position) < 2.6;
  lens.material.color.set(lampOn ? (near ? 0x9c8a58 : 0xfff2c4) : 0x16130c).multiplyScalar(lampOn ? fade : 1); lampGlow.intensity = lampOn ? (near ? 1.4 : 2.5) * fade : 0;
  lensCage.rotation.y = a;
  hemi.intensity = dead ? .12 : .4; moonLight.intensity = dead ? .25 : 1.0; sunset.intensity = 0;
  stars.visible = moon.visible = true;
  // the note: rule one highlighted
  const hi = mode === 'note' ? 0 : -1; if (hi !== noteState) { noteState = hi; noteTex.redraw(hi); }
  // the hatch opens; the gallery door is just a door now
  hatch.rotation.z = 0; hatch.children.forEach(c => 0);
  const hk = t >= T.hatch ? ease((t - T.hatch) / .8) : 0;
  hatch.rotation.x = -1.9 * hk;
  faceInWindow.visible = false; fwEyes.forEach(e => e.visible = false);
  // Haru: in the lantern room (start), on the stairs (torch), at the top (end)
  haru.g.visible = SITTING.g.visible = false;
  const inLantern = ['in', 'note', 'hatch'].includes(mode) && t < S.l06;
  if (t >= S.l02 + 5 && t < S.l04) { SITTING.g.visible = mode === 'in'; SITTING.g.position.set(Math.cos(2.95) * .95, TOP + .03, Math.sin(2.95) * .95); SITTING.g.rotation.y = 2.95 + Math.PI / 2 + .9;
    SITTING.headPivot.rotation.set(-.05, Math.sin(t * .8) * .4, 0); SITTING.arms.forEach((ar, i) => { ar.sh.rotation.set(-.35, 0, (i ? 1 : -1) * -.12); ar.el.rotation.set(-1.2, 0, (i ? 1 : -1) * .35); }); }
  if (mode === 'hatch') { haru.g.visible = true; haru.g.position.set(HP.x - Math.cos(HA) * .55, TOP + .15, HP.z - Math.sin(HA) * .55); haru.g.rotation.y = Math.atan2(Math.cos(HA), Math.sin(HA)); haru.headPivot.rotation.set(.45, 0, 0);
    haru.arms[1].sh.rotation.set(-1.0, 0, .15); haru.arms[1].el.rotation.set(-.5, 0, 0); }
  if (['down', 'turning'].includes(mode)) {                                   // walking down between them
    const s = descend(t), p = stepPos(s), u = upDir(s); haru.g.visible = true; haru.g.position.set(p.x, p.y + .04, p.z); haru.g.rotation.y = Math.atan2(-u.x, -u.z);
    haru.body.position.y = .82 + Math.abs(Math.sin(t * 6)) * .02; haru.headPivot.rotation.set(.55, 0, 0);
    haru.arms[1].sh.rotation.set(-.9, 0, .15); haru.arms[1].el.rotation.set(-.4, 0, 0); }
  if (mode === 'bottom' || mode === 'lever') { haru.g.visible = mode === 'bottom'; haru.g.position.set(-.55, .07, .95); haru.g.rotation.y = 2.4; haru.headPivot.rotation.set(.3, 0, 0); }
  if (mode === 'face') { haru.g.visible = true; copy.g.visible = false; haru.g.position.set(Math.cos(HA + .1) * 1.0, TOP + .15, Math.sin(HA + .1) * 1.0); haru.g.rotation.y = Math.atan2(-Math.cos(HA + .1), -Math.sin(HA + .1)); haru.headPivot.rotation.set(-.05, 0, 0);
    haru.arms[1].sh.rotation.set(-.9, 0, .15); haru.arms[1].el.rotation.set(-.4, 0, 0); haru.body.rotation.z = Math.sin(t * 43) * .012; }
  // the coat: there until she passes; the keepers: there from "them" to the lever

  const kOn = t >= T.them - .2 && t < T.lever;

    const hs = descend(t); const d = p.k - hs;                          // her step relative to theirs: they turn to follow as she passes

  const turnK = t >= T.turn && t < S.cut ? ease((t - T.turn) / 1.2) : 0;
