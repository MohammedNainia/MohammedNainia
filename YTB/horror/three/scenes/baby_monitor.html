const landing = new THREE.PointLight(0x8a9ad0, 1.2, 5, 1.4); landing.position.set(-1.2, UP + 2.2, -2.6); scene.add(landing);
const key = new THREE.PointLight(0x9fb2dc, .5, 3.5, 1.5); scene.add(key);

// ---------------------------------------------------------------- timing (voice/layout.json + words.json)
const T = {n2: 5.38, hum: 14.15, n3: 20.47, laugh: 25.77, n4: 28.34, lean: 33.0, n5: 37.48, door: 39.0, baby: 41.3, nobody: 43.8,
  closet: 47.9, under: 49.6, curtains: 51.3, nothing: 53.6, n7: 54.8, sat: 57.45, m2: 60.3, eyes: 62.0, n8: 64.3, full: 65.4, end: 70.4};
const MP = (x, y, z) => face.localToWorld(V(x, y, z));     // a point on the monitor's face
function monShot(dist, fov, dx = 0, dy = 0) {               // camera straight in front of the screen
  MON.updateMatrixWorld(true); const c = MP(0, .005, 0), n = MP(0, .005, 1).sub(c).normalize();
  const side = V(0, 1, 0).cross(n).normalize();
  return [c.clone().addScaledVector(n, dist).addScaledVector(side, dx).add(V(0, dy, 0)), c, fov];
}
const HOOK = () => monShot(.42, 40, .03, .03);
const HEADP = () => { sit.g.updateMatrixWorld(true); return sit.headPivot.localToWorld(V(0, .12, .05)); };
const faceShot = (dist, side, fov) => { const h = HEADP(); return [h.clone().add(V(-dist, .02, side)), h, fov, 'face']; };
function shot(t) {
  if (t < 4.4) { const [p, l, f] = HOOK(); const k = ease(t / 4.4); return [p.clone().lerp(l, .18 * k), l, f, 'mon']; }
  if (t >= T.end) { const k = ease((t - T.end) / (DUR - T.end)); const [p0, l0] = monShot(.37, 34); const [p1, l1, f1] = HOOK(); return [p0.clone().lerp(p1, k), l0.clone().lerp(l1, k), lerp(34, f1, k), 'mon']; }
  if (t < 9.6) { const k = ease((t - 4.4) / 5.2); return [V(1.25, UP + 1.6 - .1 * k, -.55 - .15 * k), V(3.0, UP + .6, -2.7), 54 - 4 * k, 'nursery']; }
  if (t < T.hum) { const k = ease((t - 9.6) / 4.5); return [V(1.0 + .3 * k, 1.75, 3.5 + .2 * k), V(3.85, .75, 5.8), 50 - 4 * k, 'couch']; }
  if (t < 17.4) { const [p, l, f] = monShot(.5 - .12 * ease((t - T.hum) / 3.3), 36, .05, .02); return [p, l, f, 'mon']; }
  if (t < T.n3) { const k = ease((t - 17.4) / 3); return faceShot(1.9 - .3 * k, -.35, 32); }
  if (t < T.laugh) { const k = ease((t - T.n3) / 5.3); return [V(2.95 + .15 * k, 1.4, 3.55 + .2 * k), V(4.05, .95, 6.0), 50 - 6 * k, 'shoulder']; }
  if (t < T.n4) { const [p, l, f] = monShot(.2, 30); return [p, l, f, 'mon']; }
  if (t < T.lean) { const k = ease((t - T.n4) / 4.66); return faceShot(2.2 - .6 * k, -.2, 32); }
  if (t < T.n5) { const k = ease((t - T.lean) / 4.5); return [V(lerp(2.35, 2.72, k), UP + lerp(1.75, 1.42, k), lerp(-2.2, -2.45, k)), V(3.0, UP + .5, -2.65), 50 - 6 * k, 'lean']; }
  if (t < T.door) return [V(-1.75, UP + 1.65, -2.6), V(-1.75, 1.4, 2.4), 52, 'stairs'];
  if (t < T.baby) { const k = ease((t - T.door) / 2.3); return [V(2.6, UP + 1.4, -2.0), V(0, UP + 1.1, -.95), 50 - 4 * k, 'doorway']; }
  if (t < T.nobody) { const k = ease((t - T.baby) / 2.5); return [V(2.6, UP + 1.15 - .05 * k, -1.95), V(3.0, UP + .55, -2.75), 36 - 4 * k, 'babyclose']; }
  if (t < T.closet) { const k = ease((t - T.nobody) / 4.1); return [V(3.7, UP + 2.2, -3.75), V(1.7, UP + .9, -1.3), 62 - 4 * k, 'wide']; }
  if (t < T.under) return [V(2.3, UP + 1.55, -1.75), V(3.3, UP + 1.15, -.3), 52, 'closet'];
  if (t < T.curtains) { const k = ease((t - T.under) / 1.7); return [V(1.95, UP + .26, -2.5 + .05 * k), V(3.95, UP + .18, -2.5), 56, 'under']; }
  if (t < T.nothing) return [V(3.2, UP + 1.5, -2.1), V(3.95, UP + 1.35, -2.2), 58, 'curtains'];
  if (t < T.n7) return [V(.45, UP + 1.7, -.8), V(3.2, UP + .9, -2.5), 54, 'nothing'];
  if (t < T.sat) { const k = ease((t - T.n7) / 2.65); return [V(.6, 2.15, 2.45), V(lerp(1.0, 3.5, k), .8, lerp(4.2, 5.6, k)), 56, 'walk']; }
  if (t < T.m2) return [V(2.2, 1.25, 4.9), V(3.95, .85, 6.0), 48, 'couch'];
  if (t < T.eyes) { const [p, l, f] = monShot(.34, 34, -.04, .02); return [p, l, f, 'mon']; }
  if (t < T.n8) { const k = ease((t - T.eyes) / 2.3); return faceShot(1.7 - .2 * k, .25, 32); }
  if (t < T.full) { const k = ease((t - T.n8) / 1.1); const [p0, l0] = monShot(.6, 40, .1, .05); const [p1, l1] = monShot(.37, 34); return [p0.clone().lerp(p1, k), l0.clone().lerp(l1, k), lerp(40, 34, k), 'mon']; }
  const [p, l] = monShot(.37 - .05 * (t - T.full) / 5, 34); return [p, l, 34, 'mon'];
}

let osdClock = '';
function renderAt(t) {
  const [pos, look, fov, mode] = shot(t);
  const living = ['mon', 'couch', 'face', 'shoulder', 'walk'].includes(mode);
  // the feed: what is in the crib. The eyes and the hand belong to the end (and the looping first second)
  const late = t >= 67.75 || t < 1.4, eyesOpen = t >= 66.25 || t < 1.4;
  hand.visible = late; bEyesOpen.forEach(e => e.visible = eyesOpen); bEyesShut.forEach(e => e.visible = !eyesOpen);
  let glitch = 0;
  for (const [a, b] of [[1.4, 1.65], [25.95, 26.3], [27.2, 27.4], [66.0, 66.25], [67.5, 67.75]]) if (t >= a && t < b) glitch = 1;
  screenMat.uniforms.glitch.value = glitch; screenMat.uniforms.time.value = t;
  const clk = '23:' + String(41 + Math.floor(t / 20)).padStart(2, '0'); if (clk !== osdClock) { osdClock = clk; osd.redraw({clock: clk}); }
  // curtains: closed, pulled apart when she checks, closed again after
  const cOpen = t >= 51.85 && t < T.n7 ? ease((t - 51.85) / .5) : 0;
  curtains.forEach((c, i) => c.position.z = -2.2 + (i ? 1 : -1) * (.32 + .38 * cOpen));
  clDoors.forEach((d, i) => d.rotation.y = (i ? 1 : -1) * (t >= 48.25 && t < T.n7 ? ease((t - 48.25) / .45) * 1.7 : 0));
  placeStars(t); mobile.rotation.y = t * .3;
  dome.material.color.setHSL(.6 + .05 * Math.sin(t * .7), .7, .75);
  // Haru
  sit.g.visible = t < T.n5 || t >= T.sat;
  st.g.visible = !sit.g.visible && !['under', 'curtains'].includes(mode);
  const lids = mode === 'couch' && t < T.hum ? .3 : 1;
  sit.eyes.forEach(e => e.scale.set(1, 1.35 * (mode === 'face' && t < 18.4 ? lerp(.3, 1, ease((t - 17.4) / 1)) : lids), .5));
  sit.headPivot.rotation.set(t < T.hum ? .2 : .1, t >= T.hum ? -.5 : 0, t < T.hum ? .15 : 0);    // dozing, then turned to the monitor
  sit.body.rotation.z = (t > T.laugh ? Math.sin(t * 43) * .006 : 0);
  if (mode === 'shoulder') sit.headPivot.rotation.set(.25, -.6, 0);
  st.headPivot.rotation.set(0, 0, 0); st.body.position.y = .82; st.body.rotation.set(0, 0, 0);
  st.arms.forEach((a, i) => { a.sh.rotation.set(0, 0, (i ? 1 : -1) * -.1); a.el.rotation.set(-.15, 0, 0); });
  const torchArm = () => { st.arms[1].sh.rotation.set(-1.25, 0, .15); st.arms[1].el.rotation.set(-.2, 0, 0); };
  torch.intensity = 0;
  if (mode === 'stairs') {
    const k = clamp01((t - T.n5) / 1.45), step = 14 - k * 14;
    st.g.position.set(-1.75, UP - step * RISE, Z0 + step * RUN - .1); st.g.rotation.y = Math.PI; st.body.position.y = .82 + Math.abs(Math.sin(k * 26)) * .05; st.body.rotation.x = .15;
  } else if (mode === 'doorway') {
    const k = ease((t - T.door) / 1.4); st.g.position.set(lerp(-.6, .35, k), UP, -.95); st.g.rotation.y = Math.PI / 2; st.headPivot.rotation.set(.12, .1 * Math.sin(t * 2), 0);
  } else if (mode === 'babyclose') {
    st.g.position.set(2.15, UP, -1.75); st.g.rotation.y = 2.1; st.headPivot.rotation.set(.45, 0, 0);
  } else if (mode === 'wide') {
    st.g.position.set(1.8, UP, -1.5); st.g.rotation.y = 1.6 + Math.sin((t - T.nobody) * 1.1) * 1.1; st.headPivot.rotation.set(.05, Math.sin((t - T.nobody) * 1.7) * .4, 0); torchArm();
  } else if (mode === 'closet') {
    st.g.position.set(3.4, UP, -1.3); st.g.rotation.y = -.15; torchArm(); st.arms[0].sh.rotation.set(-1.1, 0, -.2);
  } else if (mode === 'curtains') {
    st.g.position.set(3.66, UP, -2.15); st.g.rotation.y = Math.PI / 2; st.headPivot.rotation.set(.1, 0, 0);
    st.arms.forEach((a, i) => { a.sh.rotation.set(-1.5 - .3 * cOpen, 0, (i ? 1 : -1) * (.1 + .5 * cOpen)); a.el.rotation.set(-.2, 0, 0); });
  } else if (mode === 'nothing') {
    st.g.position.set(3.5, UP, -1.8); st.g.rotation.y = -2.4; st.headPivot.rotation.set(.3, 0, 0); torchArm();
  } else if (mode === 'walk') {
    const k = ease((t - T.n7) / 2.65); st.g.position.set(lerp(.4, 3.5, k), 0, lerp(4.0, 5.3, k)); st.g.rotation.y = Math.atan2(3.1, 1.3); st.body.position.y = .82 + Math.abs(Math.sin(k * 14)) * .015;
  } else { st.g.position.set(1.8, UP, -1.5); }
  // her phone torch during the search (and the run in)
  if (['wide', 'closet', 'curtains', 'nothing', 'under', 'babyclose'].includes(mode)) {
    torch.intensity = mode === 'under' ? 1.0 : mode === 'curtains' ? 1.2 : mode === 'babyclose' ? 0 : mode === 'closet' ? 1.5 : 3;
    if (mode === 'under' || mode === 'curtains') { torch.position.copy(pos).add(V(0, .05, .1)); torch.target.position.copy(look); }
    else { const hp = new THREE.Vector3(); st.arms[1].el.children[1].getWorldPosition(hp); torch.position.copy(hp);
      const fwd = V(Math.sin(st.g.rotation.y), -.25, Math.cos(st.g.rotation.y)); torch.target.position.copy(hp).addScaledVector(fwd, 2); }
  }
  // the monitor: LEDs follow the voice; a little hiss flicker all the time
  const lv = LV[Math.min(LV.length - 1, Math.floor(t * 30))] || 0, hiss = .08 + .06 * Math.abs(Math.sin(t * 13.1) * Math.sin(t * 7.7));
  const lvl = Math.max(lv, hiss) * 5.2;
  LEDS.forEach((m, k) => m.material.color.copy(m.userData.c).multiplyScalar(lvl > k + .3 ? 2.2 : .12));
  ledLight.position.copy(MP(0, -.04, .06)); ledLight.intensity = .1 + .5 * Math.min(1, lv * 1.2);
  monitorGlow.position.copy(MP(0, .02, .6)); monitorGlow.intensity = mode === 'mon' ? .15 : .7;
  camLed.material.color.setScalar(1).multiply(new THREE.Color(0xff3030));
  tvDot.visible = true;
  // night-vision pass (IR on, the monitor screen hidden from itself)
  if (living || mode === 'mon') {
    const z = t < 1.4 ? 1 : t >= 68.2 ? ease((t - 68.2) / 2.2) : 0;     // the feed slowly zooms in on the crib (and stays zoomed through the loop)
    nvCam.fov = 52 - 22 * z; nvCam.position.set(2.0, UP + 2.3, -.75); nvCam.lookAt(lerp(3.1, 3.25, z), UP + lerp(.55, .75, z), lerp(-2.45, -2.6, z)); nvCam.updateProjectionMatrix();
    ir.intensity = 3; screen.visible = false; key.intensity = 0; torch.visible = false;
    renderer.setRenderTarget(RT); renderer.render(scene, nvCam); renderer.setRenderTarget(null);
    ir.intensity = 0; screen.visible = true; torch.visible = true;
  }
  // camera
  cam.position.copy(pos); cam.lookAt(look); cam.fov = fov; cam.updateProjectionMatrix();
  let shake = mode === 'stairs' ? .025 : mode === 'doorway' ? .006 : ['wide', 'closet', 'curtains', 'under'].includes(mode) ? .004 : 0;
  if (shake) cam.position.add(V(Math.sin(t * 91) * shake, Math.sin(t * 77) * shake, 0));
  key.intensity = mode === 'mon' ? .15 : .5; key.position.copy(pos).add(V(0, .3, 0));
  renderer.toneMappingExposure = 1;
  grain.uniforms.vig.value = mode === 'mon' ? .55 : .65;
  render(t);
  return true;
}
window.renderAt = renderAt; window.DUR = DUR; window.ready = true;
</script>
