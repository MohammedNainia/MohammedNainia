<script type="module">
// Character check: Haru, Mum and an older woman, full body. renderAt(0) front, (1) three-quarter, (2) Haru close, (3) walking pose
import {THREE, setup} from './lib.js';
import {clay, add, makePerson, haruOpts, mumOpts, boil} from './clay.js';
const PS = +(new URLSearchParams(location.search).get('s') || 1);
const {scene, cam, render} = setup({bloom: .3, w: Math.round(1080 * PS), h: Math.round(1920 * PS)});
scene.background = new THREE.Color(0xd8d6d2);
add(new THREE.PlaneGeometry(10, 10).rotateX(-Math.PI / 2), clay(0x3a3634), scene);
const key = new THREE.DirectionalLight(0xfff0dc, 2.2); key.position.set(2, 4, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); scene.add(key);
scene.add(new THREE.HemisphereLight(0xc8d0e0, 0x302820, .7)); const rim = new THREE.DirectionalLight(0xa8c0ff, 1.2); rim.position.set(-2, 3, -3); scene.add(rim);
const P = [makePerson(haruOpts), makePerson(mumOpts), makePerson({top: 0x5a4a62, pants: 0x3a3440, shoe: 0x2a2224, hair: 0xd8d4d0, longHair: false, bun: true, hood: false, pocket: false, scale: .93, skin: 0xe8c4a8})];
P.forEach((p, i) => { p.root.position.x = (i - 1) * .48; scene.add(p.root); });
window.renderAt = t => {
  const k = Math.floor(t); boil(k);
  P.forEach(p => { p.root.rotation.y = k === 1 ? -.6 : 0; p.hips.rotation.set(0,0,0); p.hips.position.x = 0; p.chest.rotation.set(0,0,0); p.neck.rotation.set(0,0,0); p.head.rotation.set(0,0,0); p.arms.forEach(({hand}) => hand.rotation.set(0,0,0)); p.legs.forEach(({th, sh, ft}) => { th.rotation.set(0,0,0); sh.rotation.set(0,0,0); ft.rotation.set(0,0,0); }); p.arms.forEach(({up, fo}, i) => { up.rotation.set(k === 3 ? (i ? .4 : -.4) : 0, 0, (i ? 1 : -1) * .06); fo.rotation.set(-.15 - (k === 3) * .5, 0, 0); });
    p.legs.forEach(({th, sh}, i) => { th.rotation.x = k === 3 ? (i ? .35 : -.35) : 0; sh.rotation.x = k === 3 && !i ? .5 : 0; }); if (k !== 3) p.rest(); });
  if (k === 2) { cam.position.set(-.3, 1.3, 1.3); cam.lookAt(-.48, 1.2, 0); cam.fov = 32; }
  else { cam.position.set(0, 1.0, 3.9); cam.lookAt(0, .85, 0); cam.fov = 38; }
  cam.updateProjectionMatrix(); render(t);
};
window.renderAt(0); window.ready = true;
</script></body></html>
