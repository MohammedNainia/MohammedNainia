<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ddd}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Clay Haru v2 on a studio sheet, to compare with YTB/channel_art/haru_turnaround_sheet.png (t < 1) and haru_expressions_sheet.png (t >= 1).
import {THREE, setup} from './lib.js';
import {boil} from './clay.js';
import {makeHaru3 as makeHaru2} from './haru3.js';
const PS = +(new URLSearchParams(location.search).get('s') || 1);
const {scene, cam, renderer, render, grain} = setup({bloom: .05, w: Math.round(1920 * PS), h: Math.round(1080 * PS)});
grain.uniforms.vig.value = .12;
renderer.toneMappingExposure = 1.05;
scene.background = new THREE.Color(0xdcdcdc);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color: 0xdedede, roughness: 1}));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// soft studio light: a big key from the front-left, a fill, a sky dome, a rim
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b4ae, 1.25));
const key = new THREE.DirectionalLight(0xfff4e8, 2.0); key.position.set(-3, 6, 7); key.castShadow = true;
key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 9; key.shadow.blurSamples = 20; key.shadow.bias = -.0004;
Object.assign(key.shadow.camera, {left: -5, right: 5, top: 3, bottom: -1, near: .5, far: 20}); scene.add(key);
const fill = new THREE.DirectionalLight(0xe8eeff, .7); fill.position.set(5, 3, 5); scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, .6); rim.position.set(0, 4, -6); scene.add(rim);
renderer.shadowMap.type = THREE.VSMShadowMap;

// turnaround: front, 3/4 front, side, 3/4 back, back
const views = [0, -.62, -Math.PI / 2, -Math.PI + .62, Math.PI].map((ry, i) => {
  const P = makeHaru2(); P.root.position.set((i - 2) * .72, 0, 0); P.root.rotation.y = ry; P.expr('nervous'); P.sweat(false); P.rest(); scene.add(P.root); return P;
});
// expressions: 8 busts in a 4 x 2 grid (placed far away, filmed by the same camera when t >= 1)
const names = new URLSearchParams(location.search).get('ex') ? ['neutral', 'nervous', 'curious', 'smile', 'scared', 'scream', 'cry', 'whisper'] : [];
const busts = names.map((n, i) => { const P = makeHaru2(); P.root.position.set(30 + (i % 4) * .78, 0, i < 4 ? 0 : 20); P.expr(n); scene.add(P.root);
  if (n === 'whisper') handToMouth(P); return P; });
// whisper: search the arm angles that put the hand by the mouth (cheap brute-force IK)
function handToMouth(P) {
  const A = P.arms[1]; P.root.updateMatrixWorld(true);
  const target = P.face.localToWorld(new THREE.Vector3(.05, -.07, .02)); let best = [1e9];
  for (let ux = -2.2; ux <= 0; ux += .1) for (let uz = -.6; uz <= .4; uz += .1) for (let fx = -2.8; fx <= 0; fx += .1) {
    A.up.rotation.set(ux, 0, uz); A.fo.rotation.set(fx, 0, 0); A.up.updateMatrixWorld(true);
    const d = A.hand.localToWorld(new THREE.Vector3(0, -.06, .02)).distanceTo(target);
    if (d < best[0]) best = [d, ux, uz, fx];
  }
  A.up.rotation.set(best[1], 0, best[2]); A.fo.rotation.set(best[3], 0, 0); A.hand.rotation.set(-.3, 0, 0);
}

// ID mode (?id=1): every part painted one flat colour, orthographic front-on camera, for measure.py
const ID = new URLSearchParams(location.search).get('id');
const idCol = {hair: 0xff0000, skin: 0x00ff00, top: 0x0000ff, pants: 0xffff00, shoes: 0xff00ff};
if (ID) {
  views.forEach((P, i) => P.root.position.x = (i - 2) * 1.0);
  const mats = {}; for (const [k, c] of Object.entries(idCol)) mats[k] = new THREE.MeshBasicMaterial({color: c});
  const cls = {hair: 'hair', skin: 'skin', nose: 'skin', eye: 'skin', white: 'skin', dark: 'skin', mouthIn: 'skin', tongue: 'skin', teeth: 'skin', tear: 'skin', sweat: 'skin', hood: 'top', pants: 'pants', shoe: 'shoes'};
  for (const P of views) { const back = {}; for (const [k, m] of Object.entries(P.M)) back[m.uuid] = mats[cls[k]];
    P.root.traverse(o => { if (o.isMesh && back[o.material.uuid]) o.material = back[o.material.uuid]; }); }
  scene.background = new THREE.Color(0x000000); floor.visible = false; scene.traverse(o => { if (o.isLight) o.visible = false; });
  renderer.toneMapping = THREE.NoToneMapping;
}
const ortho = new THREE.OrthographicCamera(-1.5 * 16 / 9, 1.5 * 16 / 9, 1.5, -1.5, .1, 50); ortho.position.set(0, .85, 10); ortho.lookAt(0, .85, 0);
window.renderAt = t => {
  if (ID) { boil(0); renderer.render(scene, ortho); return; }
  boil(0);
  if (t >= 10) {                                   // one bust alone (t = 10 + index), centred, for the grid
    const i = Math.round(t - 10); views.forEach(P => P.root.visible = false); busts.forEach((P, j) => P.root.visible = j === i);
    const B = busts[i].root.position; cam.fov = 9; cam.position.set(B.x, 1.5, B.z + 4.2); cam.lookAt(B.x, 1.41, B.z);
    cam.aspect = 16 / 9; cam.updateProjectionMatrix(); render(t); return;
  }
  if (t < 1) { views.forEach(P => P.root.visible = true); cam.fov = 14; cam.position.set(0, .72, 9.2); cam.lookAt(0, .7, 0); }
  else { const z = t >= 2 ? 20 : 0; views.forEach(P => P.root.visible = false); busts.forEach((P, i) => P.root.visible = (i < 4) === (t < 2)); cam.fov = 12; cam.position.set(31.17, 1.48, z + 6.2); cam.lookAt(31.17, 1.4, z); }
  cam.aspect = 16 / 9; cam.updateProjectionMatrix(); render(t);
};
window.renderAt(0); window.ready = true;
</script></body></html>
