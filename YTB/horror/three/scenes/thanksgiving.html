  for (let j = 0; j < 4; j++) { add(Cp(.008, .06, .001, 20), clay(0x9a958a), p, [.04, 0, 0], [0, 0, PI / 2]); p = G(p, [.075, 0, 0]); p.rotation.z = -.12; }

// ================================================================ lights (dark: candlelight on the table, a cold window, black corners)
const amb = new THREE.HemisphereLight(0x3a3040, 0x0a0606, .2); scene.add(amb);
const chand = new THREE.PointLight(0xffb070, 0, 4.5, 1.5); chand.position.set(.1, 2.15, .05); chand.castShadow = true; chand.shadow.mapSize.set(1024, 1024); chand.shadow.bias = -.001; scene.add(chand);

const under = new THREE.PointLight(0xa02818, 0, 1.6, 1.5); under.position.set(0, .2, 0); scene.add(under);           // dull red under the table

function lights(o) {

  amb.intensity = (o.amb ?? .2); doorL.intensity = o.door ?? 0; under.intensity = o.under ?? 0; kitchenL.intensity = o.kitchen ?? 0; rimC.intensity = o.rim ?? 0;
  flames.forEach(f => f.visible = (o.candle ?? 1) > 0);
}
let T = 0;

// ================================================================ poses
function reset(P) {
  P.root.position.set(0, 0, 0); P.root.rotation.set(0, 0, 0); P.hips.position.set(0, .82, 0); P.hips.rotation.set(0, 0, 0);
  P.chest.rotation.set(0, 0, 0); P.neck.rotation.set(0, 0, 0); P.head.rotation.set(0, 0, 0); P.back.rotation.set(0, 0, 0);
  P.arms.forEach(({up, fo, hand}, i) => { up.rotation.set(0, 0, (i ? 1 : -1) * .06); fo.rotation.set(-.12, 0, 0); hand.rotation.set(0, 0, 0); });
  P.legs.forEach(({th, sh, ft}) => { th.rotation.set(0, 0, 0); sh.rotation.set(0, 0, 0); ft.rotation.set(0, 0, 0); });
  P.eyes('open'); P.brows(0); P.mouth('closed'); P.root.visible = true;
}
function sit(P, chairG, sc = 1) {         // sit on a chair (seat .47), facing the table
  const p = chairG.position, ry = chairG.rotation.y;
  P.root.rotation.y = ry; P.root.position.set(p.x, .47 - .82 * sc, p.z);
  P.root.position.add(V(Math.sin(ry), 0, Math.cos(ry)).multiplyScalar(-.04));
  P.legs.forEach(({th, sh}) => { th.rotation.x = -1.5; sh.rotation.x = 1.5; });
}

function walk(P, t, speed = 1, amp = 1) {
  const ph = t * PI * 2 * speed, sw = Math.sin(ph);
  P.hips.position.y = .82 - (1 - Math.cos(.42 * amp * sw)) * .74 + Math.abs(Math.cos(ph)) * .012 * amp;
  P.legs.forEach(({th, sh, ft}, i) => { const q = i ? -sw : sw, kn = Math.max(0, Math.sin(ph + (i ? PI : 0) - .6)) * (.9 + .5 * (amp - 1));
    th.rotation.x = -q * .42 * amp; sh.rotation.x = kn; ft.rotation.x = -kn * .5 + q * .2; });
  P.arms.forEach(({up, fo}, i) => { const q = i ? sw : -sw; up.rotation.x = -q * .4 * amp; fo.rotation.x = -.2 - Math.max(0, q) * .4 * amp; });
}

  const F = thing; F.root.visible = true; F.root.position.set(0, 0, 0); F.root.rotation.set(0, 0, 0); F.pelvis.position.set(0, .95, 0);
  F.legs.forEach(({th, sh, ft}, i) => { th.rotation.set(-1.9, 0, (i ? 1 : -1) * .3); sh.rotation.set(2.4, 0, 0); ft.rotation.set(-.6, 0, 0); });

}

const emptyScene = new THREE.Scene(); emptyScene.background = new THREE.Color(0x000000);
let black = false;
const HOOK = [V(.62, 1.12, -.12), V(-.05, .98, .6), 36];

// family at the table: everyone in their seat, hands folded, watching Haru
function family(q, o = {}) {
  reset(gma); reset(gpa); reset(mum); reset(unc); reset(haru); mei.root.visible = false;
  sit(haru, chairs.haru); sit(gma, chairs.gma); sit(mum, chairs.mum); sit(unc, chairs.unc);
  if (o.gpaAtCounter) { gpa.root.position.set(2.62, 0, -1.45); gpa.root.rotation.y = PI; gpa.arms[1].up.rotation.set(-.9, 0, .1); gpa.arms[1].fo.rotation.set(-.6, 0, 0); gpa.arms[1].hand.rotation.x = Math.sin(q * 9) * .25; }
  else sit(gpa, chairs.gpa, 1.08);
  for (const P of [gma, gpa, mum, unc]) if (!(o.gpaAtCounter && P === gpa)) { handsFolded(P); P.mouth('smile'); P.neck.rotation.x = .1; }
  // they watch her: heads turned toward Haru
  for (const P of [gma, mum, unc, gpa]) { const hp = P.root.position; P.head.rotation.y = Math.atan2(-hp.x, .8 - hp.z) - P.root.rotation.y; P.head.rotation.y = Math.atan2(Math.sin(P.head.rotation.y), Math.cos(P.head.rotation.y)) * .7; }

function frame(t) {

  boil(Math.floor(t * 6));
  black = false; thing.root.visible = false; ankleHand.visible = false; napkinG.visible = false; spoon.visible = false; knife.visible = false;
  cloth.position.y = 0; onTable.position.y = .79; onTable.rotation.set(0, 0, 0); chairs.haru.position.set(0, 0, .78); chairs.haru.rotation.set(0, PI, 0);
  pile.scale.setScalar(1); meiPile.visible = false; forks.forEach(f => f.visible = false); hFork.visible = true; doorG.rotation.y = 0;
  family(q);

  if (t < 3.9) {                                     // HOOK: her plate, heaped, and Grandma's spoon adding more; the cloth stirs by her legs
    lights({chand: .9, candle: 1, moon: .4, rim: .8}); rimC.position.set(-.4, 1.3, 1.0);
    gma.arms[1].up.rotation.set(-1.25, 0, -.65); gma.arms[1].fo.rotation.set(-.5, 0, 0); spoon.visible = true;
    pile.scale.setScalar(1.3 + Math.sin(q * 3) * .03);

    lights({chand: 1, candle: 1, moon: .5});
    const k = ease((q - 3.9) / 7);
    C(V(.4 + k * .1, 1.75, 1.55 - k * .2), V(0, 1.0, -.55), 48);
  } else if (t < 16.4) {                             // the rule: Grandma fills the plate again
    lights({chand: 1, candle: 1, moon: .4});
    gma.arms[1].up.rotation.set(-1.25, 0, -.65); gma.arms[1].fo.rotation.set(-.5, 0, 0); spoon.visible = true;
    pile.scale.setScalar(.7 + ease((q - 12) / 3) * .6);
    C(V(.35, 1.25, .95), V(-.3, .88, .3), 36);
  } else if (t < 19.2) {                             // Grandma: "Eat, sweetheart."
    lights({chand: 1, candle: 1, moon: .4, rim: .9}); rimC.position.set(-.9, 1.4, .5);
    gma.mouth(Math.floor(q * 8) % 2 ? 'open' : 'smile', .4);
    C(V(-.75, 1.3, .55), V(-1.38, 1.18, 0), 30); faceTo(gma, cam.position);
  } else if (t < 23.3) {                             // so she keeps eating
    lights({chand: 1, candle: 1, moon: .4, rim: .6}); rimC.position.set(.4, 1.4, 1.2);
    C(V(.2, 1.25, .1), V(0, 1.2, .78), 32);
  } else if (t < 28.4) {                             // under the table: grey fingers slide over her sock
    lights({chand: .25, candle: .2, moon: 0, under: 1.4, amb: .06});
    ankleHand.visible = true; const k = ease((q - 24.4) / 3.4);
    ankleHand.position.set(-.38 + k * .3, .13, .3); ankleHand.rotation.set(0, -.15, -.1);
    C(V(-.48, .22, -.15), V(.0, .12, .38), 42);
  } else if (t < 31.8) {                             // Grandpa is across the room, carving the turkey
    family(q, {gpaAtCounter: true}); knife.visible = true;
    lights({chand: .9, candle: 1, moon: .4, kitchen: 2.2});
    haru.head.rotation.y = -.9; haru.neck.rotation.x = 0; haru.eyes('wide'); haru.brows(.8);
    C(V(-1.15, 1.32, 1.55), V(1.2, 1.1, -.8), 42);
  } else if (t < 38.2) {                             // grace: they bow, to the floor
    lights({chand: .8, candle: 1, moon: .4});
    const bow = ease((q - 32.2) / .8);
    for (const P of [gma, gpa, mum, unc]) { P.chest.rotation.x = .45 * bow; P.neck.rotation.x = .6 * bow; P.eyes(bow > .5 ? 'closed' : 'open'); P.mouth('closed'); }
    haru.eyes('wide'); haru.brows(.7); haru.mouth('closed'); haru.arms[1].up.rotation.set(-.4, 0, -.1); haru.arms[1].fo.rotation.set(-1.0, 0, 0);
    C(V(.25, 2.25, 1.55), V(0, .8, -.15), 44);
  } else if (t < 45.2) {                             // Aki's chair: a plate set anyway; teeth marks on the leg
    lights({chand: .9, candle: 1, moon: .4, rim: .8}); rimC.position.set(.4, .6, -.4);
    C(V(-.08, 1.5, .45), V(0, .84, -.62), 36);
  } else if (t < 48.0) {                             // she hides food in her napkin, under the table
    lights({chand: .9, candle: 1, moon: .4, rim: .7}); rimC.position.set(.3, .9, 1.2);
    napkinG.visible = true; napkinG.position.set(.08, .63, .62);
    haru.arms[1].up.rotation.set(-.2, 0, -.1); haru.arms[1].fo.rotation.set(-1.2, 0, 0); haru.eyes('open'); haru.head.rotation.y = .3; haru.neck.rotation.x = .3;
    C(V(.45, .85, 1.25), V(.05, .62, .62), 34);
  } else if (t < 52.9) {                             // Grandma opens the napkin; the food goes back on the plate
    lights({chand: 1, candle: 1, moon: .4, rim: .8}); rimC.position.set(-.6, 1.4, .8);
    gma.mouth(Math.floor(q * 8) % 2 ? 'open' : 'smile', .4);
    gma.arms[1].up.rotation.set(-1.2, 0, -.7); gma.arms[1].fo.rotation.set(-.6, 0, 0);
    napkinG.visible = true; napkinG.position.set(-.55, .85, .3); napkinG.scale.set(1.3, 1, 1.3); pile.scale.setScalar(.8 + ease((q - 50) / 2) * .5);
    haru.eyes('wide'); haru.brows(.8); haru.mouth('closed');
    C(V(-.25, 1.3, .95), V(-1.1, 1.0, 0), 36); faceTo(gma, haru.head.getWorldPosition(V(0, 0, 0)));
  } else if (t < 57.6) {                             // she runs for the front door. Locked.
    lights({chand: .9, candle: 1, moon: .7, door: 2.4});
    const run = clamp01((q - 53.1) / 2.2);
    haru.root.position.set(lerp(0, -3.75, run), 0, lerp(1.1, 1.4, run)); haru.root.rotation.set(0, -PI / 2, 0); haru.hips.position.y = .82;
    haru.legs.forEach(({th, sh}) => { th.rotation.x = 0; sh.rotation.x = 0; });
    if (run < 1) walk(haru, q, 1.9, 1.5); else { haru.arms[1].up.rotation.set(-1.3, 0, -.3); haru.arms[1].fo.rotation.set(-.4, 0, 0); doorG.rotation.y = Math.sin(q * 30) * .006; }
    haru.eyes('wide'); haru.brows(1); haru.mouth('open', .6); hFork.visible = false;
    C(V(-2.2, 1.3, 2.4), V(-3.6, 1.0, 1.3), 42);
  } else if (t < 61.6) {                             // nobody chased her. They just sat back down.
    lights({chand: 1, candle: 1, moon: .7, rim: .6, door: 1.8}); rimC.position.set(-3.4, 1.6, 2.0);
    haru.root.position.set(-3.75, 0, 1.4); haru.root.rotation.set(0, PI / 2 + .6, 0); haru.hips.position.y = .82; haru.legs.forEach(({th, sh}) => { th.rotation.x = 0; sh.rotation.x = 0; });
    haru.arms.forEach(({up, fo}) => { up.rotation.set(0, 0, 0); fo.rotation.set(-.2, 0, 0); }); haru.eyes('wide'); haru.brows(1); hFork.visible = false;
    C(V(-4.0, 1.35, 2.25), V(-.2, .95, 0), 40);
  } else if (t < 64.6) {                             // the tablecloth starts to rise
    lights({chand: .8, candle: 1, moon: .5, under: 2.2});
    haru.root.visible = false;
    const r = ease((q - 61.8) / 2.6) * .5;
    cloth.position.y = r; onTable.position.y = .79 + r; onTable.rotation.z = Math.sin(q * 5) * .02 * (r > .05);
    C(V(1.75, .95, 1.75), V(0, .62, 0), 40);
  } else if (t < 74.7) {                             // under the risen cloth: the mouth, a napkin tucked under its chin. "Is she ready?"
    lights({chand: .55, candle: .8, moon: .4, under: 2.0, rim: 1.0}); rimC.position.set(0, .7, 1.4); rimC.color.set(0xff9070);
    haru.root.visible = false; cloth.position.y = .5; onTable.position.y = .79 + .5;
    thingPose(); moveTo(thing.root, thing.head, V(0, .52, .25));
    const k = ease((q - 64.8) / 9);
    C(V(0, .3, 1.55 - k * .5), V(0, .48, .2), 40 - k * 10);
    thing.head.rotation.z = Math.sin(q * .9) * .1;
  } else if (t < 76.4) {                             // Grandma: "She's ready."
    lights({chand: 1, candle: 1, moon: .4, rim: .9}); rimC.color.set(0xffc890); rimC.position.set(-.9, 1.4, .5);
    gma.mouth(Math.floor(q * 8) % 2 ? 'open' : 'smile', .4); gma.eyes('closed');
    haru.root.visible = false;
    C(V(-.8, 1.3, .6), V(-1.38, 1.18, 0), 28); faceTo(gma, cam.position);
  } else if (t < 77.6) {                             // her chair scrapes back on its own toward the table; she goes under
    lights({chand: .8, candle: 1, moon: .5, under: 3.0, door: 1.6, rim: 1.2}); rimC.position.set(-1.6, .8, 1.8);
    const k = ease((q - 76.4) / 1.1);
    haru.root.position.set(-3.75 + k * 3.7, 0, 1.4 - k * .6); haru.root.rotation.set(-k * 1.3, PI / 2, 0); haru.eyes('wide'); haru.brows(1); haru.mouth('open', 1);
    haru.arms.forEach(({up}) => up.rotation.set(-2.6, 0, 0)); hFork.visible = false;
    cloth.position.y = .5 * (1 - k); onTable.position.y = .79 + cloth.position.y;
    C(V(-1.6, .55, 2.2), V(-1.2, .4, .9), 44);
  } else if (t < 80.6) {                             // black: scream, cutlery
    black = true;
  } else if (t < 86.3) {                             // for the first time all day, they pick up their forks
    lights({chand: 1.1, candle: 1, moon: .4});
    haru.root.visible = false; chairs.haru.position.set(0, 0, .55);
    forks.forEach(f => f.visible = true);
    const lift = ease((q - 81.0) / 1.5);
    for (const P of [gma, gpa, mum, unc]) { P.mouth('smile'); P.eyes('open'); P.arms[1].up.rotation.set(-.6 - lift * .6, 0, -.1); P.arms[1].fo.rotation.set(-1.2 - lift * .3, 0, 0); P.head.rotation.y *= .3; }
    const k = ease((q - 80.6) / 5.7);
    C(V(0, 1.75, 1.45 - k * .2), V(0, 1.0, -.4), 56 - k * 6);
    for (const P of [gma, gpa, mum, unc]) faceTo(P, cam.position);
    if (q > 86.1) black = true;
  } else {                                           // next Thanksgiving: Haru's chair empty, a plate set anyway; Mei gets the spoon
    lights({chand: 1, candle: 1, moon: .5, under: .3});
    haru.root.visible = false; pile.visible = true; pile.scale.setScalar(.5);
    reset(mei); sit(mei, chairs.mei, .66); mei.root.visible = true; meiPile.visible = true; meiPile.scale.setScalar(.9 + ease((q - 88.5) / 1.5) * .5);
    mei.arms.forEach(({up, fo}) => { up.rotation.set(-.4, 0, 0); fo.rotation.set(-1.0, 0, 0); }); mei.neck.rotation.x = .2;
    gma.arms[1].up.rotation.set(-1.15, 0, -.35); gma.arms[1].fo.rotation.set(-.6, 0, 0); spoon.visible = q > 88;
    gma.mouth(q > 88.4 && q < 90.8 && Math.floor(q * 8) % 2 ? 'open' : 'smile', .4); gma.head.rotation.y = .9;
    cloth.position.y = Math.max(0, Math.sin(q * 9)) * .006 * (q > 91);
    const k = ease((q - 86.3) / 7);
    C(V(lerp(.3, -.0, k), lerp(1.45, 1.12, k), lerp(-.5, -.12, k)), V(lerp(-.3, -.67, k), lerp(.95, .98, k), lerp(.5, .6, k)), lerp(44, 36, k));
  }
}

window.renderAt = t => { frame(t); if (black) renderer.render(emptyScene, cam); else render(t); };
window.dbg = t => { frame(t); scene.updateMatrixWorld(true); const w = o => o.getWorldPosition(V(0, 0, 0)).toArray().map(v => +v.toFixed(2));
  return {cam: cam.position.toArray().map(v => +v.toFixed(2)), haru: w(haru.head), gma: w(gma.head), gpa: w(gpa.head), thing: w(thing.head), mei: w(mei.head)}; };
window.renderAt(0); window.ready = true;
</script></body></html>
