<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Check page for a rigged generated character (glb_person.js): ?glb=haru_rodin  renderAt(i) shows test i: stand, walk, run, sit, arms up, scared, reach, head turn, crouch.
import {THREE, setup} from './lib.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {pose, walk, look} from './clay.js';
import {makeGlbPerson} from './glb_person.js';
const q = new URLSearchParams(location.search), PS = +(q.get('s') || 1);
const {scene, cam, render, renderer, grade, grain} = setup({bloom: .15, w: Math.round(1080 * PS), h: Math.round(1920 * PS)});
renderer.toneMapping = THREE.NeutralToneMapping; grade('none'); grain.uniforms.sat.value = 1.08; grain.uniforms.vig.value = 0; renderer.shadowMap.type = THREE.VSMShadowMap;
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), .04).texture;
scene.background = new THREE.Color(0xe6e4e0); scene.fog = new THREE.Fog(0xe6e4e0, 5.6, 9);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(20, 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({color: 0xb4b1ac, roughness: 1, envMapIntensity: .5})); floor.receiveShadow = true; scene.add(floor);
const key = new THREE.DirectionalLight(0xfff4e8, 1.2); key.position.set(1.5, 3, 4); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 14; key.shadow.blurSamples = 24; key.shadow.bias = -.0006;
Object.assign(key.shadow.camera, {left: -1.2, right: 1.2, top: 1.6, bottom: -.2, near: .5, far: 12}); scene.add(key);
const rim = new THREE.DirectionalLight(0xe8f0ff, .6); rim.position.set(-2, 2.5, -3); scene.add(rim);
const H = await makeGlbPerson(q.get('glb') || 'haru_rodin'); scene.add(H.root); window.H = H;
const reset = P => { P.root.rotation.set(0, 0, 0); P.hips.position.set(0, .82, 0); P.hips.rotation.set(0, 0, 0);
  P.chest.position.copy(P.restPos.chest); P.neck.position.copy(P.restPos.neck);
  for (const o of [P.chest, P.neck, P.head]) o.rotation.set(0, 0, 0); P.head.position.set(0, P.neckLen, 0);
  P.arms.forEach(({up, fo, hand}) => { up.rotation.set(0, 0, 0); fo.rotation.set(0, 0, 0); hand.rotation.set(0, 0, 0); });
  P.legs.forEach(({th, sh, ft}) => { th.rotation.set(0, 0, 0); sh.rotation.set(0, 0, 0); ft.rotation.set(0, 0, 0); }); };
const TESTS = ['stand', 'walk', 'run', 'sitChair', 'armsUp', 'scared', 'reach', 'turn', 'cower'];
const FACES = ['neutral', 'worried', 'scared', 'terrified', 'sad', 'angry', 'creepySmile', 'surprised', 'shock', 'blink', 'talkA', 'talkB'];
if (q.get('face')) window.renderAt = t => { const n = FACES[Math.floor(t) % FACES.length]; reset(H); H.rest();   // ?face=1: the drawn face, close up
  if (n === 'blink') H.eyes('closed'); else if (n === 'talkA') H.mouth('open', .5); else if (n === 'talkB') H.mouth('o', .8); else H.expr(n);
  H.root.updateMatrixWorld(true); const h = H.head.getWorldPosition(new THREE.Vector3()); const ang = +(q.get('ang') || 0); cam.position.set(h.x + Math.sin(ang) * 1.6, h.y + .1, h.z + Math.cos(ang) * 1.6); cam.lookAt(h.x, h.y + .06, h.z); cam.fov = 22; cam.updateProjectionMatrix(); render(t); };
else window.renderAt = t => { const n = TESTS[Math.floor(t) % TESTS.length]; reset(H); H.root.rotation.y = -.5;
  if (n === 'walk') walk(H, .3, {}); else if (n === 'run') walk(H, .35, {run: true}); else if (n === 'turn') look(H, {turn: 1.0, tilt: .2}); else if (n !== 'stand') pose(H, n);
  cam.position.set(0, .72, 5.2); cam.lookAt(0, .66, 0); cam.fov = 22; cam.updateProjectionMatrix(); render(t); };
window.renderAt(0); window.ready = true;
</script></body></html>
