<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<!-- Motion check. renderAt(t): Haru walks across (side view) from t = 0, then stops; Leo walks scared. window.slip(): how far the
     standing foot slides on the floor over 4 s of walking (should be ~0). renderAt(100 + t): pose blending and face test. -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import {THREE, setup} from './lib.js';
import {makeChar} from './characters.js';
import {walkTo, walk, poseBlend, face, jolt, walkDuration, stanceLeg, SOLE, contact} from './motion.js';
import {POSES, groundIt} from './haru3_poses.js';
const {scene, cam, renderer, render, grain} = setup({bloom: .05, w: 1600, h: 900});
grain.uniforms.vig.value = .1; scene.background = new THREE.Color(0xdcdcdc); renderer.shadowMap.type = THREE.VSMShadowMap;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color: 0xdedede, roughness: 1})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(10, 40, 0xb0b0b0, 0xc4c4c4); grid.position.y = .001; scene.add(grid);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b4ae, 1.25));
const key = new THREE.DirectionalLight(0xfff4e8, 2.0); key.position.set(-3, 6, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6;
Object.assign(key.shadow.camera, {left: -4, right: 4, top: 3, bottom: -1, near: .5, far: 20}); scene.add(key);
const H = makeChar('haru'), L = makeChar('leo'), F = makeChar('haru');
for (const P of [H, L, F]) scene.add(P.root);
const A = {from: [-2.2, 0], to: [1.8, 0]}, B = {from: [-2.6, -1.2], to: [1.2, -1.2]};
const byName = n => POSES.find(p => p.name === n).fn;
window.renderAt = t => {
  if (t >= 100) {                                         // pose blending + face: stand -> jump back -> crouch, scared face, a jolt
    const u = t - 100; H.root.visible = L.root.visible = false; F.root.visible = true; F.root.position.set(0, 0, 0); F.root.rotation.set(0, 0, 0);
    poseBlend(F, u, [[0, P => P.rest()], [.6, byName('jump back'), .25], [1.4, byName('crouch')]]);
    face(F, u, {expr: [[0, 'curious'], [.5, 'scared'], [1.4, 'nervous']]});
    jolt(F, u, .5); F.root.updateMatrixWorld(true);
    cam.fov = 26; cam.aspect = 16 / 9; cam.position.set(0, 1.0, 4.5); cam.lookAt(0, .75, 0); cam.updateProjectionMatrix(); render(t); return;
  }
  if (t >= 70) {                                          // running, close side view: t - 70 = run time
    const u = t - 70; F.root.visible = false; L.root.visible = false; H.root.visible = true;
    walk(H, u, {from: [-2, 0], dir: Math.PI / 2, run: 1, cadence: 1.45, stride: 1.1}); face(H, u, {expr: [[0, 'effort']]}); H.root.updateMatrixWorld(true);
    const x = H.root.position.x; cam.fov = 22; cam.position.set(x, .7, 4.2); cam.lookAt(x, .6, 0); cam.aspect = 16 / 9; cam.updateProjectionMatrix(); render(t); return;
  }
  if (t >= 50) {                                          // close side view following Haru: t - 50 = walk time
    const u = t - 50; F.root.visible = false; H.root.visible = true; L.root.visible = false;
    walkTo(H, u, Object.assign({start: 0}, A)); face(H, u, {expr: [[0, 'neutral']]}); H.root.updateMatrixWorld(true);
    const x = H.root.position.x; cam.fov = 24; cam.aspect = 16 / 9; cam.position.set(x, .75, 4.2); cam.lookAt(x, .7, 0); cam.updateProjectionMatrix(); render(t); return;
  }
  F.root.visible = false; H.root.visible = L.root.visible = true;
  walkTo(H, t, Object.assign({start: .2}, A)); face(H, t, {expr: [[0, 'neutral']]});
  walkTo(L, t, Object.assign({start: 0, mood: 1, cadence: 1.1, stride: .8}, B)); face(L, t, {expr: [[0, 'scared']]});
  cam.fov = 30; cam.aspect = 16 / 9; cam.position.set(0, 1.0, 6.5); cam.lookAt(0, .7, -.5); cam.updateProjectionMatrix(); render(t);
};
// slip test: track each foot's sole in world space at every stop-motion frame; while a foot is the lower one and stays
// low for two frames, it should not move along the floor
window.slip = () => {
  const out = []; for (const [P, o] of [[H, Object.assign({start: 0}, A)], [L, Object.assign({start: 0, mood: 1, cadence: 1.1, stride: .8}, B)]]) {
    let prev = null, worst = 0, sum = 0, n = 0;
    for (let f = 0; f < 48; f++) { walk(P, f / 12, {from: o.from, dir: Math.PI / 2, start: 0, mood: o.mood || 0, cadence: o.cadence || .9, stride: o.stride || 1}); P.root.updateMatrixWorld(true);
      const st = stanceLeg(((f / 12) * (o.cadence || .9)) % 1), pts = SOLE.map(v => P.legs[st].ft.localToWorld(v.clone())), c = contact(pts);
      if (prev && prev.st === st) { const q = P.legs[st].ft.localToWorld(SOLE[c].clone()), d = Math.hypot(q.x - prev.p[c].x, q.z - prev.p[c].z); worst = Math.max(worst, d); sum += d; n++; }
      prev = {st, p: pts}; }
    out.push(`${P === H ? 'Haru' : 'Leo (scared)'}: walk ${walkDuration(P, o.from, o.to, o).toFixed(1)} s for ${(o.to[0] - o.from[0]).toFixed(1)} m; standing foot slides on average ${(sum / n * 1000).toFixed(1)} mm per frame, worst ${(worst * 1000).toFixed(1)} mm`); }
  return out.join('\n');
};
window.dump = () => { const P = H, rows = [];
  for (let f = 0; f < 26; f++) { walk(P, f / 12, {from: [0, 0], dir: Math.PI / 2, start: 0}); P.root.updateMatrixWorld(true);
    const ft = P.legs.map(l => l.ft.localToWorld(new THREE.Vector3(0, -.05, .03)));
    rows.push(f + ': root ' + P.root.position.x.toFixed(3) + '  L ' + ft[0].x.toFixed(3) + ',' + ft[0].y.toFixed(3) + '  R ' + ft[1].x.toFixed(3) + ',' + ft[1].y.toFixed(3)); }
  return rows.join('\n'); };
// full gait check: for walk, scared walk and run, over 6 s at 12 frames a second:
//  slide  = how far the touching point of the planted foot moves along the floor between frames (should be ~0)
//  sink   = how far any heel/toe goes below the floor (should be 0)
//  float  = frames where the planted foot is more than 5 mm above the floor (should be 0 for walks; a run may leave the floor briefly)
//  scuff  = frames where the swinging foot drags on the floor away from its landing / take-off (toe < 3 mm while mid-swing)
window.gait = () => { const rows = [];
  for (const [name, o] of [['walk', {}], ['scared walk', {mood: 1, cadence: 1.1, stride: .8}], ['run', {run: 1, cadence: 1.45, stride: 1.1}]]) for (const P of [H, L]) {
    let prev = null, slide = 0, sink = 0, flo = 0, scuff = 0;
    for (let f = 0; f < 72; f++) { const t = f / 12, cad = o.cadence || .9;
      walk(P, t, Object.assign({from: [0, 0], dir: Math.PI / 2, start: 0}, o)); P.root.updateMatrixWorld(true);
      const ph = (t * cad) % 1, st = stanceLeg(ph), sw = 1 - st;
      const pts = l => SOLE.map(v => P.legs[l].ft.localToWorld(v.clone()));
      const S = pts(st), W = pts(sw), c = contact(S);
      sink = Math.min(sink, ...S.map(p => p.y), ...W.map(p => p.y));
      if (S[c].y > .005) flo++;
      const swu = ((ph + (sw ? .5 : 0)) % 1);   // swing progress for the other leg (cos<0 half = stance)
      const lowW = Math.min(...W.map(p => p.y)), mid = Math.abs(Math.cos(((ph + (sw === 0 ? 0 : .5)) % 1) * Math.PI * 2)) > .5;
      if (lowW < .003 && mid) scuff++;
      if (prev && prev.st === st) { const q = P.legs[st].ft.localToWorld(SOLE[c].clone()); slide = Math.max(slide, Math.hypot(q.x - prev.p[c].x, q.z - prev.p[c].z)); }
      prev = {st, p: S}; }
    rows.push(`${name.padEnd(12)} ${P === H ? 'Haru' : 'Leo '}: slide max ${(slide * 1000).toFixed(1)} mm, sink ${(-sink * 1000).toFixed(1)} mm, planted foot floating ${flo}/72 frames, swing foot scuffing ${scuff}/72`); }
  return rows.join('\n'); };
window.clear = () => { const rows = [];
  for (const [name, o] of [['walk', {}], ['scared walk', {mood: 1, cadence: 1.1, stride: .8}], ['run', {run: 1, cadence: 1.45, stride: 1.1}]]) {
    let minMid = 1, drag = 0; const P = H, cad = o.cadence || .9;
    for (let f = 0; f < 144; f++) { const t = f / 24; walk(P, t, Object.assign({from: [0, 0], dir: Math.PI / 2, start: 0}, o)); P.root.updateMatrixWorld(true);
      const ph = (t * cad) % 1, sw = 1 - stanceLeg(ph), p = (ph * Math.PI * 2 + (sw ? Math.PI : 0)), u = (((p + Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / Math.PI;
      const lo = Math.min(...SOLE.map(v => P.legs[sw].ft.localToWorld(v.clone()).y));
      if (u > .12 && u < .88) { minMid = Math.min(minMid, lo); if (lo < .004) drag++; } }
    rows.push(`${name.padEnd(12)}: lowest point of the swinging foot mid-swing ${(minMid * 1000).toFixed(1)} mm, frames dragging ${drag}`); }
  return rows.join('\n'); };
window.runswing = () => { const P = H, rows = [];
  for (let f = 0; f < 36; f++) { const t = f / 24; walk(P, t, {from: [0, 0], dir: Math.PI / 2, start: 0, run: 1, cadence: 1.45, stride: 1.1}); P.root.updateMatrixWorld(true);
    const ph = (t * 1.45) % 1, sw = 1 - stanceLeg(ph), p = ph * Math.PI * 2 + (sw ? Math.PI : 0), u = (((p + Math.PI / 2) % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI) / Math.PI;
    const h = SOLE.map(v => P.legs[sw].ft.localToWorld(v.clone()).y * 1000);
    if (u > .05 && u < .95) rows.push('swing ' + u.toFixed(2) + '  heel ' + h[0].toFixed(0) + ' mm  toe ' + h[2].toFixed(0) + ' mm'); }
  return rows.join('\n'); };
window.landing = () => { const P = H, rows = []; let prevW = null;
  for (let f = 0; f < 40; f++) { const t = f / 12; walk(P, t, {from: [0, 0], dir: Math.PI / 2, start: 0}); P.root.updateMatrixWorld(true);
    const ph = (t * .9) % 1, st = stanceLeg(ph), sw = 1 - st, W = SOLE.map(v => P.legs[sw].ft.localToWorld(v.clone())), Sx = SOLE.map(v => P.legs[st].ft.localToWorld(v.clone()));
    const lo = Math.min(...W.map(p => p.y));
    if (lo < .002 && prevW && prevW.sw === sw) rows.push(`frame ${f}: swinging foot touching (lowest ${(lo*1000).toFixed(1)} mm), its touching point (${['heel','sole','toe'][contact(W)]}) moved ${(Math.hypot(W[contact(W)].x - prevW.W[contact(W)].x, W[contact(W)].z - prevW.W[contact(W)].z) * 1000).toFixed(0)} mm since last frame; planted foot lowest ${(Math.min(...Sx.map(p => p.y)) * 1000).toFixed(1)} mm`);
    prevW = {sw, W}; }
  return rows.join('\n') || 'no touching swing foot'; };
window.renderAt(0); window.ready = true;
</script></body></html>
