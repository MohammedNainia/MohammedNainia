<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style></head><body>
<!-- Motion check. renderAt(t): Haru walks across (side view) from t = 0, then stops; Leo walks scared. window.slip(): how far the
     standing foot slides on the floor over 4 s of walking (should be ~0). renderAt(100 + t): pose blending and face test. -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import {THREE, setup} from './lib.js';
import {makeChar} from './characters.js';
import {walkTo, walk, poseBlend, face, jolt, walkDuration, solePoints} from './motion.js';
import {POSES, groundIt} from './haru3_poses.js';
const {scene, cam, renderer, render, grain} = setup({bloom: .05, w: 1600, h: 900});
grain.uniforms.vig.value = .1; scene.background = new THREE.Color(0xdcdcdc); renderer.shadowMap.type = THREE.VSMShadowMap;
const floor = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({color: 0xdedede, roughness: 1})); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
const grid = new THREE.GridHelper(10, 40, 0xb0b0b0, 0xc4c4c4); grid.position.y = .001; scene.add(grid);
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b4ae, 1.25));
const key = new THREE.DirectionalLight(0xfff4e8, 2.0); key.position.set(-3, 6, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6;
Object.assign(key.shadow.camera, {left: -4, right: 4, top: 3, bottom: -1, near: .5, far: 20}); scene.add(key);
const H = makeChar('haru'), L = makeChar('leo'), F = makeChar('haru');
for (const P of [H, L, F]) scene.add(P.root);
const A = {from: [-2.2, 0], to: [1.8, 0]}, B = {from: [-2.6, -1.2], to: [1.2, -1.2]};
const byName = n => POSES.find(p => p.name === n).fn;
window.renderAt = t => {
  if (t >= 100) {                                         // pose blending + face: stand -> jump back -> crouch, scared face, a jolt
    const u = t - 100; H.root.visible = L.root.visible = false; F.root.visible = true; F.root.position.set(0, 0, 0); F.root.rotation.set(0, 0, 0);
    poseBlend(F, u, [[0, P => P.rest()], [.6, byName('jump back'), .25], [1.4, byName('crouch')]]);
    face(F, u, {expr: [[0, 'curious'], [.5, 'scared'], [1.4, 'nervous']]});
    jolt(F, u, .5); F.root.updateMatrixWorld(true);
    cam.fov = 26; cam.aspect = 16 / 9; cam.position.set(0, 1.0, 4.5); cam.lookAt(0, .75, 0); cam.updateProjectionMatrix(); render(t); return;
  }
  if (t >= 70) {                                          // running, close side view: t - 70 = run time
    const u = t - 70; F.root.visible = false; L.root.visible = false; H.root.visible = true;
    walk(H, u, {from: [-2, 0], dir: Math.PI / 2, run: 1, cadence: 1.45, stride: 1.1}); face(H, u, {expr: [[0, 'effort']]}); H.root.updateMatrixWorld(true);
    const x = H.root.position.x; cam.fov = 22; cam.position.set(x, .7, 4.2); cam.lookAt(x, .6, 0); cam.aspect = 16 / 9; cam.updateProjectionMatrix(); render(t); return;
  }
  if (t >= 50) {                                          // close side view following Haru: t - 50 = walk time
    const u = t - 50; F.root.visible = false; H.root.visible = true; L.root.visible = false;
    walkTo(H, u, Object.assign({start: 0}, A)); face(H, u, {expr: [[0, 'neutral']]}); H.root.updateMatrixWorld(true);
    const x = H.root.position.x; cam.fov = 24; cam.aspect = 16 / 9; cam.position.set(x, .75, 4.2); cam.lookAt(x, .7, 0); cam.updateProjectionMatrix(); render(t); return;
  }
  F.root.visible = false; H.root.visible = L.root.visible = true;
  walkTo(H, t, Object.assign({start: .2}, A)); face(H, t, {expr: [[0, 'neutral']]});
  walkTo(L, t, Object.assign({start: 0, mood: 1, cadence: 1.1, stride: .8}, B)); face(L, t, {expr: [[0, 'scared']]});
  cam.fov = 30; cam.aspect = 16 / 9; cam.position.set(0, 1.0, 6.5); cam.lookAt(0, .7, -.5); cam.updateProjectionMatrix(); render(t);
};
// gait check for walk, scared walk and run (Haru and Leo), 6 s at 12 frames a second. For each of the 6 sole points
// (heel, ball, toe tip of both feet): if it touches the floor (< 2 mm) in two frames in a row, it must not move between them.
//  slide = worst such movement (should be ~0: no skating, skimming or dragging), sink = deepest point below the floor,
//  air = frames with no foot on the floor (fine for a run, not for a walk)
window.gait = () => { const rows = [];
  for (const [name, o] of [['walk', {}], ['scared walk', {mood: 1, cadence: 1.1, stride: .8}], ['run', {run: 1, cadence: 1.45, stride: 1.1}]]) for (const P of [H, L]) {
    let prev = null, slide = 0, sink = 0, air = 0, touches = 0;
    for (let f = 0; f < 72; f++) { walk(P, f / 12, Object.assign({from: [0, 0], dir: Math.PI / 2, start: 0}, o)); P.root.updateMatrixWorld(true);
      const pts = P.legs.flatMap(l => solePoints(l)); sink = Math.min(sink, ...pts.map(p => p.y));
      if (Math.min(...pts.map(p => p.y)) > .002) air++;
      if (prev) pts.forEach((p, k) => { if (p.y < .002 && prev[k].y < .002) { touches++; slide = Math.max(slide, Math.hypot(p.x - prev[k].x, p.z - prev[k].z)); } });
      prev = pts.map(p => p.clone()); }
    rows.push(`${name.padEnd(12)} ${P === H ? 'Haru' : 'Leo '}: touching point moves at most ${(slide * 1000).toFixed(1)} mm (${touches} checks), sink ${(-sink * 1000).toFixed(1)} mm, frames in the air ${air}/72`); }
  return rows.join('\n'); };
window.worst = (o) => { const P = H; let prev = null, out = [];
  for (let f = 0; f < 72; f++) { walk(P, f / 12, Object.assign({from: [0, 0], dir: Math.PI / 2, start: 0}, o)); P.root.updateMatrixWorld(true);
    const pts = P.legs.flatMap(l => solePoints(l));
    if (prev) pts.forEach((p, k) => { if (p.y < .002 && prev[k].y < .002) { const d = Math.hypot(p.x - prev[k].x, p.z - prev[k].z); if (d > .002) out.push(`f${f} ${['L heel','L ball','L tip','R heel','R ball','R tip'][k]} moved ${(d*1000).toFixed(1)} mm, y ${(p.y*1000).toFixed(1)}`); } });
    pts.forEach((p, k) => { if (p.y < -.002) out.push(`f${f} ${['L heel','L ball','L tip','R heel','R ball','R tip'][k]} sinks ${(-p.y*1000).toFixed(1)} mm`); });
    prev = pts.map(p => p.clone()); }
  return out.slice(0, 14).join('\n'); };
window.renderAt(0); window.ready = true;
</script></body></html>
