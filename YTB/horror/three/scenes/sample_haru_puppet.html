<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#efe6d6}canvas{display:block}</style></head>
<body><canvas id="c" width="420" height="520"></canvas>
<script>
// Code-only sample 2: Haru as a 2D paper cut-out puppet (side view). Each piece is a shape on a pivot; the walk turns the pivots.
const cv = document.getElementById('c'), x = cv.getContext('2d'), W = cv.width, H = cv.height;
// paper grain, made once
const grain = document.createElement('canvas'); grain.width = W; grain.height = H;
{ const g = grain.getContext('2d'), d = g.createImageData(W, H); let s = 7;
  for (let i = 0; i < d.data.length; i += 4) { s = (s * 16807) % 2147483647; const v = 128 + ((s % 60) - 30);
    d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 26; } g.putImageData(d, 0, 0); }
const COL = {skin: '#f2d0b4', hood: '#d9a23a', hoodD: '#bf8a2a', pants: '#57565e', pantsD: '#47464e', shoe: '#f5f2ec', hair: '#1d1c23', hairD: '#141319'};

function piece(fn, col) {          // one paper piece: drop shadow, fill, pale cut edge
  x.save(); x.shadowColor = 'rgba(60,40,20,.28)'; x.shadowOffsetX = 3; x.shadowOffsetY = 4; x.shadowBlur = 3;
  x.beginPath(); fn(); x.fillStyle = col; x.fill(); x.restore();
  x.save(); x.beginPath(); fn(); x.lineWidth = 1.6; x.strokeStyle = 'rgba(255,248,235,.55)'; x.stroke(); x.restore();
}
const rr = (X, Y, w, h, r) => x.roundRect(X, Y, w, h, r);
const at = (px, py, a, f) => { x.save(); x.translate(px, py); x.rotate(a); f(); x.restore(); };

function leg(a, k, f, dark) {
  const c1 = dark ? COL.pantsD : COL.pants;
  at(0, 0, a, () => {
    piece(() => rr(-15, -8, 30, 92, 14), c1);
    at(0, 80, k, () => {
      piece(() => rr(-12, -6, 24, 86, 11), c1);
      at(0, 80, f, () => piece(() => { x.moveTo(-14, -8); x.lineTo(14, -10); x.quadraticCurveTo(38, -6, 40, 6); x.lineTo(40, 12); x.lineTo(-16, 12); x.closePath(); }, COL.shoe));
    });
  });
}
function arm(a, e, dark) {
  const c = dark ? COL.hoodD : COL.hood;
  at(0, 0, a, () => {
    piece(() => rr(-15, -10, 30, 78, 14), c);
    at(0, 62, e, () => { piece(() => rr(-14, -6, 28, 64, 12), c); piece(() => x.arc(0, 66, 10, 0, 7), COL.skin); });
  });
}

window.renderAt = t => {
  const p = t * Math.PI * 2, sw = Math.sin(p);
  x.fillStyle = '#efe6d6'; x.fillRect(0, 0, W, H);
  // ground: a torn paper strip
  piece(() => { x.moveTo(0, 452); for (let i = 0; i <= 42; i++) x.lineTo(i * 10, 450 + Math.sin(i * 2.7) * 2.5); x.lineTo(W, H); x.lineTo(0, H); x.closePath(); }, '#d8c8ae');
  const bob = Math.abs(Math.cos(p)) * 6;
  const hx = 200, hy = 266 + 168 * (1 - Math.cos(.5 * sw)) - Math.abs(Math.cos(p)) * 3;          // hip pivot
  const thigh = q => q * .5, knee = ph => Math.max(0, Math.sin(ph - .6)) * .9;
  // back limbs first (darker), then hair, body, front limbs, head
  at(hx + 4, hy - 120, 0, () => arm(sw * .5, -.3 - Math.max(0, sw) * .35, true));
  at(hx, hy, 0, () => leg(-thigh(sw), knee(p + Math.PI), sw * .2, true));
  // long hair down the back, swinging a little
  at(hx - 4, hy - 168, .05 + Math.cos(p * 2) * .03, () => piece(() => { x.moveTo(-10, 0); x.lineTo(-44, 10); x.quadraticCurveTo(-52, 90, -40, 150); x.lineTo(-6, 146); x.quadraticCurveTo(-8, 70, 10, 10); x.closePath(); }, COL.hairD));
  // hoodie body: oversized, hood bunched at the back of the neck, pocket
  at(hx, hy, -.04, () => {
    piece(() => { x.moveTo(-34, -132); x.quadraticCurveTo(-48, -60, -44, 8); x.quadraticCurveTo(0, 18, 42, 8); x.quadraticCurveTo(46, -70, 30, -132); x.quadraticCurveTo(0, -146, -34, -132); }, COL.hood);
    piece(() => { x.ellipse(-28, -128, 22, 14, -.3, 0, 7); }, COL.hoodD);
    piece(() => rr(-6, -46, 44, 30, 8), COL.hoodD);
  });
  at(hx, hy, 0, () => leg(thigh(sw), knee(p), -sw * .2, false));
  // head: face in profile, dot eye, blush, hair cap and fringe
  at(hx + 6, hy - 186 + Math.cos(p * 2) * 1.5, sw * .03, () => {
    piece(() => { x.moveTo(-4, 40); x.lineTo(10, 40); x.lineTo(10, 22); x.lineTo(-4, 22); x.closePath(); }, COL.skin);
    piece(() => { x.arc(0, 0, 40, 0, 7); }, COL.skin);
    piece(() => { x.moveTo(36, -4); x.quadraticCurveTo(46, 2, 38, 10); x.closePath(); }, COL.skin);
    piece(() => { x.moveTo(-44, 8); x.quadraticCurveTo(-48, -44, 0, -46); x.quadraticCurveTo(40, -46, 44, -12); x.quadraticCurveTo(26, -20, 14, -12); x.quadraticCurveTo(-4, -6, -12, 6); x.quadraticCurveTo(-26, 30, -40, 34); x.closePath(); }, COL.hair);
    x.fillStyle = '#121212'; x.beginPath(); x.ellipse(22, 2, 3.6, 4.6, 0, 0, 7); x.fill();
    x.fillStyle = 'rgba(240,150,140,.55)'; x.beginPath(); x.ellipse(18, 16, 7, 4, 0, 0, 7); x.fill();
    x.strokeStyle = '#8a5a4a'; x.lineWidth = 1.8; x.beginPath(); x.moveTo(30, 24); x.lineTo(36, 23); x.stroke();
  });
  at(hx - 2, hy - 120, 0, () => arm(-sw * .5, -.3 - Math.max(0, -sw) * .35, false));
  // soft shadow on the ground under her
  x.fillStyle = 'rgba(80,60,40,.18)'; x.beginPath(); x.ellipse(hx + 8, 456, 58, 7, 0, 0, 7); x.fill();
  x.drawImage(grain, 0, 0);
};
window.renderAt(0);
</script></body></html>
