  phone1(t, k) { return phoneShot(t, k, -5.0); },
  phone2(t, k) { return phoneShot(t, k, -8.0); },
  phone3(t, k) { return phoneShot(t, k, -10.0); },
  breath(t, k) { MODE.m = 'dark'; place(haru, 2.0, -10.6, PI); torchOn(haru); haru.eyes.forEach(e => e.scale.set(1, 1.7, .5)); haru.arms[0].sh.rotation.set(-1.4, 0, -.2);
    const h = headW(haru); return [V(h.x + .6, h.y + .05, h.z - 1.15), h, 40]; },
  sees(t, k) { MODE.m = 'dark'; place(haru, 2.0, -10.6, 0); torchOn(haru, true); haru.eyes.forEach(e => e.scale.set(1.25, 2.0, .5)); haru.headPivot.rotation.set(-.08, 0, 0);

function twoOnSofa(t) { sit(haru, 1.55, -3.05, 0); sit(sana, 2.45, -3.05, 0); chips.position.copy(along(sana, V(-.15, .95, .3))); sana.arms[1].sh.rotation.set(-1.0 + Math.abs(Math.sin(t * 2)) * .3, 0, .4); }
function torchOn(p, flash) { torch.intensity = 26; p.g.updateMatrixWorld(true); const s = along(p, V(.2, 1.15, .3)); torch.position.copy(s); torch.target.position.copy(along(p, V(.1, .9, 5))); if (flash) torch.target.position.copy(along(p, V(0, 1.4, 5))); }

  MODE.m = 'dark'; MODE.phone = true;
  const z = -9.6 - (t - 60.5) * .18; place(haru, 2.0, z, PI); torchOn(haru); haru.arms[0].sh.rotation.set(-1.7, 0, -.4);
  her.g.visible = true; her.g.position.set(1.72, 0, herZ); her.g.rotation.y = PI; her.headPivot.rotation.set(.25, 0, 0);
  her.arms.forEach(a => { a.sh.rotation.set(.05, 0, 0); a.el.rotation.set(-.1, 0, 0); });

// ---------------------------------------------------------------- render one frame
function renderAt(t) {
  let i = 0; while (i < CUTS.length - 1 && CUTS[i + 1][0] <= t) i++;
  const [t0, name] = CUTS[i], t1 = CUTS[i + 1][0], k = clamp01((t - t0) / (t1 - t0));
  ALL.forEach(reset); MODE.m = 'warm'; MODE.phone = false; MODE.photo = false;
  hallDoor.rotation.y = t < 27 ? 0 : 1.5; toiletDoor.rotation.y = -PI / 2; bedDoor.rotation.y = PI / 2; endDoor.rotation.y = 0;

  ovenL.intensity = (m === 'warm' || m === 'nightOut') ? 1.6 : m === 'dark' || m === 'night' ? .4 : 0;
  nightL.intensity = m === 'night' ? 1.6 : m === 'dark' ? .25 : 0; backL.intensity = m === 'dark' ? 2.4 : 0; endDoorL.intensity = (m === 'dark' || m === 'night') ? 2.2 : 0;
  streetL.intensity = m === 'nightOut' ? 3 : 0; sunL.intensity = m === 'day' ? 2.2 : 0; hemi.intensity = m === 'day' ? 1.1 : m === 'nightOut' ? .2 : m === 'warm' ? .35 : .16;
  hemi.color.set(m === 'day' ? 0xdfe8ff : 0x8a90a8);

  // steam: from the oven / the kitchen window / under grandma's door
  steam.forEach((o, j) => {
    const ph = ((t * .25 + o.k) % 1);
    if (name === 'hook' || name === 'hookEnd') { o.m.visible = true; o.m.position.set(-3.9 + (o.s - .5) * .8 + ph * .3, 1.4 + ph * 1.6, .25 + ph * .2); }
    else if (['oven', 'arrive', 'sana'].includes(name)) { o.m.visible = true; o.m.position.set(-5.2 + (o.s - .5) * .4, .95 + ph * 1.3, -3.2 + ph * .1); }
    else if (['hallLong', 'passToilet'].includes(name)) { o.m.visible = true; o.m.position.set(2.0 + (o.s - .5) * 1.0, .05 + ph * .5, -15.9 + ph * .5); }
    else if (name === 'piesill') { o.m.visible = j < 6; o.m.position.set(-3.9 + (o.s - .5) * .2, 1.12 + ph * .5, .18); o.m.scale.setScalar(.12 + ph * .4); return; }
    else o.m.visible = false;
    o.m.scale.setScalar(.25 + ph * .9); });
  cam.position.copy(pos); cam.lookAt(look); cam.fov = fov; cam.updateProjectionMatrix();
  if (name === 'rush') cam.position.add(V(Math.sin(t * 40) * .02, Math.sin(t * 33) * .02, 0));
  key.position.copy(pos).add(V(.2, .3, 0)); key.intensity = m === 'day' ? 0 : m === 'dark' ? .9 : m === 'nightOut' ? 0 : .9;

}
window.renderAt = renderAt; window.DUR = DUR; window.ready = true;
window.MODE = MODE; window.dbg = () => { const r = v => v.toArray().map(x => +x.toFixed(2)); return {cam: r(cam.position), haru: r(headW(haru)), hv: haru.g.visible, sana: r(headW(sana))}; };
