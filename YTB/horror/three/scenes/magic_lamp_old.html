// THE MAGIC LAMP (9:16, 89.5 s), dark clay stop-motion in the Tooth Fairy / Thanksgiving style (clay.js kit, raster render).
// Timed to YTB/horror/magic_lamp/voice/layout.json (copied to three/data). Poses held on twos; the clay boils every other pose.
// Each place is its own group at the origin; only the one in use is shown (its lights go with it).
import {THREE, setup, ease, clamp01, lerp} from './lib.js';
import {clay, gloss, lump, boil, add, S, Cp, G, makePerson, haruOpts, mumOpts} from './clay.js';
const PS = +(new URLSearchParams(location.search).get('s') || 1);
const {scene, cam, renderer, render} = setup({bloom: .6, w: Math.round(1080 * PS), h: Math.round(1920 * PS)});
const DUR = 89.5, PI = Math.PI, V = (x, y, z) => new THREE.Vector3(x, y, z);
renderer.setClearColor(0x000000); scene.background = new THREE.Color(0x020203);
cam.near = .01; cam.far = 40; cam.updateProjectionMatrix();
let rs = 9; const rnd = () => (rs = (rs * 16807) % 2147483647) / 2147483647;
const box = (w, h, d, a = .01, f = 2, seg = 10) => lump(new THREE.BoxGeometry(w, h, d, seg, seg, seg), a, f);
const LAY = Object.fromEntries((await (await fetch('/data/magic_lamp_layout.json')).json()).map(l => [l.name, l]));

const ST = n => LAY[n].start, EN = n => LAY[n].end;

// ================================================================ materials
const M = {
  brass: gloss(0x8a6a2c, {roughness: .45, metalness: .55}), brassD: clay(0x4a3614, {bumpScale: 1.2}), brassL: gloss(0xb8923e, {roughness: .35, metalness: .6}),
  oil: gloss(0x1a1006, {roughness: .05}), coin: gloss(0xc9a24a, {roughness: .3, metalness: .7}), hole: new THREE.MeshBasicMaterial({color: 0xffe0a8}),
  wall: clay(0x3a2a24), wallB: clay(0x2a3446), floor: clay(0x3e2a20), wood: clay(0x5a3a26), woodD: clay(0x34221a), sheet: clay(0xcfc8b6), blanket: clay(0x3e5274),
  cloth: clay(0x7a2a2a, {side: THREE.DoubleSide}), awn: clay(0xd8c48a, {side: THREE.DoubleSide}), awnR: clay(0xa83a2a, {side: THREE.DoubleSide}),
  ground: clay(0x6a5e4e), sky: new THREE.MeshBasicMaterial({color: 0x46526a}), win: new THREE.MeshBasicMaterial({color: 0x1a2a48}), moonM: new THREE.MeshBasicMaterial({color: 0xe8ecdc}),
  paper: clay(0xefe8d8), red: clay(0xb02020), fridge: clay(0xd8d2c4), tile: clay(0x9a9a8a), metal: gloss(0x9a9a98, {roughness: .3}),

// ================================================================ the magic lamp (a prop): brass, dented, an engraved band
function magicLamp() {
  const g = new THREE.Group();
  const prof = [[0, 0], [.06, .005], [.08, .02], [.11, .05], [.12, .08], [.1, .11], [.06, .125], [.035, .13], [.03, .15], [0, .155]].map(([x, y]) => new THREE.Vector2(x, y));
  add(lump(new THREE.LatheGeometry(prof, 32), .003, 20), M.brass, g).scale.z = .8;
  add(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(.09, .07, 0), V(.17, .09, 0), V(.24, .14, 0), V(.29, .17, 0)]), 16, .018, 8), M.brass, g);
  add(lump(new THREE.TorusGeometry(.055, .012, 8, 18, PI * 1.2), .001, 30), M.brass, g, [-.13, .09, 0], [0, 0, PI * .4]);
  add(S(.03, 1, 1, 1, .001, 30), M.brass, g, [0, .165, 0]); add(S(.012), M.brass, g, [0, .2, 0]);
  for (let i = 0; i < 20; i++) { const a = i / 20 * PI * 2; add(S(.006), M.brassD, g, [Math.sin(a) * .118, .085, Math.cos(a) * .094]); }
  const glow = add(S(.014), new THREE.MeshBasicMaterial({color: 0xffb060}), g, [.297, .175, 0]); glow.visible = false;
  g.userData.glow = glow; g.userData.tip = V(.3, .17, 0); return g;
}

// ================================================================ brass people: makePerson with every material turned brass
const BRASS_KEEP = ['eye', 'white', 'mouth', 'gum', 'tooth'];
function brassify(P, k = 1, tint = 0x8a6a2c) {
  const t = new THREE.Color(tint);
  for (const [n, m] of Object.entries(P.M)) { if (BRASS_KEEP.includes(n)) continue;
    m.userData.c0 = m.userData.c0 || m.color.clone(); m.color.copy(m.userData.c0).lerp(t, k);
    m.metalness = .55 * k; m.roughness = lerp(m.userData.r0 ?? (m.userData.r0 = m.roughness), .45, k); }
}
function reset(P) {
  P.root.position.set(0, 0, 0); P.root.rotation.set(0, 0, 0); P.hips.position.set(0, .82, 0); P.hips.rotation.set(0, 0, 0);
  P.chest.rotation.set(0, 0, 0); P.neck.rotation.set(0, 0, 0); P.head.rotation.set(0, 0, 0); P.back.rotation.set(0, 0, 0);
  P.arms.forEach(({up, fo, hand}, i) => { up.rotation.set(0, 0, (i ? 1 : -1) * .06); fo.rotation.set(-.12, 0, 0); hand.rotation.set(0, 0, 0); });
  P.legs.forEach(({th, sh, ft}) => { th.rotation.set(0, 0, 0); sh.rotation.set(0, 0, 0); ft.rotation.set(0, 0, 0); });
  P.eyes('open'); P.brows(0); P.mouth('closed'); P.root.visible = true;
}
function walk(P, t, speed = 1, amp = 1) {
  const ph = t * PI * 2 * speed, sw = Math.sin(ph);
  P.hips.position.y = .82 - (1 - Math.cos(.42 * amp * sw)) * .74 + Math.abs(Math.cos(ph)) * .012 * amp;
  P.legs.forEach(({th, sh, ft}, i) => { const q = i ? -sw : sw, kn = Math.max(0, Math.sin(ph + (i ? PI : 0) - .6)) * (.9 + .5 * (amp - 1));
    th.rotation.x = -q * .42 * amp; sh.rotation.x = kn; ft.rotation.x = -kn * .5 + q * .2; });
  P.arms.forEach(({up, fo}, i) => { const q = i ? sw : -sw; up.rotation.x = -q * .4 * amp; fo.rotation.x = -.2 - Math.max(0, q) * .4 * amp; });
}
function sitAt(P, x, y, z, ry, sc = 1) { P.root.rotation.y = ry; P.root.position.set(x, y - .82 * sc, z); P.legs.forEach(({th, sh}) => { th.rotation.x = -1.5; sh.rotation.x = 1.5; }); }
function faceTo(P, v, k = 1) {
  P.root.updateMatrixWorld(true); const hp = P.head.getWorldPosition(V(0, 0, 0));
  let a = Math.atan2(v.x - hp.x, v.z - hp.z) - P.root.rotation.y; a = Math.atan2(Math.sin(a), Math.cos(a));
  P.head.rotation.y = Math.max(-1.2, Math.min(1.2, a)) * k;
  P.head.rotation.x = Math.max(-.6, Math.min(.6, -Math.atan2(v.y - hp.y, Math.hypot(v.x - hp.x, v.z - hp.z)))) * k;
}
// talking from Rhubarb cues: closed lips (A, X), slightly open (B, F, G), open (C, D, E, H)
function talk(P, name, t) {
  const c = (MOUTH[name] ? MOUTH[name].cues : []).find(c => t >= c.start && t < c.end);
  if (!c || c.value === 'X' || c.value === 'A') return false;
  P.mouth('open', {B: .35, F: .3, G: .3, C: .6, D: 1, E: .7, H: .55}[c.value] || .5); return true;
}

const radius = y => { const u = y / Hh; return Rr * (1 - .15 * u) * (u < .55 ? 1 : 1 - Math.pow((u - .55) / .45, 1.6) * .9) + .035 * Math.sin(y * 16); };
const prof = []; for (let i = 0; i <= 90; i++) { const y = i / 90 * Hh; prof.push(new THREE.Vector2(radius(y), y)); }

for (let i = 0; i < 60; i++) { const y = .4 + rnd() * 4, a = rnd() * PI * 2, p = wallAt(a, y, .02);                      // oil drops and runs
  add(S(.014 + rnd() * .01, 1, 1.6, .5), M.oil, LAMP, p.toArray()); if (rnd() < .5) add(Cp(.005, .15 + rnd() * .2), M.oil, LAMP, [p.x, p.y - .12, p.z]); }
for (let i = 0; i < 8; i++) { const a = i * 2.3, r = .6 + (i % 4) * .35, h = G(LAMP, [Math.sin(a) * r, 0, Math.cos(a) * r]); h.rotation.set((i % 3 - 1) * .3, a, 0);   // hands in the floor
  add(Cp(.03, .14), M.brassD, h, [0, .07, 0]); add(S(.04, 1, .9, .45), M.brassD, h, [0, .17, 0]);
  for (let k = 0; k < 3; k++) add(Cp(.01, .045), M.brassD, h, [(k - 1) * .022, .225, .01], [-.3 - i * .05, 0, 0]); }
const lampSpot = new THREE.SpotLight(0xffd9a0, 0, 9, .28, .8, 1.3); lampSpot.position.set(0, Hh - .1, 0); lampSpot.target.position.set(0, 0, 0); lampSpot.castShadow = true; lampSpot.shadow.mapSize.set(1024, 1024); LAMP.add(lampSpot, lampSpot.target);

  s.position.set(Math.sin(a) * .3, Hh - .3, Math.cos(a) * .3); s.target.position.copy(wallAt(a, 1.0, .1)); LAMP.add(s, s.target); wallRake.push(s); }

add(lump(new THREE.SphereGeometry(.6, 30, 16, 0, PI * 2, 0, PI / 2).scale(1, .9, .9), .02, 6), M.brassD, heap);

  add(new THREE.CylinderGeometry(.028, .028, .006, 12), M.coin, heap, [Math.sin(a) * r, y + .004, Math.cos(a) * r * .9], [(rnd() - .5), rnd() * 6, (rnd() - .5)]); }

const mother = makePerson(Object.assign({}, mumOpts, {top: 0x4a3a40})); brassify(mother, 1, 0x7a5c28); LAMP.add(mother.root);
const baby = makePerson({longHair: false, hood: false, pocket: false, hair: 0x8a7a5a, scale: .32}); brassify(baby, 1, 0x806028); LAMP.add(baby.root);
const swaddle = add(S(.42, .8, 1.3, .7, .02, 6), M.brassD, baby.chest, [0, -.3, .02]);
const motherPos = wallAt(-1.0, 0, .75);
const boy = makePerson({top: 0x3a5a3a, pants: 0x4a4030, longHair: false, hood: false, scale: .8, hair: 0x2a2420}); brassify(boy, 1, 0x86662c); LAMP.add(boy.root);
const boyA = 2.5, boyPos = wallAt(boyA, 0, .55);
const boyArms = G(LAMP);
const wallPeople = [];
for (let i = 0; i < 9; i++) { const a = i / 9 * PI * 2 + .2; if ([.9, -1.0 + 2 * PI, boyA, PI].some(s => Math.abs(((a - s + PI) % (2 * PI) + 2 * PI) % (2 * PI) - PI) < .45)) continue;
  const P = makePerson({top: [0x5a4a3a, 0x3a3a4a, 0x4a3a2a][i % 3], longHair: i % 2 === 0, bun: i % 3 === 1, hood: false, scale: .9 + rnd() * .2}); brassify(P, 1, i % 2 ? 0x6e5a2c : 0x7a6430);
  const y = .2 + (i % 3) * .45, p = wallAt(a, y, .06); P.root.position.set(p.x, y - .02, p.z); P.root.rotation.y = a + PI;
  P.arms.forEach(({up, fo}, k) => { up.rotation.set(-.3 - rnd() * .6, 0, (k ? 1 : -1) * (.3 + rnd() * .6)); fo.rotation.set(-rnd() * 1.2, 0, 0); });
  add(lump(new THREE.TorusGeometry(.36, .08, 8, 30).scale(1, 2.2, .5), .01, 6), M.brassD, LAMP, wallAt(a, y + .82, -.02).toArray(), [0, a, 0]);   // melted brass round them
  P.mouth('closed'); LAMP.add(P.root); wallPeople.push(P); }
// the girl who comes out: an old dress (a long cone skirt over the legs), brass that warms into clay
const girl = makePerson({top: 0x3e3038, pants: 0x3e3038, shoe: 0x2a2220, hood: false, pocket: false});
const skirtG = add(lump(new THREE.CylinderGeometry(.14, .3, .72, 24, 6, true), .006, 8), clay(0x3e3038, {side: THREE.DoubleSide}), girl.hips, [0, -.38, 0]);
girl.M.skirt = skirtG.material; brassify(girl, 1, 0x7a6230); LAMP.add(girl.root);

// ================================================================ THE MARKET (late afternoon, overcast)
const MK = G(scene);

add(new THREE.PlaneGeometry(16, 8), M.sky, MK, [0, 4, -4.5]);
function stall(x, z, ry, col) { const g = G(MK, [x, 0, z]); g.rotation.y = ry;
  add(box(1.4, .06, .7, .004, 4), M.wood, g, [0, .74, 0]); for (const [a, b] of [[-.64, -.3], [.64, -.3], [-.64, .3], [.64, .3]]) add(Cp(.03, .7), M.woodD, g, [a, .37, b]);
  add(box(1.5, .02, .8, .003, 6), col, g, [0, .78, 0]); add(new THREE.PlaneGeometry(1.5, .3), col, g, [0, .64, .41]);
  for (const sx of [-1, 1]) add(Cp(.02, 1.3), M.woodD, g, [sx * .7, 1.4, -.35]);
  for (let i = 0; i < 6; i++) add(new THREE.PlaneGeometry(.26, .9), i % 2 ? M.awn : M.awnR, g, [-.65 + i * .26, 2.0, 0], [-1.25, 0, 0]);
  return g; }

const lampMK = magicLamp(); stallMain.add(lampMK); lampMK.position.set(.15, .79, .12); lampMK.rotation.y = -.6;
[[-2.0, -.6, .3], [2.0, -.6, -.3], [-1.1, -2.8, 0], [1.2, -2.9, 0]].forEach(([x, z, r], k) => stall(x, z, r, clay([0x3a5a8a, 0x8a3a5a, 0x4a7a5a, 0xb87a2e][k])));
for (let i = 1; i < 18; i++) { const x = -3 + i * .35; add(new THREE.ConeGeometry(.07, .16, 3), clay([0xc9502e, 0xe0b040, 0x3a7a9a][i % 3]), MK, [x, 2.45 - Math.sin(i / 18 * PI) * .3, -1.1], [0, 0, PI]); }
const mkSun = new THREE.DirectionalLight(0xffc890, 1.3); mkSun.position.set(3, 6, 4); mkSun.castShadow = true; mkSun.shadow.mapSize.set(2048, 2048);
Object.assign(mkSun.shadow.camera, {left: -4, right: 4, top: 4, bottom: -2}); MK.add(mkSun, mkSun.target); MK.add(new THREE.HemisphereLight(0x8a96a8, 0x5a4a3a, .6));
const mkFill = new THREE.DirectionalLight(0xb8c4e0, .9); mkFill.position.set(1, 2, 6); MK.add(mkFill);   // the sky behind the camera, so faces read

// ================================================================ THE KITCHEN (night)
const KI = G(scene);
add(box(5, .1, 5, .01, 1.2), M.floor, KI, [0, -.05, 0]); add(box(5, 3, .1, .015, 1), clay(0x4a5246), KI, [0, 1.5, -2.2]).castShadow = false; add(box(.1, 3, 5, .015, 1), clay(0x4a5246), KI, [-2.3, 1.5, 0]).castShadow = false;
add(box(2.6, .9, .6, .008, 3), clay(0x5a6a56), KI, [-.6, .45, -1.85]); add(box(2.64, .05, .64, .004, 6), M.tile, KI, [-.6, .92, -1.85]);
add(box(.75, 1.8, .7, .01, 3), M.fridge, KI, [1.3, .9, -1.8]);
add(box(1.2, .05, .8, .004, 4), M.wood, KI, [-.5, .74, -.2]); for (const [a, b] of [[-1.05, -.55], [.05, -.55], [-1.05, .15], [.05, .15]]) add(Cp(.025, .7), M.woodD, KI, [a, .36, b]);
const kchair = G(KI, [-1.25, 0, -.2]); kchair.rotation.y = PI / 2; add(box(.42, .05, .4, .003, 6), M.wood, kchair, [0, .45, 0]); add(box(.42, .55, .04, .003, 6), M.wood, kchair, [0, .74, -.19]);
const card = add(new THREE.PlaneGeometry(.21, .28), M.paper, KI, [-.85, .775, -.2], [-PI / 2, 0, .3]);
add(new THREE.TorusGeometry(.03, .006, 6, 16), M.red, KI, [-.8, .78, -.27], [-PI / 2, 0, 0]);
const pend = new THREE.PointLight(0xffc070, 3.2, 3.5, 1.5); pend.position.set(-.5, 1.85, -.2); pend.castShadow = true; pend.shadow.mapSize.set(1024, 1024); KI.add(pend);
add(new THREE.ConeGeometry(.2, .16, 20, 1, true), clay(0x3a4a42, {side: THREE.DoubleSide}), KI, [-.5, 1.95, -.2]);
add(S(.035), new THREE.MeshBasicMaterial({color: 0xffe0a0}), KI, [-.5, 1.88, -.2]);
KI.add(new THREE.HemisphereLight(0x3a4050, 0x0a0806, .25));

// ================================================================ THE BEDROOM (night; morning at the end)
const BR = G(scene);
add(box(5, .1, 5, .01, 1.2), M.floor, BR, [0, -.05, 0]); add(box(5, 3, .1, .015, 1), M.wallB, BR, [0, 1.5, -2.2]).castShadow = false; add(box(.1, 3, 5, .015, 1), M.wallB, BR, [-2.3, 1.5, 0]).castShadow = false;   // the moon comes in through the window
add(new THREE.PlaneGeometry(.9, 1.0), M.win, BR, [-2.24, 1.55, -.8], [0, PI / 2, 0]); add(S(.08), M.moonM, BR, [-2.23, 1.8, -.6]);
for (const [w, h, y, z] of [[.06, 1.06, 1.55, -1.25], [.06, 1.06, 1.55, -.35], [.06, .9, 2.05, -.8], [.06, .9, 1.05, -.8]]) add(box(.06, h, w === .06 && h > 1 ? .06 : .9, .002, 8), M.woodD, BR, [-2.22, y, z]);
const bedG = G(BR, [-1.2, 0, -1.3]); add(box(1.0, .3, 2.0, .006, 3), M.woodD, bedG, [0, .15, 0]); add(box(1.0, .2, 2.0, .01, 3), M.sheet, bedG, [0, .38, 0]);
add(box(1.04, .07, 1.2, .008, 4), M.blanket, bedG, [0, .5, .35]); add(box(.7, .12, .36, .01, 4), M.sheet, bedG, [0, .53, -.75]); add(box(1.0, .8, .08, .006, 4), M.woodD, bedG, [0, .4, -1.02]);
const stand = add(box(.45, .55, .4, .006, 4), M.wood, BR, [-.35, .275, -1.95]);
add(box(1.0, .03, .22, .003, 6), M.woodD, BR, [.6, 1.55, -2.08]); for (let i = 0; i < 5; i++) add(box(.035, .2, .14, .002, 10), clay([0x8a3a32, 0x3a5a7a, 0x6a7a3a, 0xc9a24a][i % 4]), BR, [.25 + i * .045, 1.665, -2.08]);
const lampBR = magicLamp(); BR.add(lampBR);
const moonL = new THREE.DirectionalLight(0x7088c0, 1.3); moonL.position.set(-4, 2.4, -.6); moonL.target.position.set(0, .5, -.8); moonL.castShadow = true; moonL.shadow.mapSize.set(1024, 1024);

const brAmb = new THREE.HemisphereLight(0x3a4a6a, 0x080606, .25); BR.add(brAmb);
const morningL = new THREE.DirectionalLight(0xffe2b8, 0); morningL.position.set(-4, 2.6, -.4); morningL.target.position.set(0, .6, -1); morningL.castShadow = true; BR.add(morningL, morningL.target);
const lampGlowL = new THREE.PointLight(0xffa040, 0, 1.6, 1.6); BR.add(lampGlowL);
const morningFill = new THREE.PointLight(0xffe2c4, 0, 4, 1.2); morningFill.position.set(-.25, 1.45, -1.45); BR.add(morningFill);   // daylight bouncing round the room
const door = G(BR, [1.4, 0, -2.14]); add(box(.85, 2.0, .05, .004, 4), M.woodD, door, [.425, 1.0, 0]);

// ================================================================ the cast
const haru = makePerson(haruOpts); scene.add(haru.root);
const fake = makePerson(haruOpts); scene.add(fake.root);                                                            // the thing wearing her
const mum = makePerson(mumOpts); scene.add(mum.root);
