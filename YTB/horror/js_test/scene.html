<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {GTAOPass} from 'three/addons/postprocessing/GTAOPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
// Low-poly horror test, built entirely in code. window.renderAt(t) draws the frame at t seconds.
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({antialias: true, preserveDrawingBuffer: true});
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xe8d3b0, 6, 20);
const cam = new THREE.PerspectiveCamera(46, W / H, 0.05, 60);

// ---------------------------------------------------------------- helpers
const flat = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, flatShading: true, roughness: .85, metalness: 0}, o));
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; parent.add(m); return m;
}
function jitterGeo(g, amt, seed) {                     // break up perfect shapes a little: the hand-made low-poly look
  let s = seed; const r = () => (s = (s * 9301 + 49297) % 233280) / 233280 - .5;
  const p = g.attributes.position, seen = {};
  for (let i = 0; i < p.count; i++) {
    const k = p.getX(i).toFixed(3) + p.getY(i).toFixed(3) + p.getZ(i).toFixed(3);
    if (!seen[k]) seen[k] = [r() * amt, r() * amt, r() * amt];
    p.setXYZ(i, p.getX(i) + seen[k][0], p.getY(i) + seen[k][1], p.getZ(i) + seen[k][2]);
  }
  g.computeVertexNormals(); return g;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const maskTex = canvasTex(256, 300, (g, w, h) => {      // flat paper face: off-white, pin-prick eyes, too-wide grin
  g.fillStyle = '#ece6d8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(120,100,80,${Math.random() * .06})`; g.fillRect(Math.random() * w, Math.random() * h, 3, 3); }
  g.fillStyle = '#111'; g.beginPath(); g.arc(85, 120, 9, 0, 7); g.arc(171, 120, 9, 0, 7); g.fill();
  g.strokeStyle = '#111'; g.lineWidth = 7; g.beginPath(); g.moveTo(52, 185); g.quadraticCurveTo(128, 255, 204, 185); g.stroke();
});
const screenTex = canvasTex(64, 120, (g, w, h) => { g.fillStyle = '#cfe6ff'; g.fillRect(0, 0, w, h); g.fillStyle = '#7aa7d9';
  for (let y = 10; y < h; y += 18) g.fillRect(8, y, w - 16, 8); });

// ---------------------------------------------------------------- the carriage
const LEN = 16, HW = 1.55;
mesh(new THREE.BoxGeometry(HW * 2, .1, LEN), flat(0xb59a7a), 0, -.05, -LEN / 2 + 1);           // floor
mesh(new THREE.BoxGeometry(HW * 2, .1, LEN), flat(0xe9e0cf), 0, 2.45, -LEN / 2 + 1);            // ceiling
for (const sx of [-1, 1]) {
  mesh(new THREE.BoxGeometry(.1, .9, LEN), flat(0xd8ccb6), sx * HW, .45, -LEN / 2 + 1);          // lower wall
  mesh(new THREE.BoxGeometry(.1, .55, LEN), flat(0xd8ccb6), sx * HW, 2.2, -LEN / 2 + 1);         // upper wall
  for (let z = .6; z > -LEN + 1; z -= 1.6) {                                                     // window posts
    mesh(new THREE.BoxGeometry(.12, 1.05, .22), flat(0xcfc3ac), sx * HW, 1.42, z);
    const glass = mesh(new THREE.PlaneGeometry(1.36, 1.0), new THREE.MeshBasicMaterial({color: 0xfff1d6}), sx * (HW + .04), 1.42, z - .8);
    glass.rotation.y = -sx * Math.PI / 2; glass.castShadow = false; glass.userData.window = true;
  }
  mesh(new THREE.BoxGeometry(.5, .14, LEN - 1), flat(0x9c5b55), sx * 1.22, .48, -LEN / 2 + 1);   // bench seat
  mesh(new THREE.BoxGeometry(.12, .5, LEN - 1), flat(0x8a4e49), sx * 1.46, .75, -LEN / 2 + 1);   // bench back
  mesh(new THREE.CylinderGeometry(.02, .02, LEN, 6), flat(0xb8b8b8, {metalness: .6}), sx * .95, 2.2, -LEN / 2 + 1).rotation.x = Math.PI / 2;
  for (let z = .2; z > -LEN + 1; z -= .55) {                                                     // hanging handles
    mesh(new THREE.BoxGeometry(.03, .22, .03), flat(0xd98a3a), sx * .95, 2.05, z);
    mesh(new THREE.TorusGeometry(.07, .015, 4, 6), flat(0xf2efe8), sx * .95, 1.88, z);
  }
}
for (let z = -4.5; z > -LEN + 1; z -= 4.5) mesh(new THREE.CylinderGeometry(.025, .025, 2.5, 6), flat(0xc9c9c9, {metalness: .5}), 0, 1.25, z);
mesh(new THREE.BoxGeometry(1.1, 2.0, .1), flat(0x8f8a82), 0, 1.0, -LEN + 1.05);                  // end door
mesh(new THREE.PlaneGeometry(.5, .6), new THREE.MeshBasicMaterial({color: 0xf6e7c9}), 0, 1.45, -LEN + 1.11);
const lamps = [];
for (let z = -.5; z > -LEN + 1; z -= 2.2) {
  const l = mesh(new THREE.BoxGeometry(.25, .04, 1.4), new THREE.MeshBasicMaterial({color: 0xffffff}), 0, 2.39, z); l.castShadow = false; lamps.push(l);
}
// sun stripes on the floor + light shafts: soft additive quads (cheap, fully controllable)
const shafts = [];
const shaftMat = new THREE.MeshBasicMaterial({color: 0xffc77a, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false});
for (let z = .2; z > -LEN + 1; z -= 1.6) {
  const s = mesh(new THREE.PlaneGeometry(1.25, .95), shaftMat, .35, .005, z - .8); s.rotation.x = -Math.PI / 2; s.rotation.z = .25;
  s.castShadow = false; s.receiveShadow = false; shafts.push(s);
}

// ---------------------------------------------------------------- people
const people = [];
function person(o) {
  const g = new THREE.Group(); scene.add(g);
  const coat = flat(o.coat), skin = flat(o.skin || 0xf1c9a5), hairM = flat(o.hair || 0x1d1714), pants = flat(o.pants || 0x6c6f78);
  const seed = o.seed || 7;
  for (const sx of [-.1, .1]) {                                   // thighs forward, shins down
    mesh(jitterGeo(new THREE.BoxGeometry(.15, .14, .42), .02, seed), pants, sx, .6, .18, g);
    mesh(jitterGeo(new THREE.BoxGeometry(.13, .45, .14), .02, seed + 1), pants, sx, .3, .38, g);
    mesh(new THREE.BoxGeometry(.13, .07, .22), flat(0x2a2522), sx, .04, .43, g);
  }
  const body = new THREE.Group(); body.position.set(0, .62, -.02); g.add(body);
  mesh(jitterGeo(new THREE.CylinderGeometry(.17, .23, .62, 6), .03, seed + 2), coat, 0, .3, 0, body);
  const headPivot = new THREE.Group(); headPivot.position.set(0, .72, .02); body.add(headPivot);
  const HS = 1.45; headPivot.scale.setScalar(HS);                 // big chibi heads, like the AI art
  const head = mesh(jitterGeo(new THREE.IcosahedronGeometry(.16, 2), .018, seed + 3), skin, 0, .12, 0, headPivot); head.scale.set(1, 1.08, .95);
  const hair = mesh(jitterGeo(new THREE.IcosahedronGeometry(.172, 1), .03, seed + 4), hairM, 0, .17, -.04, headPivot); hair.scale.set(1.04, 1.0, 1);
  mesh(new THREE.ConeGeometry(.02, .05, 4), skin, 0, .09, .16, headPivot).rotation.x = Math.PI / 2;            // small nose
  mesh(new THREE.BoxGeometry(.04, .006, .01), new THREE.MeshBasicMaterial({color: 0x6b3b2e}), 0, .035, .148, headPivot); // mouth
  if (o.long) {                                                    // long black hair: two faceted curtains + back panel
    for (const sx of [-.13, .13]) mesh(jitterGeo(new THREE.BoxGeometry(.06, .42, .14), .03, seed + 5), hairM, sx, -.05, -.01, headPivot);
    mesh(jitterGeo(new THREE.BoxGeometry(.3, .45, .07), .03, seed + 6), hairM, 0, -.05, -.12, headPivot);
    mesh(jitterGeo(new THREE.BoxGeometry(.27, .07, .08), .02, seed + 7), hairM, 0, .23, .12, headPivot);   // fringe
  }
  const eyeM = new THREE.MeshBasicMaterial({color: 0x0b0b0b});
  for (const sx of [-.058, .058]) {
    mesh(new THREE.SphereGeometry(.02, 8, 6), eyeM, sx, .125, .145, headPivot).scale.set(1, 1.35, .5);
    mesh(new THREE.SphereGeometry(.006, 6, 4), new THREE.MeshBasicMaterial({color: 0xffffff}), sx + .007, .135, .153, headPivot);
  }
  const mask = mesh(new THREE.PlaneGeometry(.31, .34), new THREE.MeshStandardMaterial({map: maskTex, roughness: 1, side: THREE.DoubleSide}), 0, .11, .175, headPivot);
  mask.rotation.x = -.05; mask.visible = false;
  const arms = [];
  for (const sx of [-1, 1]) {                                      // upper arm hangs, forearm reaches the phone
    const sh = new THREE.Group(); sh.position.set(sx * .2, .55, 0); body.add(sh);
    mesh(jitterGeo(new THREE.CylinderGeometry(.055, .05, .32, 5), .015, seed + 8), coat, 0, -.16, 0, sh);
    const el = new THREE.Group(); el.position.set(0, -.31, 0); sh.add(el);
    mesh(jitterGeo(new THREE.CylinderGeometry(.05, .045, .28, 5), .015, seed + 9), coat, 0, -.14, 0, el);
    mesh(new THREE.IcosahedronGeometry(.045, 0), skin, 0, -.3, 0, el);
    sh.rotation.set(-.35, 0, -sx * .12); el.rotation.set(-1.2, 0, sx * .35);
    arms.push({sh, el});
  }
  const phone = mesh(new THREE.BoxGeometry(.09, .16, .015), flat(0x222222), 0, .27, .36, body);
  phone.rotation.x = -.9;
  const scr = mesh(new THREE.PlaneGeometry(.075, .14), new THREE.MeshBasicMaterial({map: screenTex}), 0, 0, .009, phone); scr.castShadow = false;
  g.position.set(o.x, 0, o.z); g.rotation.y = o.face;
  headPivot.rotation.x = .45;                                      // looking down at the phone
  const p = {g, body, headPivot, mask, arms, phone, o}; people.push(p); return p;
}
const R = -Math.PI / 2, L = Math.PI / 2;                           // right bench faces -x, left bench faces +x
const cols = [0x6f7480, 0x2f3d63, 0xb9a487, 0x4f6d4a, 0x7b5f4a, 0x8a8f99, 0x5b5b6e];
const haru = person({x: 1.12, z: -2.6, face: R, coat: 0xe2a92b, long: true, pants: 0x3c3f4a, seed: 3});
person({x: 1.12, z: -3.35, face: R, coat: 0xd3c3a4, hair: 0x5a3b26, long: true, seed: 11});
person({x: 1.12, z: -1.6, face: R, coat: cols[0], seed: 21});
person({x: 1.12, z: -5.4, face: R, coat: cols[1], seed: 31});
person({x: 1.12, z: -6.3, face: R, coat: cols[5], seed: 41});
person({x: -1.12, z: -1.2, face: L, coat: cols[0], seed: 51});
person({x: -1.12, z: -2.1, face: L, coat: cols[1], seed: 61});
person({x: -1.12, z: -3.9, face: L, coat: cols[3], seed: 71});
person({x: -1.12, z: -4.8, face: L, coat: cols[4], hair: 0x9a9a9a, seed: 81});
person({x: -1.12, z: -6.9, face: L, coat: cols[6], seed: 91});

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xfff0dc, 0x8a6f58, 1.9); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffc98a, 2.6); sun.position.set(6, 6, -1); sun.target.position.set(0, 0, -5);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left: -6, right: 6, top: 9, bottom: -9, near: .5, far: 30}); sun.shadow.bias = -.0005;
scene.add(sun, sun.target);
const tube = new THREE.PointLight(0xdfe9ff, 0, 9, 1.4); tube.position.set(0, 2.3, -2.8); tube.castShadow = true; scene.add(tube);
const glow = new THREE.PointLight(0x9cc8ff, 0, 1.2, 2); scene.add(glow);              // phone light on Haru's face

// ---------------------------------------------------------------- timeline
const ease = x => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
const OUT = 3.0, BACK = 3.9;
function renderAt(t) {
  const dark = t >= OUT && t < BACK, night = t >= BACK;
  let lv = 1;                                                     // lights stutter out, then back on cold
  if (t >= OUT - .25 && t < OUT) lv = (Math.sin(t * 90) > 0) ? 1 : .25;
  if (night) { const k = t - BACK; lv = k < .12 ? .8 : k < .22 ? .1 : k < .34 ? 1 : k < .42 ? .3 : 1 - .08 * (Math.sin(t * 37) > .9); }
  if (dark) lv = 0;
  scene.fog.color.set(night ? 0x10141c : 0xe8d3b0); renderer.setClearColor(scene.fog.color);
  scene.fog.near = night ? 3 : 6; scene.fog.far = night ? 13 : 20;
  hemi.color.set(night ? 0x8fa3c8 : 0xfff0dc); hemi.groundColor.set(night ? 0x0c0d12 : 0x8a6f58);
  hemi.intensity = (night ? .45 : 1.9) * lv; sun.intensity = night ? 0 : 2.2 * lv;
  tube.intensity = night ? 9 * lv : 0;
  shafts.forEach(s => s.visible = !night && !dark); shaftMat.opacity = .55 * lv;
  lamps.forEach((l, i) => l.material.color.set(night ? (i === 1 ? 0xffffff * 0 + (lv > .5 ? 0xffffff : 0x333333) : 0x2a2d33) : 0xffffff));
  scene.traverse(o => { if (o.userData.window) o.material.color.set(night ? 0x05070b : 0xfff1d6); });
  for (const p of people) {
    const ph = p.o.seed;                                          // idle: thumbs scroll, small breathing
    p.arms[1].el.rotation.x = -1.2 + Math.sin(t * 6 + ph) * .05 * (Math.sin(t * 1.3 + ph) > 0);
    p.body.position.y = .62 + Math.sin(t * 1.6 + ph) * .004;
    p.body.rotation.z = Math.sin(t * 2.2) * .012;                  // the train sways everyone together
    if (p !== haru) {
      p.mask.visible = night;
      if (night) {                                                // masks slowly turn to stare at her
        const k = ease((t - BACK - .5 - (ph % 10) * .06) / 2.6);
        const dx = haru.g.position.x - p.g.position.x, dz = haru.g.position.z - p.g.position.z;
        let target = Math.atan2(dx, dz) - p.g.rotation.y; target = Math.atan2(Math.sin(target), Math.cos(target));
        p.headPivot.rotation.y = target * k * .9; p.headPivot.rotation.x = .45 * (1 - k);
        p.arms[1].el.rotation.x = -1.2; p.body.position.y = .62; // they stop breathing
      }
    }
  }
  const hp = haru;                                                // Haru: scrolls, then shakes and looks up
  if (night) {
    const k = ease((t - BACK - .3) / 1.2);
    hp.headPivot.rotation.x = .45 - .55 * k + Math.sin(t * 41) * .015 * k;
    hp.headPivot.rotation.y = Math.sin((t - BACK) * .9) * .45 * k;
    hp.body.rotation.z = Math.sin(t * 47) * .012 * k; hp.body.position.x = Math.sin(t * 53) * .006 * k;
    hp.arms.forEach(a => a.el.rotation.x = -1.2 - .25 * k);       // she pulls the phone in to her chest
  }
  const hpw = new THREE.Vector3(); hp.phone.getWorldPosition(hpw); glow.position.copy(hpw).add(new THREE.Vector3(-.1, .15, 0));
  glow.intensity = night ? 1.6 : 0;
  // camera: slow push down the aisle, then drifts toward Haru once the masks are on
  const a = ease(t / 8), b = ease((t - BACK) / 4);
  cam.position.set(-.05 + .25 * b, 1.3 - .05 * a, 1.2 - .9 * a - 1.0 * b);
  cam.lookAt(.05 + .7 * b, 1.0, -6 + 3.2 * b);
  if (night && t - BACK < .5) cam.position.x += Math.sin(t * 80) * .01;    // a jolt when the lights snap on
  renderer.toneMappingExposure = dark ? 0 : 1;
  grainPass.uniforms.seed.value = t; composer.render();
  return true;
};
// ---------------------------------------------------------------- post: ambient occlusion (soft contact shadows), glow, grain + vignette
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, cam));
const ao = new GTAOPass(scene, cam, W, H); ao.updateGtaoMaterial({radius: .35, distanceExponent: 1.5, thickness: 1, scale: 1.2}); composer.addPass(ao);
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), .45, .6, .85));
composer.addPass(new OutputPass());
const grainPass = new ShaderPass({uniforms: {tDiffuse: {value: null}, seed: {value: 0}},
  vertexShader: 'varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `uniform sampler2D tDiffuse; uniform float seed; varying vec2 vUv;
    float h(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233))+seed*7.13)*43758.5453);}
    void main(){ vec4 c=texture2D(tDiffuse,vUv); float d=distance(vUv,vec2(.5)); c.rgb*=1.-.55*smoothstep(.35,.85,d);
      c.rgb+=(h(vUv*1000.)-.5)*.045; gl_FragColor=c; }`});
composer.addPass(grainPass);
window.renderAt = renderAt;
window.ready = true;
</script>
</body></html>
